<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        /* Taslağındaki stil ayarları buraya gelecek */
        body { background: #000; color: #ccc; font-family: Tahoma; margin: 0; }
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
        .login-box { border: 2px solid #ff9900; padding: 20px; background: #111; text-align: center; }
        input { margin-bottom: 10px; padding: 8px; width: 100%; }
        #chat-window { height: 400px; overflow-y: auto; background: #050505; border: 1px solid #333; padding: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:#ff9900">KEYİFCİYİZ FM</h2>
        <input type="text" id="nick" placeholder="Nickiniz...">
        <input type="password" id="pass" placeholder="DJ Şifresi (Varsa)">
        <button onclick="baglan()" style="background:#ff9900; padding:10px; width:100%; border:none; cursor:pointer;">GİRİŞ YAP</button>
    </div>
</div>

<div id="chat-window"></div>
<input type="text" id="m-input" placeholder="Mesaj yaz..." style="width:70%;">
<button onclick="gonder()">GÖNDER</button>

<script>
    // Sunucuya bağlanma
    const socket = io();

    socket.on('connect', () => {
        console.log("Sunucuya başarıyla bağlandık!");
    });

    socket.on('connect_error', (err) => {
        console.log("Bağlantı hatası:", err);
        alert("Sunucuya bağlanılamıyor. Lütfen Render sayfasını yenileyin.");
    });

    function baglan() {
        const n = document.getElementById('nick').value;
        const p = document.getElementById('pass').value;
        if(!n) {
            alert("Lütfen bir nick girin!");
            return;
        }
        socket.emit('join', { username: n, password: p });
    }

    socket.on('authStatus', (d) => {
        document.getElementById('login-screen').style.display = 'none';
    });

    function gonder() {
        const i = document.getElementById('m-input');
        if(i.value) {
            socket.emit('sendMessage', { text: i.value });
            i.value = '';
        }
    }

    socket.on('message', (d) => {
        const chat = document.getElementById('chat-window');
        chat.innerHTML += `<div><b>${d.user}:</b> ${d.text}</div>`;
        chat.scrollTop = chat.scrollHeight;
    });
</script>
</body>
</html>
