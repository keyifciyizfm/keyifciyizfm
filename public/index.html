<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Giriş Paneli</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #1a1a1a; color: #ccc; font-family: Tahoma; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* GİRİŞ EKRANI (ÜYE OLMAYAN GİREMEZ) */
        #login-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #222; border: 2px solid #444; padding: 40px; text-align: center; width: 350px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 10px; background: #000; border: 1px solid #555; color: #fff; }
        .login-card button { width: 100%; padding: 12px; background: #ff9900; border: none; font-weight: bold; cursor: pointer; color: #000; }

        /* ARAÇLAR: YAN YANA DÜZEN */
        .toolbar { display: flex; gap: 5px; padding: 10px; background: #333; align-items: center; border-bottom: 1px solid #444; }
        .tool-btn { background: #eee; border: 1px solid #999; padding: 3px 10px; cursor: pointer; color: #000; font-size: 13px; font-weight: bold; }
        .tool-btn:active { background: #ccc; }

        /* ANA ALAN */
        .content { display: flex; flex: 1; overflow: hidden; }
        #chat-log { flex: 3; background: #000; padding: 15px; overflow-y: auto; }
        .user-sidebar { width: 220px; background: #111; border-left: 1px solid #333; padding: 10px; }
        
        .input-box { background: #222; padding: 15px; display: flex; gap: 10px; }
        #text-in { flex: 1; padding: 10px; background: #000; color: #fff; border: 1px solid #444; outline: none; }
        #visual-bar { width: 100%; height: 30px; background: #000; margin-bottom: 5px; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="color:#ff9900; margin-top:0;">ÜYE GİRİŞİ</h2>
        <input type="text" id="u-name" placeholder="Üye Adınız (Nick)...">
        <input type="password" id="u-pass" placeholder="Şifre (Sadece Adminler İçin)">
        <button onclick="girisYap()">RADYOYA BAĞLAN</button>
        <p style="font-size:10px; color:#666; margin-top:10px;">Giriş yaparak radyo kurallarını kabul etmiş sayılırsınız.</p>
    </div>
</div>

<div class="header" style="background:#111; padding:5px;">
    <canvas id="visual-bar"></canvas>
    <div class="toolbar">
        <button class="tool-btn" onclick="size('up')">A+</button>
        <button class="tool-btn" onclick="size('down')">A-</button>
        <button class="tool-btn" onclick="addEmot('😊')">😊</button>
        <button class="tool-btn" onclick="tog('bold')">B</button>
        <button class="tool-btn" onclick="tog('italic')">I</button>
        <button class="tool-btn" onclick="tog('underline')">U</button>
        <input type="color" id="c-picker" value="#ffffff" onchange="styleSet.color=this.value" style="width:40px; height:25px; border:none; background:none; cursor:pointer;">
        <button class="tool-btn" onclick="alert('Ses Ayarları')">Sound</button>
        <button class="tool-btn" id="adm-btn" style="display:none; background:#ff9900; color:#000;" onclick="alert('Mixer Açılıyor...')">Login (Mixer)</button>
    </div>
</div>

<div class="content">
    <div id="chat-log"></div>
    <div class="user-sidebar" id="u-list">
        <div style="color:#ff9900; font-size:11px; border-bottom:1px solid #333; padding-bottom:5px;">AKTİF ÜYELER</div>
    </div>
</div>

<div class="input-box">
    <input type="text" id="text-in" placeholder="Mesajınızı buraya yazın..." onkeypress="if(event.key==='Enter') gonder()">
    <button onclick="gonder()" class="tool-btn" style="padding:10px 25px; background:#ff9900; border:none;">GÖNDER</button>
</div>

<audio id="player" crossorigin="anonymous"></audio>

<script>
    const socket = io();
    let styleSet = { bold: false, italic: false, underline: false, color: '#ffffff', size: 14 };
    let myRole = "USER";

    function girisYap() {
        const nick = document.getElementById('u-name').value;
        const pass = document.getElementById('u-pass').value;
        if(!nick) return alert("Lütfen bir üye adı girin!");
        socket.emit('join', { username: nick, password: pass });
    }

    socket.on('authStatus', d => {
        myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === "ADMIN") document.getElementById('adm-btn').style.display = 'block';
    });

    function tog(t) { styleSet[t] = !styleSet[t]; }
    function size(d) { styleSet.size = (d === 'up') ? styleSet.size + 2 : styleSet.size - 2; }
    function addEmot(e) { document.getElementById('text-in').value += e; }

    function gonder() {
        const input = document.getElementById('text-in');
        if(input.value) {
            socket.emit('sendMessage', { text: input.value, format: styleSet });
            input.value = '';
        }
    }

    socket.on('message', d => {
        const chat = document.getElementById('chat-log');
        const s = `color:${d.format.color}; font-weight:${d.format.bold?'bold':'normal'}; font-style:${d.format.italic?'italic':'normal'}; text-decoration:${d.format.underline?'underline':'none'}; font-size:${d.format.size}px;`;
        chat.innerHTML += `<div style="margin-bottom:8px;"><b style="color:#ff9900">${d.user}:</b> <span style="${s}">${d.text}</span></div>`;
        chat.scrollTop = chat.scrollHeight;
    });

    socket.on('updateUserList', users => {
        const list = document.getElementById('u-list');
        list.innerHTML = '<div style="color:#ff9900; font-size:11px; border-bottom:1px solid #333; padding-bottom:5px;">AKTİF ÜYELER</div>';
        users.forEach(u => {
            let item = `<div style="padding:5px 0; font-size:13px;">● ${u.title} ${u.username}`;
            if(myRole === "ADMIN" && u.role !== "ADMIN") {
                item += ` <span style="font-size:10px; color:red; cursor:pointer;" onclick="kick('${u.id}')">[At]</span>`;
            }
            list.innerHTML += item + `</div>`;
        });
    });

    function kick(id) { socket.emit('adminAction', { action: 'kick', targetId: id }); }
    socket.on('kicked', () => { alert("Sistemden atıldınız."); window.location.reload(); });
</script>
</body>
</html>
