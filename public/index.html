<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Mixer & Sohbet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Giriş */
        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #333; padding: 25px; border-radius: 8px; text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #222; color: #fff; border: 1px solid #444; }

        /* Sohbet Konteyner */
        #chat-wrap { width: 900px; height: 600px; background: #3b3b3b; display: flex; flex-direction: column; border: 2px solid #444; position: relative; }
        #messages { flex: 1; background: #000; padding: 15px; overflow-y: auto; }
        #user-list { width: 200px; background: #111; padding: 10px; border-left: 1px solid #444; }

        /* Yüzen Mikser */
        #mixer { display: none; position: fixed; top: 50px; right: 50px; width: 260px; background: #222; border: 2px solid #ff4757; padding: 10px; z-index: 5000; cursor: move; border-radius: 10px; box-shadow: 0 5px 20px #000; }
        #playlist { height: 120px; overflow-y: auto; background: #111; margin-top: 10px; font-size: 11px; color: #2ecc71; padding: 5px; }
        .song { cursor: pointer; padding: 3px; border-bottom: 1px solid #222; }
        .song:hover { background: #333; }

        #audio-notice { position: fixed; top: 0; width: 100%; background: #f1c40f; color: #000; text-align: center; padding: 5px; cursor: pointer; font-weight: bold; display: none; z-index: 10000; }
    </style>
</head>
<body>

<div id="audio-notice" onclick="unlockAudio()">🎧 Ses Yayını Aktif - Dinlemek İçin Buraya Tıklayın</div>
<audio id="radio-player"></audio>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="color:#2ecc71">Keyifciyiz FM</h2>
        <input type="text" id="nick" placeholder="Nickiniz..." onkeyup="checkAdmin(this.value)">
        <input type="password" id="pass" placeholder="Şifre..." style="display:none;">
        <button onclick="join()" style="width:100%; padding:10px; margin-top:10px; cursor:pointer;">BAĞLAN</button>
    </div>
</div>

<div id="mixer">
    <div style="text-align:center; font-weight:bold; border-bottom:1px solid #444; padding-bottom:5px;">🎧 MİKSER</div>
    <div style="display:flex; gap:5px; margin:10px 0;">
        <button onclick="sendSysMsg('🔴 CANLI YAYIN BAŞLADI!')" style="flex:1; font-size:10px;">BAŞLAT</button>
        <button onclick="stopRadio()" style="flex:1; font-size:10px;">DURDUR</button>
    </div>
    <input type="file" id="files" multiple accept="audio/*" style="font-size:10px;">
    <div id="playlist">Müzik seçin...</div>
</div>

<div id="chat-wrap">
    <div style="height:10px; background:linear-gradient(to right, #2ecc71, #ff4757);"></div>
    <div style="display:flex; flex:1; overflow:hidden;">
        <div id="messages"></div>
        <div id="user-list">
            <b style="color:#f1c40f">Dinleyiciler</b><hr style="border:#333 1px solid; margin:10px 0;">
            <div id="users"></div>
        </div>
    </div>
    <form onsubmit="send(event)" style="display:flex; padding:10px; background:#222;">
        <input id="msg" placeholder="Mesaj yaz..." autocomplete="off">
        <button type="submit" style="width:80px; margin-left:5px;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var player = document.getElementById('radio-player');
    
    function checkAdmin(v) { document.getElementById('pass').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function join() {
        socket.emit('join', { nick: document.getElementById('nick').value, password: document.getElementById('pass').value });
    }

    socket.on('login success', d => {
        document.getElementById('login-overlay').style.display = 'none';
        if(d.role === 'Yönetici') {
            document.getElementById('mixer').style.display = 'block';
            makeDraggable(document.getElementById('mixer'));
        }
    });

    // Müzik İşlemleri
    document.getElementById('files').onchange = function(e) {
        const p = document.getElementById('playlist'); p.innerHTML = "";
        Array.from(e.target.files).forEach(file => {
            let d = document.createElement('div'); d.className = "song"; d.innerText = "▶ " + file.name;
            d.onclick = () => {
                let r = new FileReader();
                r.onload = (ev) => socket.emit('play music', { name: file.name, data: ev.target.result });
                r.readAsDataURL(file);
            };
            p.appendChild(d);
        });
    };

    function unlockAudio() { player.play().then(() => { player.pause(); document.getElementById('audio-notice').style.display = 'none'; }); }
    function stopRadio() { socket.emit('stop music'); }
    function sendSysMsg(txt) { socket.emit('chat message', { text: txt }); }

    socket.on('client play', d => {
        document.getElementById('audio-notice').style.display = 'block';
        player.src = d.data; player.play();
    });
    socket.on('client stop', () => { player.pause(); player.src = ""; });

    // Sohbet İşlemleri
    function send(e) { e.preventDefault(); let i = document.getElementById('msg'); socket.emit('chat message', { text: i.value }); i.value = ''; }
    socket.on('chat message', d => {
        let div = document.createElement('div'); div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> ${d.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 100000;
    });

    socket.on('user list', d => {
        let uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        d.list.forEach(u => { if(u.nick !== "Keyifciyiz_Fm") uDiv.innerHTML += `<div style="color:${u.color}">${u.nick}</div>`; });
    });

    // Sürükleme
    function makeDraggable(el) {
        let p1=0, p2=0, p3=0, p4=0;
        el.onmousedown = (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            p3 = e.clientX; p4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (e) => {
                p1 = p3 - e.clientX; p2 = p4 - e.clientY; p3 = e.clientX; p4 = e.clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
            };
        };
    }
</script>
</body>
</html>
