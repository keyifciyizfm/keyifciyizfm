<input type="file" id="musicFile" accept="audio/*">
<audio id="player" controls></audio>

<button onclick="initMixerEngine()">1. Motoru Başlat</button>
<button onclick="loadMusicToMixer(document.getElementById('musicFile'), document.getElementById('player'))">2. Müziği Oynat</button>
<button onclick="enableMic()">3. Mikrofonu Aç</button>
<button onclick="startBroadcasting(socket)">4. Yayına Ver</button>

<input type="range" min="0" max="1" step="0.1" oninput="musicGain.gain.value = this.value">
