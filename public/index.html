<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Flatcast Style Pro</title>
    <style>
        /* TASARIMIN AYNI KALIYOR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 5px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; gap: 5px; user-select: none; }
        .f-btn.active { background: #2ecc71; color: #000; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { padding: 4px 0; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 5px; }
        #emoji-panel { display: none; position: absolute; bottom: 60px; left: 12px; background: #333; border: 2px solid #555; padding: 12px; display: flex; flex-wrap: wrap; gap: 12px; width: 280px; border-radius: 5px; z-index: 50; }
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }

        /* MİXER PANELİ */
        #dj-mixer { 
            display: none; position: absolute; top: 50px; right: 50px; width: 280px; 
            background: #2c3e50; border: 2px solid #f1c40f; border-radius: 8px; 
            z-index: 3000; box-shadow: 0 10px 40px #000; 
        }
        .mixer-head { background: #f1c40f; color: #000; padding: 8px; font-weight: bold; font-size: 11px; cursor: move; text-align: center; border-radius: 6px 6px 0 0; }
        .mixer-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .m-btn { width: 100%; padding: 8px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; color: white; }
        .m-mic { background: #2980b9; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM Giriş</h3>
        <input type="text" id="nick-input" placeholder="Nickiniz..." oninput="checkAdmin(this.value)" style="padding:10px; margin-bottom:10px; display:block; width:100%;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="padding:10px; margin-bottom:10px; display:block; width:100%;"></div>
        <button class="f-btn" style="margin: 0 auto; padding: 10px 30px;" onclick="joinChat()">BAĞLAN</button>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmoji()">😊 Emojiler</button>
        <button class="f-btn" onclick="changePersonalSize(2)">➕</button>
        <button class="f-btn" onclick="changePersonalSize(-2)">➖</button>
        <input type="color" id="colorPicker" value="#2ecc71" onchange="changeColor(this.value)" style="width:30px; height:22px; margin-left:15px; cursor:pointer;">
        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()">👤 Çıkış</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <div id="dj-mixer">
        <div class="mixer-head" id="mixer-drag">🎧 DJ MİXER PANELİ</div>
        <div class="mixer-body">
            <button id="mic-btn" class="m-btn m-mic" onclick="toggleMic()">🎤 MİKROFONU AÇ</button>
            <p style="font-size:10px; color:#aaa; text-align:center;">MÜZİK SEÇ VE ÇAL</p>
            <input type="file" id="music-input" accept="audio/*" style="font-size:10px; color:#ccc; width:100%;">
            <audio id="dj-player" controls style="width:100%; height:30px;"></audio>
        </div>
    </div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesajınız..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var personalFontSize = 13;
    var micStream = null;
    var mediaRecorder = null;
    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() { socket.emit('join', { nick: document.getElementById('nick-input').value, password: document.getElementById('pass-input').value }); }

    socket.on('login success', (data) => {
        document.getElementById('login-overlay').style.display = 'none';
        if(data.role === 'DJ') document.getElementById('dj-mixer').style.display = 'block';
    });

    // DJ SES GÖNDERME
    async function toggleMic() {
        if (!micStream) {
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(micStream);
            mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) socket.emit('audio-stream', e.data); };
            mediaRecorder.start(250); // Ses parçalarını 250ms'lik paketler halinde gönderir
            document.getElementById('mic-btn').innerText = "🎤 MİKROFON AÇIK";
            document.getElementById('mic-btn').style.background = "#e67e22";
        } else {
            micStream.getTracks().forEach(t => t.stop()); micStream = null;
            document.getElementById('mic-btn').innerText = "🎤 MİKROFONU AÇ";
            document.getElementById('mic-btn').style.background = "#2980b9";
        }
    }

    // DİNLEYİCİ SES ALMA (BUFFER İLE ÇALMA)
    socket.on('audio-receive', async (blobData) => {
        let arrayBuffer = await blobData.arrayBuffer();
        audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
            let source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
        });
    });

    // Sayfaya bir tık, ses kanalını açar (Tarayıcı kuralı)
    window.onclick = () => { if(audioCtx.state === 'suspended') audioCtx.resume(); };

    // Müzik çalar
    document.getElementById('music-input').onchange = (e) => {
        document.getElementById('dj-player').src = URL.createObjectURL(e.target.files[0]);
        document.getElementById('dj-player').play();
    };

    // Diğer fonksiyonlar
    function changePersonalSize(a) { personalFontSize += a; document.getElementById('messages').style.fontSize = personalFontSize+"px"; }
    function sendMessage(e) { e.preventDefault(); var i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value }); i.value = ''; } }
    
    socket.on('chat message', (data) => {
        var div = document.createElement('div');
        div.innerHTML = `<b style="color:${data.color}">👤 ${data.user}:</b> ${data.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', (list) => {
        var uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            let item = document.createElement('div'); item.className = 'user-item'; item.style.color = u.color;
            item.innerHTML = '👤 ' + u.nick + (u.role === 'DJ' ? ' <small>Dj</small>' : '');
            uDiv.appendChild(item);
        });
    });

    // SÜRÜKLEME
    dragElement(document.getElementById("dj-mixer"));
    function dragElement(e) {
        var p1=0, p2=0, p3=0, p4=0; document.getElementById("mixer-drag").onmousedown = dragM;
        function dragM(e) { e.preventDefault(); p3=e.clientX; p4=e.clientY; document.onmouseup = () => {document.onmouseup=null; document.onmousemove=null;}; document.onmousemove = (e) => {
            e.preventDefault(); p1=p3-e.clientX; p2=p4-e.clientY; p3=e.clientX; p4=e.clientY;
            e.target.parentElement.style.top = (e.target.parentElement.offsetTop - p2) + "px";
            e.target.parentElement.style.left = (e.target.parentElement.offsetLeft - p1) + "px";
        };}
    }
</script>
</body>
</html>
