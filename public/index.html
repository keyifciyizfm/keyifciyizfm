<!DOCTYPE html>
<html>
<head>
    <title>Web DJ Mixer</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; text-align: center; }
        .mixer { display: flex; justify-content: space-around; margin-top: 50px; }
        .deck { border: 2px solid #444; padding: 20px; border-radius: 10px; }
        input[type="range"] { width: 300px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>DJ Mikser Paneli</h1>
    <div class="mixer">
        <div class="deck">
            <h3>Deck A</h3>
            <input type="file" id="fileA" accept="audio/*"><br><br>
            <audio id="audioA" controls></audio>
        </div>
        <div class="deck">
            <h3>Deck B</h3>
            <input type="file" id="fileB" accept="audio/*"><br><br>
            <audio id="audioB" controls></audio>
        </div>
    </div>
    <br>
    <label>Crossfader (Geçiş)</label><br>
    <input type="range" id="crossfader" min="0" max="1" step="0.01" value="0.5">

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const audioA = document.getElementById('audioA');
        const audioB = document.getElementById('audioB');
        const crossfader = document.getElementById('crossfader');

        // Dosya yükleme mantığı
        document.getElementById('fileA').onchange = e => audioA.src = URL.createObjectURL(e.target.files[0]);
        document.getElementById('fileB').onchange = e => audioB.src = URL.createObjectURL(e.target.files[0]);

        // Mikser geçişi
        crossfader.oninput = () => {
            const val = crossfader.value;
            audioA.volume = 1 - val;
            audioB.volume = val;
            // Bu bilgiyi dinleyicilere gönder
            socket.emit('mixer-move', { type: 'volume', a: 1-val, b: val });
        };
    </script>
</body>
</html>
