<div id="login-overlay">
    <div id="login-box" style="width: 350px;">
        <h3 id="auth-title" style="color:#f1c40f; margin-bottom:15px;">Sohbet Girişi</h3>
        
        <input type="text" id="nick-input" placeholder="Kullanıcı Adı" maxlength="15" style="padding:10px; margin-bottom:10px; width:100%; background:#111; color:#fff; border:1px solid #555;">
        <input type="password" id="pass-input" placeholder="Şifre" style="padding:10px; margin-bottom:15px; width:100%; background:#111; color:#fff; border:1px solid #555;">
        
        <div id="login-btns" style="display: flex; gap: 10px; justify-content: center;">
            <button id="main-auth-btn" class="f-btn" onclick="handleAuth('login')">GİRİŞ YAP</button>
            <button class="f-btn" style="background: #555;" onclick="showRegister()">KAYIT OL</button>
        </div>
        
        <p id="auth-msg" style="font-size:11px; margin-top:10px; color:#e74c3c;"></p>
    </div>
</div>

<script>
    var isRegisterMode = false;

    function showRegister() {
        isRegisterMode = true;
        document.getElementById('auth-title').innerText = "Yeni Kayıt";
        document.getElementById('auth-title').style.color = "#2ecc71";
        document.getElementById('main-auth-btn').innerText = "KAYDOL VE GİRİŞE DÖN";
        document.getElementById('auth-msg').innerText = "";
    }

    function handleAuth(type) {
        var nick = document.getElementById('nick-input').value.trim();
        var pass = document.getElementById('pass-input').value.trim();
        
        if(!nick || !pass) {
            document.getElementById('auth-msg').innerText = "Boş alan bırakmayın!";
            return;
        }

        if(isRegisterMode) {
            socket.emit('register', { nick: nick, password: pass });
        } else {
            socket.emit('login', { nick: nick, password: pass });
        }
    }

    // Sunucudan gelen yanıtlar
    socket.on('auth error', function(msg) {
        document.getElementById('auth-msg').style.color = "#e74c3c";
        document.getElementById('auth-msg').innerText = msg;
    });

    socket.on('auth success', function(msg) {
        isRegisterMode = false;
        document.getElementById('auth-title').innerText = "Sohbet Girişi";
        document.getElementById('main-auth-btn').innerText = "GİRİŞ YAP";
        document.getElementById('auth-msg').style.color = "#2ecc71";
        document.getElementById('auth-msg').innerText = msg;
    });

    socket.on('login success', function(data) {
        document.getElementById('login-overlay').style.display = 'none';
    });
</script>
