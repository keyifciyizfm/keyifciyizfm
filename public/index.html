<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #e0e0e0; font-family: sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #login-overlay { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        #login-box { background: #1e1e1e; padding: 30px; border-radius: 10px; border: 1px solid #333; text-align: center; width: 320px; }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 5px; }
        
        /* Ekran Boyutu Düzenlendi (900x600 - En Sığan Boyut) */
        #chat-container { width: 900px; height: 600px; background: #1e1e1e; border: 1px solid #333; display: flex; flex-direction: column; border-radius: 8px; position: relative; }
        
        #action-bar { background: #252525; padding: 10px 15px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; }
        .f-btn { background: #333; color: #fff; border: 1px solid #444; padding: 6px 10px; cursor: pointer; font-size: 12px; border-radius: 4px; font-weight: bold; }
        .f-btn.active { background: #2ecc71; color: #000; }
        
        #main-area { display: flex; flex: 1; overflow: hidden; padding: 10px; gap: 10px; }
        #messages { flex: 3; background: #121212; padding: 15px; overflow-y: auto; border-radius: 5px; border: 1px solid #222; }
        #user-sidebar { flex: 1; background: #181818; padding: 10px; border: 1px solid #222; border-radius: 5px; overflow-y: auto; }
        
        .badge { font-size: 10px; padding: 2px 5px; border-radius: 3px; margin-right: 5px; font-weight: bold; color: #fff; text-transform: uppercase; }
        .badge-owner { background: #ff4757; }
        .badge-admin { background: #e67e22; }
        .badge-dj { background: #f1c40f; color: #000; }

        .user-item { padding: 6px; margin-bottom: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; }
        .user-item:hover { background: #252525; }

        #emoji-panel { display: none; position: absolute; bottom: 75px; left: 10px; background: #252525; border: 1px solid #444; padding: 10px; width: 250px; flex-wrap: wrap; gap: 8px; z-index: 500; border-radius: 5px; }
        .emoji { font-size: 22px; cursor: pointer; }
        
        form { display: flex; padding: 15px; background: #1e1e1e; gap: 10px; border-top: 1px solid #333; }
        #input { flex: 1; background: #121212; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 5px; outline: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71;">Giriş</h3>
        <input id="nick-in" class="auth-input" placeholder="Nick" oninput="checkAdm(this.value)">
        <div id="adm-p" style="display:none"><input id="pass-in" type="password" class="auth-input" placeholder="Şifre"></div>
        <button class="f-btn" style="width:100%; height:40px; background:#2ecc71; color:#000;" onclick="join()">BAĞLAN</button>
        <p id="err" style="color:#e74c3c; font-size:11px; margin-top:10px;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmo()">😊</button>
        <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')">B</button>
        <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')">I</button>
        <button id="btn-underline" class="f-btn" onclick="toggleStyle('underline')">U</button>
        
        <div style="display: flex; align-items: center; background: #111; border-radius: 4px;">
            <button class="f-btn" onclick="changeSize(-2)">A-</button>
            <span id="sz-txt" style="width:25px; text-align:center; font-size:11px;">15</span>
            <button class="f-btn" onclick="changeSize(2)">A+</button>
        </div>

        <input type="color" id="cp" value="#2ecc71" style="width:30px; height:30px; border:none; background:none; cursor:pointer;">
        <div style="flex:1"></div>
        <button class="f-btn" style="background:#e74c3c" onclick="location.reload()">X</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-sidebar"><div id="ulist"></div></div>
    </div>

    <div id="emoji-panel">
        <span class="emoji" onclick="addEmo('😊')">😊</span><span class="emoji" onclick="addEmo('😂')">😂</span><span class="emoji" onclick="addEmo('🌹')">🌹</span><span class="emoji" onclick="addEmo('🎵')">🎵</span><span class="emoji" onclick="addEmo('🎙️')">🎙️</span><span class="emoji" onclick="addEmo('🔥')">🔥</span>
    </div>

    <form onsubmit="send(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj...">
        <button class="f-btn" style="width:100px; background:#2ecc71; color:#000;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myRole = "", myNick = "";
    var fSize = 15;
    var styles = { bold: false, italic: false, underline: false, size: '15px' };

    function checkAdm(v) { document.getElementById('adm-p').style.display = (v === "Halil") ? "block" : "none"; }
    function join() {
        var n = document.getElementById('nick-in').value.trim();
        var p = document.getElementById('pass-in').value.trim();
        if(n) socket.emit('join', { nick: n, password: p });
    }

    socket.on('auth error', (m) => document.getElementById('err').innerText = m);
    socket.on('login success', (d) => { myRole = d.role; myNick = d.nick; document.getElementById('login-overlay').style.display = 'none'; });

    function toggleEmo() { var p = document.getElementById('emoji-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }
    function addEmo(e) { document.getElementById('input').value += e; document.getElementById('input').focus(); }
    function toggleStyle(s) { styles[s] = !styles[s]; document.getElementById('btn-' + s).classList.toggle('active'); }
    
    // A+ A- Fonksiyonu (Çalışacak Şekilde Güncellendi)
    function changeSize(delta) {
        fSize += delta;
        if(fSize < 10) fSize = 10;
        if(fSize > 30) fSize = 30;
        styles.size = fSize + 'px';
        document.getElementById('sz-txt').innerText = fSize;
    }

    function send(e) {
        e.preventDefault();
        var i = document.getElementById('input');
        if(!i.value.trim()) return;
        socket.emit('chat message', { text: i.value, color: document.getElementById('cp').value, style: styles });
        i.value = ''; document.getElementById('emoji-panel').style.display = 'none';
    }

    socket.on('chat message', (d) => {
        var div = document.createElement('div');
        div.style.marginBottom = "10px";
        if(d.system) div.innerHTML = `<small style="color:#444"><i>${d.text}</i></small>`;
        else {
            var s = d.style || {};
            var styleStr = `color:${d.color}; font-size:${s.size || '15px'}; ${s.bold?'font-weight:bold;':''} ${s.italic?'font-style:italic;':''} ${s.underline?'text-decoration:underline;':''}`;
            var b = "";
            if(d.role === 'Yönetici') b = `<span class="badge badge-owner">Sahibi</span>`;
            else if(d.role === 'Admin') b = `<span class="badge badge-admin">Adm</span>`;
            else if(d.role === 'DJ') b = `<span class="badge badge-dj">Dj</span>`;
            
            div.innerHTML = `${b}<b style="color:${d.color}; cursor:pointer" onclick="admMenu('${d.user}')">${d.user}:</b> <span style="${styleStr}">${d.text}</span>`;
        }
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', (l) => {
        var c = document.getElementById('ulist'); c.innerHTML = '';
        l.forEach(u => {
            var d = document.createElement('div'); 
            d.className = 'user-item'; d.style.color = u.color; d.onclick = () => admMenu(u.nick);
            var icon = (u.role==='Yönetici'?'👑 ':(u.role==='Admin'?'🛡️ ':'👤 '));
            d.innerHTML = `<span>${icon} ${u.nick}</span>`;
            c.appendChild(d);
        });
    });

    function admMenu(tN) {
        if ((myRole !== 'Yönetici' && myRole !== 'Admin') || tN === myNick) return;
        var c = prompt(tN + " için işlem:\n1:At, 2:Ban, 3:DJ Yap, 4:Admin Yap");
        if (c === "1") socket.emit('admin command', {action: 'kick', targetNick: tN});
        if (c === "2") socket.emit('admin command', {action: 'ban', targetNick: tN});
        if (c === "3") socket.emit('admin command', {action: 'make_dj', targetNick: tN});
        if (c === "4" && myRole === 'Yönetici') socket.emit('admin command', {action: 'make_admin', targetNick: tN});
    }

    socket.on('force logout', (m) => { alert(m); location.reload(); });
</script>
</body>
</html>
