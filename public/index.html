<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Keyifciyiz FM</title>
<script src="/socket.io/socket.io.js"></script>
<style>
body{margin:0;background:#1a1a1a;color:#fff;font-family:Arial}
.topbar{background:#333;padding:5px}
button{margin:2px}
.container{display:flex;height:90vh}
.chat{flex:3;display:flex;flex-direction:column}
.messages{flex:1;background:#000;padding:10px;overflow:auto}
.users{flex:1;background:#111;padding:10px}
.input{display:flex}
input{flex:1;padding:10px}
.msg{margin:5px 0}
.name{color:#00ffff}
.time{color:#888;font-size:10px}
</style>
</head>
<body>

<div class="topbar">
  <button onclick="bold()"><b>B</b></button>
  <button onclick="italic()"><i>I</i></button>
  <button onclick="big()">A+</button>
  <button onclick="small()">A-</button>
  <button onclick="emoji('😊')">😊</button>
  <button onclick="emoji('😂')">😂</button>
</div>

<div class="container">
  <div class="chat">
    <div class="messages" id="messages"></div>
    <div class="input">
      <input id="msg" placeholder="Mesaj yaz">
      <button onclick="send()">Gönder</button>
    </div>
  </div>
  <div class="users">
    <h3>Nickler</h3>
    <div id="userList"></div>
  </div>
</div>

<script>
const socket = io();
let username = prompt("Nick gir");
socket.emit('join', username);

socket.on('users', users => {
  let list = document.getElementById('userList');
  list.innerHTML='';
  users.forEach(u=>{
    let d=document.createElement('div');
    d.innerText=u;
    list.appendChild(d);
  });
});

socket.on('message', data => {
  let div=document.createElement('div');
  div.className='msg';
  div.innerHTML=<span class="name">${data.user}</span>: ${data.text} <span class="time">(${data.time})</span>;
  document.getElementById('messages').appendChild(div);
});

function send(){
  let m=document.getElementById('msg');
  socket.emit('message', m.value);
  m.value='';
}

function emoji(e){document.getElementById('msg').value+=e}
function bold(){document.getElementById('msg').value+=' *kalın* '}
function italic(){document.getElementById('msg').value+=' italik '}
function big(){document.getElementById('msg').style.fontSize='20px'}
function small(){document.getElementById('msg').style.fontSize='12px'}
</script>

</body>
</html>
