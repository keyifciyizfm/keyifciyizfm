<button class="f-btn" onclick="joinChat()">BAĞLAN</button>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var audioCtx, dest, processor, listenerCtx, nextStartTime = 0;

    function joinChat() {
        const n = document.getElementById('nick-input').value;
        const p = document.getElementById('pass-input').value;
        socket.emit('join', { nick: n, password: p });
    }

    socket.on('login success', d => {
        document.getElementById('login-overlay').style.display = 'none';
        if(d.nick === "Keyifciyiz_Fm") initMixer();
    });

    function initMixer() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        dest = audioCtx.createMediaStreamDestination();
        // Ses paketleme işlemi
        processor = audioCtx.createScriptProcessor(4096, 1, 1);
        dest.connect(processor);
        processor.connect(audioCtx.destination);
        processor.onaudioprocess = (e) => {
            const data = e.inputBuffer.getChannelData(0);
            socket.emit('audio-stream', new Float32Array(data));
        };
    }
    
    socket.on('audio-data', (data) => {
        if (!listenerCtx) listenerCtx = new AudioContext();
        const floatData = new Float32Array(data);
        const buffer = listenerCtx.createBuffer(1, floatData.length, listenerCtx.sampleRate);
        buffer.getChannelData(0).set(floatData);
        const source = listenerCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(listenerCtx.destination);
        if (nextStartTime < listenerCtx.currentTime) nextStartTime = listenerCtx.currentTime;
        source.start(nextStartTime);
        nextStartTime += buffer.duration;
    });
</script>
