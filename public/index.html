<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #333; padding: 40px; border: 2px solid #f1c40f; text-align: center; border-radius: 10px; width: 350px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 7px 15px; font-size: 11px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .f-btn.active { background: #2ecc71 !important; color: #000 !important; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 4px; font-size: 14px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { padding: 6px 0; border-bottom: 1px solid #222; cursor: pointer; }
        #emoji-panel { display: none; position: absolute; bottom: 70px; left: 12px; background: #333; border: 2px solid #555; padding: 15px; flex-wrap: wrap; gap: 10px; width: 280px; border-radius: 8px; z-index: 100; }
        .emoji-item { cursor: pointer; transition: 0.2s; }
        .emoji-item:hover { transform: scale(1.2); }
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 12px; outline: none; border-radius: 4px; }
        #custom-menu { display: none; position: absolute; background: #2a2a2a; border: 1px solid #f1c40f; z-index: 5000; width: 160px; border-radius: 4px; }
        .menu-item { padding: 12px; cursor: pointer; color: #ddd; font-size: 12px; border-bottom: 1px solid #333; }

        /* MİKSER PANELİ */
        #mixer { display: none; position: fixed; top: 20px; right: 20px; width: 260px; background: #222; border: 2px solid #f1c40f; border-radius: 10px; z-index: 8000; padding: 15px; cursor: move; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        .m-title { color: #f1c40f; font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .m-box { background: #333; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #444; }
        .m-label { font-size: 10px; color: #aaa; margin-bottom: 5px; display: block; }
        #b-btn { width: 100%; padding: 12px; font-weight: bold; background: #e74c3c; border: none; color: #fff; border-radius: 5px; cursor: pointer; }
        #b-btn.live { background: #2ecc71; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="color:#f1c40f; margin-bottom:20px;">Keyifciyiz FM</h2>
        <input type="text" id="nick-in" placeholder="Nickiniz..." oninput="checkAdm(this.value)" style="padding:12px; width:100%; background:#111; color:#fff; border:1px solid #444; margin-bottom:10px; border-radius:4px;">
        <div id="p-area" style="display:none;"><input type="password" id="p-in" placeholder="Şifre..." style="padding:12px; width:100%; background:#111; color:#fff; border:1px solid #444; margin-bottom:10px; border-radius:4px;"></div>
        <button class="f-btn" style="width:100%; padding:12px; background:#2ecc71; color:#000; font-weight:bold;" onclick="join()">BAĞLAN & DİNLE</button>
    </div>
</div>

<div id="mixer">
    <div class="m-title">🎧 YAYIN KONTROL</div>
    <div class="m-box">
        <span class="m-label">MÜZİK YÜKLE</span>
        <input type="file" id="f-in" accept="audio/*" onchange="initAudio(this)" style="font-size:10px;">
        <audio id="player-dj" loop style="display:none;"></audio>
    </div>
    <div class="m-box">
        <span class="m-label">SES SEVİYESİ</span>
        <input type="range" min="0" max="1" step="0.1" value="0.5" style="width:100%; cursor:pointer;" oninput="if(gainN) gainN.gain.value = this.value">
    </div>
    <button id="b-btn" onclick="startStream()">📡 YAYINI BAŞLAT</button>
</div>

<div id="custom-menu"><div class="menu-item" onclick="kick()" style="color:#ff4757;">🚫 Odadan At</div></div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmo(event)">😊 Emojiler</button>
        <div style="margin-left: 20px; display: flex; gap: 8px;">
            <button class="f-btn" onclick="chFont(2)">A+</button>
            <button class="f-btn" onclick="chFont(-2)">A-</button>
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>B</b></button>
        </div>
        <input type="color" id="cp" value="#2ecc71" onchange="selColor = this.value" style="margin-left:20px; width:35px; height:22px; cursor:pointer; border:none;">
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>
    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>
    <div id="emoji-panel"></div>
    <form id="form" onsubmit="sendM(event)">
        <input id="input" autocomplete="off" placeholder="Mesajınız..." />
        <button type="submit" class="f-btn" style="padding:0 25px;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io(), myNick = "", myRole = "", selTarget = "", curFont = 14, selColor = "#2ecc71", styles = {bold: false};
    var actx, dst, gainN, djRec, micStream;
    var audioQueue = [], isPlaying = false;

    // EMOJİLER
    const emos = [{c:':smile:', i:'1f60a'}, {c:':joy:', i:'1f602'}, {c:':cool:', i:'1f60e'}, {c:':heart:', i:'2764'}, {c:':fire:', i:'1f525'}, {c:':rose:', i:'1f339'}, {c:':thumbsup:', i:'1f44d'}, {c:':microphone:', i:'1f399'}];
    const ep = document.getElementById('emoji-panel');
    emos.forEach(e => {
        let d = document.createElement('div'); d.className='emoji-item'; 
        d.innerHTML=`<img src="https://raw.githubusercontent.com/jakejarvis/apple-emoji-svg/main/emoji/${e.i}.svg" style="width:24px;">`;
        d.onclick=()=>{document.getElementById('input').value+=e.c+' '; document.getElementById('input').focus();}; 
        ep.appendChild(d);
    });

    function checkAdm(v) { document.getElementById('p-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    
    // BAĞLAN BUTONU (Telefondaki ses kilidini açar)
    function join() {
        let unlock = new Audio();
        unlock.play().then(() => {
            unlock.pause();
            socket.emit('join', { nick: document.getElementById('nick-in').value, password: document.getElementById('p-in').value });
        }).catch(() => {
            // Tarayıcı hata verse de bağlanmayı dene
            socket.emit('join', { nick: document.getElementById('nick-in').value, password: document.getElementById('p-in').value });
        });
    }

    socket.on('login success', d => {
        myNick = d.nick; myRole = d.role; document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') document.getElementById('mixer').style.display = 'block';
    });

    // --- DJ MİKSER MOTORU ---
    function initAudio(input) {
        if(!actx) {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            dst = actx.createMediaStreamDestination();
            gainN = actx.createGain(); 
            gainN.connect(dst); 
            gainN.connect(actx.destination);
            let mSource = actx.createMediaElementSource(document.getElementById('player-dj'));
            mSource.connect(gainN);
        }
        document.getElementById('player-dj').src = URL.createObjectURL(input.files[0]);
        document.getElementById('player-dj').play();
    }

    async function startStream() {
        const btn = document.getElementById('b-btn');
        if(!actx) return alert("Önce bir müzik dosyası seçin!");

        if(btn.innerText.includes("BAŞLAT")) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const micNode = actx.createMediaStreamSource(micStream);
                micNode.connect(dst);
                
                djRec = new MediaRecorder(dst.stream, { mimeType: 'audio/webm; codecs=opus' });
                djRec.ondataavailable = (e) => { if(e.data.size > 0) socket.emit('voice-data', e.data); };
                djRec.start(1000); // 1 saniyelik stabil paketler

                btn.innerText = "🛑 YAYINI DURDUR"; btn.classList.add('live');
            } catch(e) { alert("Mikrofon izni gerekli!"); }
        } else {
            djRec.stop(); micStream.getTracks().forEach(t => t.stop());
            btn.innerText = "📡 YAYINI BAŞLAT"; btn.classList.remove('live');
        }
    }

    // --- DİNLEYİCİ KUYRUK SİSTEMİ (KESİLMEYİ ÖNLER) ---
    socket.on('audio-stream', (data) => {
        const blob = new Blob([data], { type: 'audio/webm; codecs=opus' });
        const url = URL.createObjectURL(blob);
        audioQueue.push(url);
        if(!isPlaying) playNext();
    });

    function playNext() {
        if(audioQueue.length === 0) { isPlaying = false; return; }
        isPlaying = true;
        let currentUrl = audioQueue.shift();
        let audio = new Audio(currentUrl);
        audio.onended = () => { URL.revokeObjectURL(currentUrl); playNext(); };
        audio.play().catch(() => { isPlaying = false; });
    }

    // --- CHAT VE DİĞERLERİ ---
    socket.on('chat message', d => {
        const div = document.createElement('div'); div.style.marginBottom = "8px";
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span style="font-weight:${d.style?.bold?'bold':'normal'}">${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = 100000;
    });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const i = document.createElement('div'); i.className = 'user-item'; i.style.color = u.color;
            i.innerText = u.nick + (u.nick === "Keyifciyiz_Fm" ? " (Dj)" : "");
            i.onclick = (e) => { if(myRole==='Yönetici' && u.nick!==myNick){ selTarget=u.nick; let m=document.getElementById('custom-menu'); m.style.display='block'; m.style.left=e.pageX+"px"; m.style.top=e.pageY+"px"; e.stopPropagation(); }};
            uDiv.appendChild(i);
        });
    });

    function sendM(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value){ socket.emit('chat message', {text:i.value, color:selColor, style:styles}); i.value=''; } }
    function chFont(n) { curFont += n; document.getElementById('messages').style.fontSize = curFont + "px"; }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function toggleEmo(e) { e.stopPropagation(); let p = document.getElementById('emoji-panel'); p.style.display = p.style.display==='flex'?'none':'flex'; }
    function kick() { socket.emit('admin command', {action:'kick', targetNick:selTarget}); }
    document.addEventListener('click', () => { document.getElementById('custom-menu').style.display='none'; document.getElementById('emoji-panel').style.display='none'; });

    // SÜRÜKLEME KODU
    const mP = document.getElementById("mixer");
    let drg = false, off = [0,0];
    mP.onmousedown = (e) => { drg = true; off = [mP.offsetLeft - e.clientX, mP.offsetTop - e.clientY]; };
    document.onmouseup = () => drg = false;
    document.onmousemove = (e) => { if(drg) { mP.style.left = (e.clientX + off[0]) + 'px'; mP.style.top = (e.clientY + off[1]) + 'px'; } };
</script>
</body>
</html>
