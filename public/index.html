<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1a1a1a; color: #ccc; font-family: Verdana, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #login-overlay { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        #login-box { background: #333; padding: 25px; border-radius: 8px; border: 2px solid #555; text-align: center; width: 300px; }
        .auth-input { width: 100%; padding: 10px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #666; }
        #chat-container { width: 900px; height: 600px; background: #333; border: 2px solid #444; display: flex; flex-direction: column; }
        #action-bar { background: #444; padding: 10px; display: flex; gap: 10px; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(#888, #222); color: #fff; border: 1px solid #000; padding: 6px 12px; cursor: pointer; font-size: 11px; font-weight: bold; border-radius: 3px; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 10px; gap: 10px; }
        #messages { flex: 3; background: #000; padding: 15px; overflow-y: auto; font-size: 14px; }
        #user-sidebar { flex: 1; background: #111; padding: 10px; border: 1px solid #444; overflow-y: auto; }
        form { display: flex; padding: 10px; background: #333; gap: 10px; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#f1c40f">Sohbet Giriş</h3>
        <input id="nick-in" class="auth-input" placeholder="Nick" oninput="checkAdm(this.value)">
        <div id="adm-p" style="display:none"><input id="pass-in" type="password" class="auth-input" placeholder="Şifre"></div>
        <button class="f-btn" style="width:100%" onclick="join()">GİRİŞ</button>
        <p id="err" style="color:red; font-size:11px; margin-top:5px;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmo()">😊 Emojiler</button>
        <input type="color" id="cp" value="#2ecc71" style="width:30px; height:24px; border:none; background:none;">
        <div style="flex:1"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>
    <div id="main-area">
        <div id="messages"></div>
        <div id="user-sidebar"><b style="color:#f1c40f; font-size:11px;">KİMLER VAR</b><hr style="margin:10px 0; border:0; border-top:1px solid #333;"><div id="ulist"></div></div>
    </div>
    <form onsubmit="send(event)">
        <input id="input" autocomplete="off" placeholder="Mesajınız...">
        <button class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myRole = "", myNick = "";

    function checkAdm(v) { document.getElementById('adm-p').style.display = (v === "Halil") ? "block" : "none"; }
    
    function join() {
        var n = document.getElementById('nick-in').value;
        var p = document.getElementById('pass-in').value;
        socket.emit('join', { nick: n, password: p });
    }

    socket.on('auth error', (m) => document.getElementById('err').innerText = m);
    socket.on('login success', (d) => { myRole = d.role; myNick = d.nick; document.getElementById('login-overlay').style.display = 'none'; });

    function send(e) {
        e.preventDefault();
        var i = document.getElementById('input');
        if(!i.value) return;
        socket.emit('chat message', { text: i.value, color: document.getElementById('cp').value });
        i.value = '';
    }

    socket.on('chat message', (d) => {
        var div = document.createElement('div');
        div.style.marginBottom = "5px";
        if(d.system) div.innerHTML = `<small style="color:#888"><i>${d.text}</i></small>`;
        else {
            var b = (d.role === 'Yönetici') ? `<span style="background:red; color:#fff; font-size:9px; padding:1px 3px; border-radius:2px; margin-right:5px;">ADM</span>` : '';
            div.innerHTML = `${b}<b style="color:${d.color}; cursor:pointer" onclick="adm('${d.user}')">${d.user}:</b> <span style="color:${d.color}">${d.text}</span>`;
        }
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', (l) => {
        var c = document.getElementById('ulist'); c.innerHTML = '';
        l.forEach(u => { var d = document.createElement('div'); d.style.color = u.color; d.style.fontSize = "13px"; d.innerHTML = (u.role==='Yönetici'?'👑 ':'👤 ')+u.nick; c.appendChild(d); });
    });

    function adm(t) {
        if(myRole !== 'Yönetici' || t === myNick) return;
        var c = prompt(t + " için: 1-At, 2-Ban");
        if(c === "1") socket.emit('admin command', {action: 'kick', targetNick: t});
        if(c === "2") socket.emit('admin command', {action: 'ban', targetNick: t});
    }

    socket.on('force logout', (m) => { alert(m); location.reload(); });
</script>
</body>
</html>
