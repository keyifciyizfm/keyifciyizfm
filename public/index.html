<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - V2</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: #ccc; font-family: Tahoma; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Giriş */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { border: 2px solid #ff9900; padding: 30px; background: #111; text-align: center; }

        /* Üst Bölüm: Ritim ve Araçlar */
        .header { background: #1a1a1a; padding: 10px; border-bottom: 2px solid #333; }
        #visualizer { width: 100%; height: 50px; background: #000; border: 1px solid #444; }
        .tools { margin-top: 5px; display: flex; gap: 5px; }

        /* Mesaj Yazma */
        .input-bar { background: #222; padding: 10px; display: flex; gap: 10px; }
        #m-input { flex: 1; padding: 12px; background: #000; color: #fff; border: 1px solid #444; }

        /* Ana Gövde */
        .main { display: flex; flex: 1; overflow: hidden; }
        #chat { flex: 3; padding: 15px; overflow-y: auto; background: #050505; border-right: 2px solid #333; }
        .side { width: 250px; background: #111; display: flex; flex-direction: column; }
        
        /* Mixer Paneli */
        #mixer-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; border: 2px solid #ff9900; padding: 20px; display: none; flex-direction: column; z-index: 8888; }
        .playlist { height: 100px; background: #000; overflow-y: auto; margin: 10px 0; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:#ff9900">RADYO GİRİŞ</h2>
        <input type="text" id="nick" placeholder="Nick..." style="width:100%; padding:8px; margin-bottom:10px;">
        <input type="password" id="pass" placeholder="DJ Şifresi (123)" style="width:100%; padding:8px; margin-bottom:10px;">
        <button onclick="baglan()" style="width:100%; padding:10px; background:#ff9900; border:none; cursor:pointer; font-weight:bold;">GİRİŞ YAP</button>
    </div>
</div>

<div id="mixer-modal">
    <h3 style="margin:0; color:#ff9900">STUDIO MIXER</h3>
    <input type="file" id="files" multiple onchange="listeGuncelle()">
    <div id="playlist" class="playlist"></div>
    <button onclick="yayiniBaslat()" style="padding:10px; background:#27ae60; border:none; color:#fff;">YAYINI AKTİF ET</button>
    <button onclick="toggleMixer()" style="margin-top:5px;">KAPAT</button>
</div>

<div class="header">
    <canvas id="visualizer"></canvas>
    <div class="tools">
        <button onclick="f('bold')"><b>B</b></button>
        <button onclick="f('italic')"><i>I</i></button>
        <input type="color" id="cp" onchange="format.color = this.value">
        <button onclick="addEmoji('😊')">😊</button>
    </div>
</div>

<div class="input-bar">
    <input type="text" id="m-input" placeholder="Mesaj yaz kutusu..." onkeypress="if(event.key==='Enter') gonder()">
    <button onclick="gonder()" style="background:#ff9900; padding:0 20px; border:none; cursor:pointer;">GÖNDER</button>
</div>

<div class="main">
    <div id="chat"></div>
    <div class="side">
        <div style="background:#333; padding:5px; text-align:center; font-size:12px; color:#ff9900;">DİNLEYİCİLER</div>
        <div id="user-list" style="flex:1; padding:10px;"></div>
        <button id="mixer-btn" style="display:none; padding:15px; background:#ff9900; border:none; font-weight:bold; cursor:pointer;" onclick="toggleMixer()">Mixeraç</button>
    </div>
</div>

<audio id="radyo-ses" crossorigin="anonymous"></audio>

<script>
    const socket = io();
    let format = { bold: false, italic: false, color: '#ffffff' };
    let isDJ = false;
    let live = false;

    function baglan() {
        const n = document.getElementById('nick').value;
        const p = document.getElementById('pass').value;
        if(n) socket.emit('join', { username: n, password: p });
    }

    socket.on('authStatus', d => {
        isDJ = (d.role === "ADMIN");
        document.getElementById('login-screen').style.display = 'none';
        if(isDJ) document.getElementById('mixer-btn').style.display = 'block';
    });

    function f(t) { format[t] = !format[t]; alert(t + " modu değişti."); }
    function addEmoji(e) { document.getElementById('m-input').value += e; }

    function gonder() {
        const i = document.getElementById('m-input');
        if(i.value) {
            socket.emit('sendMessage', { text: i.value, format: format });
            i.value = '';
        }
    }

    socket.on('message', d => {
        const chat = document.getElementById('chat');
        const style = `color:${d.format.color}; font-weight:${d.format.bold?'bold':'normal'}; font-style:${d.format.italic?'italic':'normal'}`;
        chat.innerHTML += `<div><b>${d.user}:</b> <span style="${style}">${d.text}</span></div>`;
        chat.scrollTop = chat.scrollHeight;
    });

    function toggleMixer() {
        const m = document.getElementById('mixer-modal');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function listeGuncelle() {
        const files = document.getElementById('files').files;
        const p = document.getElementById('playlist');
        p.innerHTML = Array.from(files).map((f, i) => `<div onclick="cal(${i})" style="padding:5px; cursor:pointer; border-bottom:1px solid #222">🎵 ${f.name}</div>`).join('');
    }

    function cal(index) {
        if(!live) return alert("Önce Yayını Aktif Et butonuna basın!");
        const file = document.getElementById('files').files[index];
        const r = new FileReader();
        r.onload = e => {
            socket.emit('audioStream', { data: e.target.result });
            const audio = document.getElementById('radyo-ses');
            audio.src = e.target.result;
            audio.play();
            baslatRitim();
        };
        r.readAsDataURL(file);
    }

    function yayiniBaslat() { live = true; alert("Yayın aktif! Listeden bir şarkıya tıklayın."); }

    socket.on('audioPlay', d => {
        const audio = document.getElementById('radyo-ses');
        audio.src = d.data;
        audio.play();
        baslatRitim();
    });

    socket.on('updateUserList', users => {
        const l = document.getElementById('user-list');
        l.innerHTML = users.map(u => {
            let html = `<div style="padding:5px; ${u.muted?'opacity:0.5':''}">● <span style="color:#ff9900">${u.title}</span> ${u.username}`;
            if(isDJ && u.role !== "ADMIN") {
                html += ` <button onclick="adminIslem('${u.id}')" style="font-size:10px;">Yönet</button>`;
            }
            return html + `</div>`;
        }).join('');
    });

    function adminIslem(id) {
        const a = prompt("1: Ünvan Değiş, 2: Sustur/Aç, 3: At (Kick)");
        if(a === "1") socket.emit('adminAction', { action: 'title', targetId: id, value: prompt("Yeni Ünvan:") });
        else if(a === "2") socket.emit('adminAction', { action: 'mute', targetId: id });
        else if(a === "3") socket.emit('adminAction', { action: 'kick', targetId: id });
    }

    socket.on('kicked', () => { alert("Atıldınız!"); window.location.reload(); });

    // RİTİM ÇİZGİSİ
    let visualizerBaslatildi = false;
    function baslatRitim() {
        if(visualizerBaslatildi) return;
        const audio = document.getElementById('radyo-ses');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const aCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = aCtx.createAnalyser();
        const source = aCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(aCtx.destination);
        analyser.fftSize = 64;
        const buffer = analyser.frequencyBinCount;
        const dataArr = new Uint8Array(buffer);

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArr);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            dataArr.forEach((val, i) => {
                ctx.fillStyle = `rgb(255, ${val}, 0)`;
                ctx.fillRect(i * (canvas.width/buffer), canvas.height - val/2, (canvas.width/buffer)-1, val/2);
            });
        }
        draw();
        visualizerBaslatildi = true;
    }
</script>
</body>
</html>
