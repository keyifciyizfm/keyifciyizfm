<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Keyifciyiz FM - Canlı Sohbet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#1a1a1a;
font-family:Verdana;
color:#ccc;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

#login-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#login-box{
background:#333;
padding:30px;
border:2px solid #555;
text-align:center;
border-radius:8px;
width:320px;
box-shadow:0 0 20px #000;
}

#nick-input,#pass-input{
width:100%;
padding:12px;
margin-bottom:12px;
background:#222;
border:1px solid #444;
color:#fff;
border-radius:4px;
outline:none;
}

#chat-container{
width:950px;
height:620px;
background:#3b3b3b;
border:2px solid #444;
display:flex;
flex-direction:column;
position:relative;
}

#top-gradient{
height:15px;
width:100%;
background:linear-gradient(to right,#2ecc71,#f1c40f,#e74c3c);
}

#action-bar{
background:#4a4a4a;
padding:10px;
display:flex;
align-items:center;
border-bottom:2px solid #222;
z-index:500;
}

.tool-group{
display:flex;
align-items:center;
gap:8px;
padding:0 12px;
border-right:1px solid #555;
height:25px;
}

.f-btn{
background:linear-gradient(to bottom,#777,#333);
border:1px solid #111;
color:#fff;
padding:5px 12px;
font-size:11px;
cursor:pointer;
border-radius:3px;
}

#main-area{
display:flex;
flex:1;
overflow:hidden;
background:#222;
padding:8px;
gap:8px;
}

#messages{
flex:3;
background:#000;
border:1px solid #444;
padding:12px;
overflow-y:auto;
font-size:13px;
color:#fff;
background-size:cover;
background-position:center;
}

#user-list{
flex:1;
background:#111;
border:1px solid #444;
padding:12px;
font-size:12px;
overflow-y:auto;
}

.user-item{
display:flex;
align-items:center;
padding:6px;
border-bottom:1px solid #222;
gap:8px;
cursor:pointer;
transition:.2s;
border-radius:8px;
}

.user-item:hover{
background:rgba(255,255,255,.12);
backdrop-filter:blur(3px);
}

.status-box{
width:18px;
height:18px;
border:1px solid #444;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
border-radius:2px;
}

.status-0{background:#222;}
.status-1{background:#3498db;}
.status-2{background:#e74c3c;}

#input{
flex:1;
background:#000;
color:#fff;
border:1px solid #555;
padding:10px;
outline:none;
}

#pm-box{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:380px;
background:rgba(255,255,255,.13);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.25);
border-radius:15px;
padding:15px;
z-index:99999;
box-shadow:0 0 20px rgba(0,0,0,.5);
}

#pm-title{
font-size:15px;
font-weight:bold;
margin-bottom:10px;
color:#fff;
}

#pm-input{
width:100%;
height:80px;
background:rgba(0,0,0,.4);
border:none;
color:#fff;
padding:10px;
border-radius:10px;
outline:none;
resize:none;
}

#pm-messages{
height:160px;
overflow-y:auto;
margin-bottom:10px;
font-size:12px;
}

.pm-message{
margin-bottom:8px;
padding:6px;
background:rgba(0,0,0,.3);
border-radius:8px;
}

</style>
</head>

<body>

<div id="login-overlay">
<div id="login-box">

<h3 style="color:#2ecc71;margin-bottom:15px;">
Keyifciyiz FM
</h3>

<input type="text" id="nick-input" placeholder="Nickiniz..." onkeyup="checkAdmin(this.value)">

<div id="pass-area" style="display:none;">
<input type="password" id="pass-input" placeholder="Şifre...">
</div>

<button class="f-btn" onclick="joinChat()" style="padding:10px 40px;">
BAĞLAN
</button>

<p id="error-msg" style="color:#ff4757;font-size:12px;margin-top:10px;display:none;"></p>

</div>
</div>

<div id="chat-container">

<div id="top-gradient"></div>

<div id="action-bar">

<div class="tool-group">
<button class="f-btn" id="pm-toggle-btn" style="display:none;" onclick="togglePMSystem()">
💌 ÖM KAPAT
</button>
</div>

<div style="flex:1;"></div>

<button class="f-btn" onclick="location.reload()">Çıkış</button>

</div>

<div id="main-area">

<div id="messages"></div>

<div id="user-list">
<b style="color:#f1c40f">Dinleyiciler</b>
<hr style="margin:8px 0;border:#333 1px solid;">
<div id="users"></div>
</div>

</div>

<form id="form" onsubmit="sendMessage(event)" style="display:flex;padding:10px;background:#3b3b3b;gap:5px;">
<input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
<button type="submit" class="f-btn">GÖNDER</button>
</form>

</div>

<!-- PM BOX -->

<div id="pm-box">

<div id="pm-title">
Özel Mesaj
</div>

<div id="pm-messages"></div>

<textarea id="pm-input" placeholder="Mesaj yaz..."></textarea>

<div style="margin-top:10px;display:flex;gap:10px;justify-content:flex-end;">

<button class="f-btn" onclick="closePM()">
Kapat
</button>

<button class="f-btn" onclick="sendPM()">
Gönder
</button>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

var socket = io();

var myNick = "";
var myRole = "";
var selectedUser = "";
var pmSystem = true;

function checkAdmin(v){

document.getElementById('pass-area').style.display =
(v === "Keyifciyiz_Fm") ? "block" : "none";
}

function joinChat(){

const n = document.getElementById('nick-input').value.trim();
const p = document.getElementById('pass-input').value.trim();

if(n)
socket.emit('join',{
nick:n,
password:p
});
}

socket.on('auth error',m=>{

const e = document.getElementById('error-msg');

e.innerText = m;
e.style.display = "block";
});

socket.on('login success',d=>{

myNick = d.nick;
myRole = d.role;

document.getElementById('login-overlay').style.display='none';

if(myRole === 'Yönetici'){
document.getElementById('pm-toggle-btn').style.display='block';
}
});

socket.on('pm system',state=>{

pmSystem = state;

document.getElementById('pm-toggle-btn').innerText =
state ? "💌 ÖM KAPAT" : "🚫 ÖM AÇ";
});

function togglePMSystem(){
socket.emit('toggle pm system');
}

socket.on('chat message',d=>{

const div = document.createElement('div');

div.style.marginBottom="8px";

div.innerHTML =
`<b style="color:${d.color}">${d.user}:</b>
<span style="
color:${d.color};
font-weight:${d.style?.bold?'bold':'normal'};
font-style:${d.style?.italic?'italic':'normal'};
text-decoration:${d.style?.underline?'underline':'none'};
">${d.text}</span>`;

document.getElementById('messages').appendChild(div);

document.getElementById('messages').scrollTop =
document.getElementById('messages').scrollHeight;
});

socket.on('user list',data=>{

const uDiv = document.getElementById('users');

uDiv.innerHTML='';

data.list.forEach(u=>{

if(u.nick === myNick) return;

const item = document.createElement('div');

item.className='user-item';

item.onclick=()=>openPM(u.nick);

const box = document.createElement('div');

box.className=`status-box status-${u.status || 0}`;

const name = document.createElement('span');

name.style.color=u.color;
name.style.fontWeight="bold";
name.innerText=u.nick;

item.appendChild(box);
item.appendChild(name);

uDiv.appendChild(item);
});
});

function openPM(nick){

if(!pmSystem){
alert("Özel mesaj sistemi kapalı!");
return;
}

selectedUser = nick;

document.getElementById('pm-box').style.display='block';

document.getElementById('pm-title').innerText =
"💌 " + nick + " ile özel sohbet";
}

function closePM(){

document.getElementById('pm-box').style.display='none';
}

function sendPM(){

const input = document.getElementById('pm-input');

if(!input.value) return;

socket.emit('private message',{
target:selectedUser,
text:input.value
});

input.value='';
}

socket.on('private message',d=>{

const div = document.createElement('div');

div.className='pm-message';

div.innerHTML =
`<b style="color:${d.color}">${d.from}:</b> ${d.text}`;

document.getElementById('pm-messages').appendChild(div);
});

socket.on('private message self',d=>{

const div = document.createElement('div');

div.className='pm-message';

div.innerHTML =
`<b style="color:${d.color}">Sen → ${d.to}:</b> ${d.text}`;

document.getElementById('pm-messages').appendChild(div);
});

function sendMessage(e){

e.preventDefault();

const i = document.getElementById('input');

if(i.value){

socket.emit('chat message',{
text:i.value
});

i.value='';
}
}

</script>

</body>
</html>
