<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#f1c40f; margin-bottom:15px;">Sohbete Giriş</h3>
        <input id="nick-input" class="auth-input" placeholder="Nickiniz" oninput="checkAdmin(this.value)">
        <div id="admin-pass-area" style="display:none;">
            <input id="pass-input" type="password" class="auth-input" placeholder="Yönetici Şifresi">
        </div>
        <button class="f-btn" style="width:100%; margin-top:10px;" onclick="joinChat()">ODAYA GİR</button>
        <p id="msg" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>
</div>

<script>
    // Bu fonksiyonu script kısmına ekle
    function checkAdmin(val) {
        // Eğer nick "Halil" ise şifre kutusunu aç
        document.getElementById('admin-pass-area').style.display = (val === "Halil") ? "block" : "none";
    }

    function joinChat() {
        var n = document.getElementById('nick-input').value.trim();
        var p = document.getElementById('pass-input').value.trim();
        if(!n) return;
        socket.emit('join', { nick: n, password: p });
    }

    socket.on('auth error', (m) => document.getElementById('msg').innerText = m);
    
    socket.on('login success', (d) => { 
        myRole = d.role; 
        myNick = d.nick;
        document.getElementById('login-overlay').style.display='none'; 
    });

    // Daha önceki adm() fonksiyonunu da koru:
    function adm(t) {
        if(myRole !== 'Yönetici' || t === myNick) return;
        var c = prompt(t + " için:\n1: At (Kick)\n2: Yasakla (IP Ban)");
        if(c === "1") socket.emit('admin command', {action: 'kick', targetNick: t});
        if(c === "2") socket.emit('admin command', {action: 'ban', targetNick: t});
    }
</script>
