<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyifciyiz FM - Canlı Radyo</title>
    <style>
        body { background: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app-container { width: 450px; background: #1a1a1a; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); overflow: hidden; border: 1px solid #333; }
        
        /* Giriş Ekranı */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { background: #222; padding: 30px; border-radius: 10px; width: 300px; text-align: center; border: 1px solid #2ecc71; }
        
        /* Panel Alanları */
        .panel { padding: 20px; border-bottom: 1px solid #252525; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; display: inline-block; margin-right: 5px; }
        .dot.active { background: #ff4757; box-shadow: 0 0 8px #ff4757; }

        /* Butonlar ve Inputlar */
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #2ecc71; color: #000; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:hover { background: #27ae60; }
        .btn-stop { background: #e74c3c; color: white; margin-top: 8px; }

        /* Sohbet */
        #chat-box { height: 200px; overflow-y: auto; background: #111; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; border: 1px solid #222; }
        .msg { margin-bottom: 5px; }
        .msg b { color: #2ecc71; }

        #admin-controls { display: none; background: #1e272e; border-top: 2px solid #2ecc71; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color: #2ecc71; margin-top: 0;">Keyifciyiz FM</h2>
        <input type="text" id="nick" placeholder="Radyo Takma Adınız">
        <input type="password" id="pass" placeholder="Admin Şifresi (Gerekliyse)">
        <button class="btn" onclick="joinServer()">BAĞLAN</button>
    </div>
</div>

<div id="app-container">
    <div class="panel">
        <div class="status-bar">
            <div>
                <span id="status-dot" class="dot"></span>
                <span id="status-text" style="font-size: 12px; color: #888;">YAYIN BEKLENİYOR</span>
            </div>
            <button id="sync-btn" onclick="enableAudio()" style="background: #f1c40f; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer;">HOPARLÖRÜ AÇ</button>
        </div>
        <audio id="player" controls style="width: 100%;"></audio>
    </div>

    <div id="admin-controls" class="panel">
        <small style="color: #2ecc71;">YÖNETİCİ PANELİ</small>
        <input type="file" id="audio-input" accept="audio/*">
        <button class="btn" onclick="startBroadcast()">ŞARKIYI YAYINLA</button>
        <button class="btn btn-stop" onclick="stopBroadcast()">YAYINI KES</button>
    </div>

    <div class="panel">
        <div id="chat-box"></div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="chat-input" placeholder="Mesaj yaz..." style="margin: 0;">
            <button class="btn" onclick="sendMsg()" style="width: 80px;">GÖNDER</button>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const player = document.getElementById('player');
    let myRole = "";

    // 1. Giriş Yapma
    function joinServer() {
        const nick = document.getElementById('nick').value;
        const password = document.getElementById('pass').value;
        if(!nick) return alert("Lütfen bir nick girin!");
        socket.emit('join', { nick, password });
    }

    socket.on('login-success', (data) => {
        myRole = data.role;
        document.getElementById('login-screen').style.display = 'none';
        if(myRole === 'Yönetici') {
            document.getElementById('admin-controls').style.display = 'block';
        }
    });

    // 2. Ses Kilidini Açma (Tarayıcılar için ŞART)
    function enableAudio() {
        player.play().then(() => {
            player.pause();
            document.getElementById('sync-btn').innerText = "BAĞLANDI ✅";
            document.getElementById('sync-btn').style.background = "#2ecc71";
            console.log("Ses kanalı aktif.");
        }).catch(() => alert("Lütfen önce sayfada herhangi bir yere tıklayın!"));
    }

    // 3. Yönetici: Yayın Başlatma
    function startBroadcast() {
        const fileInput = document.getElementById('audio-input');
        const file = fileInput.files[0];
        if(!file) return alert("Lütfen bir müzik dosyası seçin!");

        const reader = new FileReader();
        reader.onload = function(e) {
            const buffer = e.target.result;
            // Admin kendi player'ında başlatır
            const blob = new Blob([buffer], { type: file.type });
            player.src = URL.createObjectURL(blob);
            player.play();
            
            // Sunucuya gönder
            socket.emit('broadcast-audio', { buffer, type: file.type });
            updateUI(true);
        };
        reader.readAsArrayBuffer(file);
    }

    function stopBroadcast() {
        player.pause();
        player.src = "";
        socket.emit('stop-broadcast');
        updateUI(false);
    }

    // 4. Dinleyici: Yayını Alma
    socket.on('play-audio', (data) => {
        const blob = new Blob([data.buffer], { type: data.type });
        const url = URL.createObjectURL(blob);
        player.src = url;
        player.play().catch(err => {
            console.log("Otomatik oynatma engellendi. Lütfen HOPARLÖRÜ AÇ butonuna basın.");
        });
        updateUI(true);
    });

    socket.on('stop-audio', () => {
        player.pause();
        player.src = "";
        updateUI(false);
    });

    // Arayüz Güncelleme
    function updateUI(isLive) {
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-text');
        if(isLive) {
            dot.classList.add('active');
            txt.innerText = "CANLI YAYINDA";
            txt.style.color = "#ff4757";
        } else {
            dot.classList.remove('active');
            txt.innerText = "YAYIN BEKLENİYOR";
            txt.style.color = "#888";
        }
    }

    // 5. Sohbet
    function sendMsg() {
        const inp = document.getElementById('chat-input');
        if(inp.value) {
            socket.emit('chat-message', inp.value);
            inp.value = "";
        }
    }

    socket.on('chat-message', (data) => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="msg"><b>${data.user}:</b> ${data.text}</div>`;
        box.scrollTop = box.scrollHeight;
    });
</script>
</body>
</html>
