<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 5px; width: 320px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; min-width: 35px; justify-content: center; }
        .f-btn:hover { background: #555; }
        .f-btn.active { background: #2ecc71; color: #000; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { padding: 6px 0; border-bottom: 1px solid #222; cursor: pointer; }
        
        #emoji-panel { 
            display: none; 
            position: absolute; 
            bottom: 65px; 
            left: 12px; 
            background: #333; 
            border: 2px solid #555; 
            padding: 10px; 
            flex-wrap: wrap; 
            gap: 8px; 
            width: 250px; 
            border-radius: 8px; 
            box-shadow: 0 -5px 25px #000; 
            z-index: 50; 
        }
        .emoji-item { cursor: pointer; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #444; border-radius: 5px; }
        
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
        #custom-menu { display: none; position: absolute; background: #2a2a2a; border: 1px solid #f1c40f88; z-index: 2000; width: 160px; border-radius: 2px; }
        .menu-item { padding: 10px 15px; cursor: pointer; color: #ddd; font-size: 12px; border-bottom: 1px solid #333; }
        
        .system-msg { color: #f1c40f; font-style: italic; font-size: 12px; margin: 5px 0; border-left: 3px solid #f1c40f; padding-left: 10px; background: rgba(241, 196, 15, 0.1); }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nickiniz..." oninput="checkAdmin(this.value)" style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;"></div>
        <button class="f-btn" style="margin: 0 auto; padding: 10px 30px;" onclick="joinChat()">BAĞLAN</button>
    </div>
</div>

<div id="custom-menu">
    <div class="menu-item" onclick="muteAction()">🔇 Sustur/Aç</div>
    <div class="menu-item" onclick="kickAction()" style="color:#ff4757;">🚪 Odadan At</div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmojiPanel(event)">😊 Emojiler</button>
        <div style="margin-left: 15px; border-left: 1px solid #555; padding-left: 15px; display: flex; align-items: center; gap: 5px;">
            <button class="f-btn" onclick="changeFontSize(2)">A+</button>
            <button class="f-btn" onclick="changeFontSize(-2)">A-</button>
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>B</b></button>
            <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')"><i>I</i></button>
        </div>
        
        <div style="margin-left:15px; display: flex; align-items: center; gap: 8px;">
            <input type="color" id="colorPicker" value="#2ecc71" onchange="changeColor(this.value)" style="width:30px; height:25px; cursor:pointer; border:none; background:none;">
            <button class="f-btn" onclick="saveToNotes()" style="color: #2ecc71; font-weight: bold;">Chat</button>
            <button class="f-btn" onclick="showNotes()">Notlar</button>
        </div>

        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <div id="emoji-panel"></div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", selectedTarget = "", currentFontSize = 13, selectedColor = "#2ecc71", styles = { bold: false, italic: false, underline: false };
    var mutedUsers = [];

    const emojis = ['😊', '😂', '😎', '❤️', '🔥', '🌹', '👍', '🎤', '😉', '⭐', '☕', '🎵', '🎁', '⚡', '👏', '🥳'];
    const panel = document.getElementById('emoji-panel');
    emojis.forEach(e => {
        let d = document.createElement('div'); d.className = 'emoji-item'; d.innerText = e;
        d.onclick = (event) => { event.stopPropagation(); document.getElementById('input').value += e; document.getElementById('input').focus(); panel.style.display = 'none'; };
        panel.appendChild(d);
    });

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() { const n = document.getElementById('nick-input').value, p = document.getElementById('pass-input').value; if(n) socket.emit('join', { nick: n, password: p }); }
    
    socket.on('login success', d => { myNick = d.nick; myRole = d.role; document.getElementById('login-overlay').style.display = 'none'; });
    
    socket.on('chat message', d => {
        if (mutedUsers.includes(d.user)) return;
        const div = document.createElement('div'); div.style.marginBottom = "8px"; const s = d.style || {};
        div.innerHTML = `<b style="color:${d.color}; cursor:pointer;" onclick="openAdminMenu('${d.user}', event)">${d.user}:</b> 
            <span style="color:${d.color}; font-weight:${s.bold?'bold':'normal'}; font-style:${s.italic?'italic':'normal'}; text-decoration:${s.underline?'underline':'none'};">${d.text}</span>`;
        document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const i = document.createElement('div'); i.className = 'user-item'; i.style.color = u.color;
            let tag = (u.nick === "Keyifciyiz_Fm") ? " (Dj)" : (u.role === "Yönetici" ? " (Sahibi)" : (u.role === "DJ" ? " (Dj)" : ""));
            i.innerText = u.nick + tag; i.onclick = (e) => { e.stopPropagation(); openAdminMenu(u.nick, e); };
            uDiv.appendChild(i);
        });
    });

    function openAdminMenu(t, e) { if (myRole !== 'Yönetici' || t === myNick) return; selectedTarget = t; const m = document.getElementById('custom-menu'); m.style.display = 'block'; m.style.left = e.pageX + "px"; m.style.top = e.pageY + "px"; e.stopPropagation(); }
    document.addEventListener('click', () => { document.getElementById('custom-menu').style.display = 'none'; document.getElementById('emoji-panel').style.display = 'none'; });
    function toggleEmojiPanel(e) { e.stopPropagation(); const p = document.getElementById('emoji-panel'); p.style.display = (p.style.display === 'flex' ? 'none' : 'flex'); }

    // SUSTURMA VE ODADAN ATMA (Keyifciyiz_Fm Formatı)
    function muteAction() {
        let actionText = "";
        if (mutedUsers.includes(selectedTarget)) {
            mutedUsers = mutedUsers.filter(u => u !== selectedTarget);
            actionText = `📢 Keyifciyiz_Fm: ${selectedTarget} kullanıcısını açtı.`;
        } else {
            mutedUsers.push(selectedTarget);
            actionText = `🚫 Keyifciyiz_Fm: ${selectedTarget} kullanıcısını susturdu.`;
        }
        socket.emit('chat message', { text: actionText, color: '#f1c40f', isSystem: true });
    }

    function kickAction() {
        const actionText = `🚪 Keyifciyiz_Fm: ${selectedTarget} kullanıcısını odadan attı!`;
        socket.emit('admin command', {action: 'kick', targetNick: selectedTarget});
        socket.emit('chat message', { text: actionText, color: '#ff4757', isSystem: true });
    }

    // CHAT (NOT) KAYDETME SİSTEMİ
    function saveToNotes() {
        const input = document.getElementById('input');
        if(!input.value.trim()) return alert("Kaydedilecek bir metin yazın!");
        let notes = JSON.parse(localStorage.getItem('fm_notes') || '[]');
        notes.push({ date: new Date().toLocaleString(), text: input.value });
        localStorage.setItem('fm_notes', JSON.stringify(notes));
        alert("Mesaj Chat Notlarına Kaydedildi!");
        input.value = "";
    }

    function showNotes() {
        let notes = JSON.parse(localStorage.getItem('fm_notes') || '[]');
        if(notes.length === 0) return alert("Kayıtlı not bulunamadı.");
        let list = notes.map((n, i) => `${i+1}. [${n.date}] ${n.text}`).join('\n\n');
        alert(list);
    }

    function changeFontSize(n) { currentFontSize += n; document.getElementById('messages').style.fontSize = currentFontSize + "px"; }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function changeColor(c) { selectedColor = c; document.getElementById('input').style.color = c; }
    function sendMessage(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value, color: selectedColor, style: styles }); i.value = ''; } }
</script>
</body>
</html>
