<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Canlı Sohbet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* GİRİŞ EKRANI STİLİ (Görüntüdeki gibi) */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: linear-gradient(180deg, #444, #222); padding: 30px; border: 1px solid #777; text-align: center; border-radius: 12px; width: 350px; box-shadow: 0 0 30px #000; }
        #nick-input, #pass-input { padding: 12px; margin-bottom: 12px; display: block; width: 100%; background: #222; color: #fff; border: 1px solid #555; outline: none; border-radius: 4px; }
        
        /* ANA PANEL */
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; position: relative; z-index: 500; }
        .tool-group { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-right: 1px solid #555; height: 25px; }
        
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 5px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; }
        .f-btn.active { background: #2ecc71 !important; color: #000; font-weight: bold; }
        
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; position: relative; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; color: #fff; position: relative; background-size: cover; background-position: center; }
        .msg-content { position: relative; z-index: 2; margin-bottom: 8px; line-height: 1.4; }
        
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { display: flex; align-items: center; padding: 6px 0; border-bottom: 1px solid #222; gap: 8px; }
        .status-box { width: 18px; height: 18px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border-radius: 2px; flex-shrink: 0; }
        .status-0 { background: #222; } .status-1 { background: #3498db; } .status-2 { background: #e74c3c; }
        
        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 12px; background: #2a2a2a; border: 2px solid #555; padding: 10px; flex-wrap: wrap; gap: 10px; width: 280px; z-index: 2000; box-shadow: 0 -5px 25px #000; border-radius: 5px; }
        .emoji-item { cursor: pointer; transition: transform 0.2s; }
        
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #444; position: relative; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; border-radius: 3px; }
        .clear-info { text-align: center; color: #f1c40f; font-style: italic; border-bottom: 1px dashed #444; padding-bottom: 10px; margin-bottom: 15px; font-size: 12px; }
        #ban-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: #ff4757; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="color:#fff; margin-bottom:20px; font-weight:normal;">Keyifciyiz FM</h2>
        <input type="text" id="nick-input" placeholder="Nickiniz..." onkeyup="checkAdmin(this.value)">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Yönetici Şifresi..."></div>
        <button class="f-btn" style="padding:10px 40px; font-weight:bold; font-size:14px;" onclick="joinChat()">BAĞLAN</button>
        <p id="error-msg" style="color:#ff4757; font-size:12px; margin-top:15px; display:none;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <div class="tool-group"><button class="f-btn" id="emoji-trigger" onclick="toggleEmojiPanel(event)">😊 Emojiler</button></div>
        <div class="tool-group">
            <button class="f-btn" onclick="changeFontSize(2)">A+</button>
            <button class="f-btn" onclick="changeFontSize(-2)">A-</button>
        </div>
        <div class="tool-group">
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>B</b></button>
            <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')"><i>I</i></button>
            <button id="btn-underline" class="f-btn" onclick="toggleStyle('underline')"><u>U</u></button>
        </div>
        <div class="tool-group"><input type="color" id="colorPicker" value="#2ecc71" onchange="handleColorChange(this.value)" style="width:28px; height:22px; cursor:pointer; border:none; background:none;"></div>
        <div class="tool-group" id="admin-tools" style="display:none;">
            <button class="f-btn" style="color:#f1c40f;" onclick="clearChat()">🧹 Temizle</button>
            <button class="f-btn" style="color:#3498db;" onclick="document.getElementById('bg-upload').click()">🖼️ Resim</button>
            <input type="file" id="bg-upload" style="display:none;" accept="image/*" onchange="uploadBg(this)">
        </div>
        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="ban-overlay"><h1 style="font-size:50px;">🚫</h1><h3 id="ban-text" style="margin-top:10px;">Yayın Sona Erdi!</h3></div>
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <div id="emoji-panel"></div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", myStatus = 0, currentFontSize = 13, selectedColor = "#2ecc71";
    var styles = { bold: false, italic: false, underline: false };

    const emojis = [{c:':smile:',id:'1f604'},{c:':joy:',id:'1f602'},{c:':kiss:',id:'1f618'},{c:':heart:',id:'2764'},{c:':cool:',id:'1f60e'},{c:':fire:',id:'1f525'},{c:':rose:',id:'1f339'},{c:':thumbsup:',id:'1f44d'},{c:':microphone:',id:'1f399'},{c:':coffee:',id:'2615'},{c:':musical_note:',id:'1f3b5'},{c:':wink:',id:'1f609'}];
    const panel = document.getElementById('emoji-panel');
    emojis.forEach(e => {
        let d = document.createElement('div'); d.className = 'emoji-item';
        d.innerHTML = `<img src="https://fonts.gstatic.com/s/e/notoemoji/latest/${e.id}/512.webp" style="width:30px;height:30px;">`;
        d.onclick = (ev) => { ev.stopPropagation(); document.getElementById('input').value += e.c + ' '; document.getElementById('input').focus(); };
        panel.appendChild(d);
    });

    function toggleEmojiPanel(e) { e.stopPropagation(); const p = document.getElementById('emoji-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }
    document.addEventListener('click', (e) => { if(!panel.contains(e.target)) panel.style.display = 'none'; });

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() {
        const n = document.getElementById('nick-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(n) socket.emit('join', { nick: n, password: p });
    }

    // HATA MESAJI BURADA YAZDIRILIYOR
    socket.on('auth error', m => { 
        const e = document.getElementById('error-msg'); 
        e.innerText = m; 
        e.style.display = "block"; 
    });

    socket.on('login success', d => { myNick = d.nick; myRole = d.role; document.getElementById('login-overlay').style.display = 'none'; if(myRole === 'Yönetici') document.getElementById('admin-tools').style.display = 'flex'; });

    socket.on('chat cleared', () => {
        document.getElementById('messages').innerHTML = '<div class="clear-info">✨ Sohbet yönetici tarafından temizlendi ✨</div>';
    });

    socket.on('chat message', d => {
        if (d.isMuted && myRole !== 'Yönetici' && d.user !== myNick) return;
        const div = document.createElement('div'); div.className = "msg-content";
        let prefix = `<b style="color:${d.color}">${d.user}:</b>`;
        if(d.user.includes("(Susturuldu)")) prefix = `<b style="color:#777;">${d.user}:</b>`;
        div.innerHTML = `${prefix} <span style="color:${d.color}; font-weight:${d.style?.bold?'bold':'normal'}; font-style:${d.style?.italic?'italic':'normal'}; text-decoration:${d.style?.underline?'underline':'none'};">${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('status update', s => {
        myStatus = s;
        const o = document.getElementById('ban-overlay');
        if(s === 2) { o.style.display = 'flex'; document.getElementById('ban-text').innerText = "ENGELLENDİNİZ!"; } else { o.style.display = 'none'; }
    });

    socket.on('force logout', () => { document.getElementById('ban-overlay').style.display = 'flex'; document.getElementById('ban-text').innerText = "YAYIN SONA ERDİ!"; setTimeout(() => location.reload(), 3000); });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const item = document.createElement('div'); item.className = 'user-item';
            const box = document.createElement('div'); box.className = `status-box status-${u.status || 0}`;
            if(u.status === 1) box.innerText = "/"; if(u.status === 2) box.innerText = "-";
            if (myRole === 'Yönetici' && u.nick !== myNick) {
                box.style.cursor = "pointer";
                box.onclick = () => socket.emit('update status', { target: u.nick, state: ((u.status || 0) + 1) % 3 });
            }
            const name = document.createElement('span'); name.style.color = u.color; name.style.fontWeight = "bold"; name.innerText = u.nick;
            item.appendChild(box); item.appendChild(name); uDiv.appendChild(item);
        });
    });

    socket.on('background changed', url => { document.getElementById('messages').style.backgroundImage = `url('${url}')`; });
    function handleColorChange(c) { selectedColor = c; socket.emit('update color', c); }
    function changeFontSize(n) { currentFontSize += n; document.getElementById('messages').style.fontSize = currentFontSize + "px"; }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function clearChat() { if(confirm("Temizlensin mi?")) socket.emit('clear chat'); }
    function uploadBg(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = (e) => socket.emit('change background', e.target.result); reader.readAsDataURL(input.files[0]); } }
    function sendMessage(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value, color: selectedColor, style: styles }); i.value = ''; } }
</script>
</body>
</html>
