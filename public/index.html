<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Keyifciyiz FM</title>
<style>
body { background:#1a1a1a; color:#fff; font-family:Verdana; }
#messages { height:300px; overflow:auto; background:#000; padding:10px; }
#dj-panel { position:fixed; right:10px; bottom:10px; background:#111; padding:10px; border:2px solid #2ecc71; }
</style>
</head>
<body>

<button onclick="toggleRadio()">📻 Radyo Dinle</button>

<div id="messages"></div>

<form onsubmit="sendMessage(event)">
<input id="input">
<button>Gönder</button>
</form>

<!-- DJ PANEL -->
<div id="dj-panel">
    <h4>DJ PANEL</h4>
    <button onclick="startBroadcast()">▶ Yayın Başlat</button>
    <button onclick="stopBroadcast()">⛔ Durdur</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
var socket = io();

// chat
function sendMessage(e){
    e.preventDefault();
    let val = document.getElementById("input").value;
    socket.emit("chat message",{text:val});
    document.getElementById("input").value="";
}

socket.on("chat message",(d)=>{
    let div=document.createElement("div");
    div.innerHTML=`<b style="color:${d.color}">${d.user}:</b> ${d.text}`;
    document.getElementById("messages").appendChild(div);
});

// ===== RADYO PLAYER =====
let radio = new Audio("/stream");

function toggleRadio(){
    if(radio.paused){
        radio.play();
    }else{
        radio.pause();
    }
}

// ===== GERÇEK YAYIN =====
let mediaRecorder;
let stream;

async function startBroadcast(){
    stream = await navigator.mediaDevices.getUserMedia({audio:true});

    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = async (e)=>{
        await fetch("/broadcast",{
            method:"POST",
            body:e.data
        });
    };

    mediaRecorder.start(1000);
}

function stopBroadcast(){
    if(mediaRecorder){
        mediaRecorder.stop();
        stream.getTracks().forEach(t=>t.stop());
    }
}
</script>

</body>
</html>
