<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - V3</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #1a1a1a; color: #ccc; font-family: Tahoma; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* GİRİŞ */
        #login-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #222; border: 2px solid #444; padding: 30px; text-align: center; }
        .login-card input { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid #555; color: #fff; }

        /* ÜST PANEL: MESAJ YAZMA VE ARAÇLAR */
        .top-panel { background: #222; border-bottom: 2px solid #333; padding: 10px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        #msg-in { flex: 1; padding: 12px; background: #000; color: #fff; border: 1px solid #444; font-size: 15px; outline: none; }
        
        /* BUTONLAR (Görseldeki gibi beyaz kare tasarımlı) */
        .toolbar { display: flex; gap: 5px; align-items: center; }
        .f-btn { background: #fff; color: #000; border: 1px solid #999; width: 35px; height: 35px; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .f-btn:active { background: #ddd; }
        
        /* ANA İÇERİK */
        .content { display: flex; flex: 1; overflow: hidden; }
        #chat { flex: 3; background: #000; padding: 15px; overflow-y: auto; }
        .sidebar { width: 200px; background: #111; border-left: 1px solid #333; padding: 10px; }
        
        #viz { width: 100%; height: 30px; background: #000; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="color:#ff9900">RADYO GİRİŞ</h2>
        <input type="text" id="nick" placeholder="Üye Adı...">
        <input type="password" id="pass" placeholder="Şifre (Admin için)">
        <button onclick="giris()" style="width:100%; padding:10px; background:#ff9900; border:none; cursor:pointer;">BAĞLAN</button>
    </div>
</div>

<div class="top-panel">
    <div class="input-row">
        <input type="text" id="msg-in" placeholder="Mesajınızı buraya yazın..." onkeypress="if(event.key==='Enter') gonder()">
        <button onclick="gonder()" style="background:#ff9900; border:none; padding:0 20px; font-weight:bold; cursor:pointer;">GÖNDER</button>
    </div>
    <div class="toolbar">
        <button class="f-btn" onclick="font('up')">A+</button>
        <button class="f-btn" onclick="font('down')">A-</button>
        <button class="f-btn" onclick="emoji('😊')">😊</button>
        <button class="f-btn" onclick="style('bold')">B</button>
        <button class="f-btn" onclick="style('italic')">I</button>
        <button class="f-btn" onclick="style('underline')">U</button>
        <input type="color" onchange="fmt.color=this.value" style="width:35px; height:35px; border:none; cursor:pointer;">
        <button class="f-btn" id="mixer-btn" style="display:none; width:auto; padding:0 10px; background:#ff9900" onclick="alert('Mixer Açıldı')">Mixer</button>
    </div>
</div>

<div class="header" style="background:#111; padding:5px;">
    <canvas id="viz"></canvas>
</div>

<div class="content">
    <div id="chat"></div>
    <div class="sidebar" id="u-list">
        <div style="color:#ff9900; font-size:11px; border-bottom:1px solid #333; margin-bottom:5px;">DİNLEYİCİLER</div>
    </div>
</div>

<audio id="r-audio" crossorigin="anonymous"></audio>

<script>
    const socket = io();
    let fmt = { bold: false, italic: false, underline: false, color: '#ffffff', size: 15 };
    let myRole = "USER";

    function giris() {
        const n = document.getElementById('nick').value;
        const p = document.getElementById('pass').value;
        if(n) socket.emit('join', { username: n, password: p });
    }

    socket.on('authStatus', d => {
        myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === "ADMIN") document.getElementById('mixer-btn').style.display = 'block';
    });

    // BUTON FONKSİYONLARI
    function style(t) { fmt[t] = !fmt[t]; alert(t + " aktif!"); }
    function font(d) { fmt.size = (d === 'up') ? fmt.size + 2 : fmt.size - 2; }
    function emoji(e) { document.getElementById('msg-in').value += e; }

    function gonder() {
        const input = document.getElementById('msg-in');
        if(input.value) {
            socket.emit('sendMessage', { text: input.value, format: fmt });
            input.value = '';
        }
    }

    socket.on('message', d => {
        const chat = document.getElementById('chat');
        const s = `color:${d.format.color}; font-weight:${d.format.bold?'bold':'normal'}; font-style:${d.format.italic?'italic':'normal'}; text-decoration:${d.format.underline?'underline':'none'}; font-size:${d.format.size}px;`;
        chat.innerHTML += `<div style="margin-bottom:10px;"><b style="color:#ff9900">${d.user}:</b> <span style="${s}">${d.text}</span></div>`;
        chat.scrollTop = chat.scrollHeight;
    });

    socket.on('updateUserList', users => {
        const list = document.getElementById('u-list');
        list.innerHTML = '<div style="color:#ff9900; font-size:11px; border-bottom:1px solid #333; margin-bottom:5px;">DİNLEYİCİLER</div>';
        users.forEach(u => {
            let item = `<div style="padding:4px 0; font-size:13px;">● ${u.username}`;
            if(myRole === "ADMIN" && u.role !== "ADMIN") {
                item += ` <span style="color:red; cursor:pointer;" onclick="socket.emit('adminAction', {action:'kick', targetId:'${u.id}'})">[At]</span>`;
            }
            list.innerHTML += item + '</div>';
        });
    });

    socket.on('kicked', () => { alert("Atıldınız!"); window.location.reload(); });
</script>
</body>
</html>
