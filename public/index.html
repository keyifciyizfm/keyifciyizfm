<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 5px; width: 320px; }
        
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
        .f-btn.active { background: #2ecc71; color: #000; }
        
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }

        /* DJ MIXER STİLLERİ */
        #dj-mixer { display: none; position: fixed; top: 20px; right: 20px; width: 220px; background: #2a2a2a; border: 2px solid #f1c40f; border-radius: 10px; padding: 15px; z-index: 2000; box-shadow: 0 0 20px #000; cursor: move; }
        .mixer-title { color: #f1c40f; text-align: center; font-size: 11px; margin-bottom: 10px; font-weight: bold; }
        .stream-btn { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; margin-bottom: 10px; }
        
        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 12px; background: #333; border: 2px solid #555; padding: 15px; flex-wrap: wrap; gap: 10px; width: 280px; z-index: 50; }
        #custom-menu { display: none; position: absolute; background: #2a2a2a; border: 1px solid #f1c40f; z-index: 2000; width: 150px; }
        .menu-item { padding: 8px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #333; color: #ccc; }
        .menu-item:hover { background: #444; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nickiniz..." oninput="checkAdmin(this.value)" style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;"></div>
        <button class="f-btn" style="margin: 0 auto; padding: 10px 30px;" onclick="joinChat()">BAĞLAN</button>
        <p id="error-msg" style="color:red; font-size:11px; margin-top:10px;"></p>
    </div>
</div>

<div id="dj-mixer">
    <div class="mixer-title">🎧 KEYİFCİYİZ FM MIXER</div>
    <button id="stream-btn" class="stream-btn" onclick="toggleStream()" style="background: #2ecc71;">🔴 YAYINI BAŞLAT</button>
    <div style="font-size: 10px; color: #aaa; margin-bottom: 5px;">Mikrofon / Ses:</div>
    <input type="range" min="0" max="100" value="80" style="width:100%; margin-bottom:10px;">
    <div id="stream-status" style="font-size: 10px; text-align: center; color: #ff4757; font-weight: bold;">YAYIN KAPALI</div>
</div>

<div id="custom-menu">
    <div class="menu-item" onclick="kickAction()" style="color:#ff4757;">🚫 Odadan At</div>
    <div class="menu-item" onclick="banAction()" style="color:#ff4757;">⛔ IP Banla</div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmojiPanel(event)">😊 Emojiler</button>
        <div style="margin-left: 20px; display: flex; gap: 5px;">
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')">B</button>
            <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')">I</button>
            <input type="color" id="colorPicker" value="#2ecc71" onchange="changeColor(this.value)" style="width:30px; height:24px;">
        </div>
        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()">ÇIKIŞ</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list">
            <b style="color:#f1c40f">Dinleyiciler</b>
            <hr style="margin:10px 0; border:#333 1px solid;">
            <div id="users"></div>
        </div>
    </div>

    <div id="emoji-panel"></div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", selectedTarget = "", selectedColor = "#2ecc71", isStreaming = false;
    var styles = { bold: false, italic: false };

    const emojis = [
        {c: ':smile:', i: '1f60a'}, {c: ':joy:', i: '1f602'}, {c: ':cool:', i: '1f60e'},
        {c: ':heart:', i: '2764'}, {c: ':fire:', i: '1f525'}, {c: ':rose:', i: '1f339'},
        {c: ':thumbsup:', i: '1f44d'}, {c: ':microphone:', i: '1f399'}, {c: ':wink:', i: '1f609'},
        {c: ':star:', i: '2b50'}, {c: ':coffee:', i: '2615'}, {c: ':musical_note:', i: '1f3b5'}
    ];

    const panel = document.getElementById('emoji-panel');
    emojis.forEach(e => {
        let d = document.createElement('div');
        d.style.cursor = 'pointer';
        d.innerHTML = `<img src="https://raw.githubusercontent.com/jakejarvis/apple-emoji-svg/main/emoji/${e.i}.svg" width="24">`;
        d.onclick = () => { document.getElementById('input').value += e.c + ' '; document.getElementById('input').focus(); };
        panel.appendChild(d);
    });

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }

    function joinChat() {
        const n = document.getElementById('nick-input').value, p = document.getElementById('pass-input').value;
        if(n) socket.emit('join', { nick: n, password: p });
    }

    socket.on('login success', d => {
        myNick = d.nick; myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') {
            document.getElementById('dj-mixer').style.display = 'block';
            makeDraggable(document.getElementById('dj-mixer'));
        }
    });

    socket.on('auth error', msg => { document.getElementById('error-msg').innerText = msg; });

    socket.on('chat message', d => {
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        const s = d.style || {};
        div.innerHTML = `<b style="color:${d.color}; cursor:pointer;" onclick="openAdminMenu('${d.user}', event)">${d.user}:</b> 
        <span style="color:${d.color}; font-weight:${s.bold?'bold':'normal'}; font-style:${s.italic?'italic':'normal'};">${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users');
        uDiv.innerHTML = '';
        list.forEach(u => {
            const i = document.createElement('div');
            i.style.color = u.color;
            i.style.padding = "5px 0";
            i.style.cursor = "pointer";
            i.innerText = u.nick + (u.role === "Yönetici" ? " (DJ)" : "");
            i.onclick = (e) => openAdminMenu(u.nick, e);
            uDiv.appendChild(i);
        });
    });

    socket.on('force logout', msg => { alert(msg); location.reload(); });

    function toggleStream() {
        const btn = document.getElementById('stream-btn');
        const status = document.getElementById('stream-status');
        isStreaming = !isStreaming;
        if(isStreaming) {
            btn.innerText = "⏹ YAYINI DURDUR"; btn.style.background = "#e74c3c";
            status.innerText = "CANLI YAYINDA"; status.style.color = "#2ecc71";
            socket.emit('chat message', { text: "📢 DJ Yayına başladı! Keyifli dinlemeler.", color: "#f1c40f", style: {bold: true} });
        } else {
            btn.innerText = "🔴 YAYINI BAŞLAT"; btn.style.background = "#2ecc71";
            status.innerText = "YAYIN KAPALI"; status.style.color = "#ff4757";
        }
    }

    function openAdminMenu(t, e) {
        if (myRole !== 'Yönetici' || t === myNick) return;
        selectedTarget = t;
        const m = document.getElementById('custom-menu');
        m.style.display = 'block'; m.style.left = e.pageX + "px"; m.style.top = e.pageY + "px";
        e.stopPropagation();
    }

    document.addEventListener('click', () => {
        document.getElementById('custom-menu').style.display = 'none';
        document.getElementById('emoji-panel').style.display = 'none';
    });

    function toggleEmojiPanel(e) { e.stopPropagation(); const p = document.getElementById('emoji-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function changeColor(c) { selectedColor = c; }
    
    function sendMessage(e) {
        e.preventDefault();
        const i = document.getElementById('input');
        if(i.value) { socket.emit('chat message', { text: i.value, color: selectedColor, style: styles }); i.value = ''; }
    }

    function kickAction() { socket.emit('admin command', {action: 'kick', targetNick: selectedTarget}); }
    function banAction() { socket.emit('admin command', {action: 'ban', targetNick: selectedTarget}); }

    function makeDraggable(el) {
        let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        el.onmousedown = (e) => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            p3 = e.clientX; p4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (e) => {
                p1 = p3 - e.clientX; p2 = p4 - e.clientY; p3 = e.clientX; p4 = e.clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
            };
        };
    }
</script>
</body>
</html>
