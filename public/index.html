<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Canlı Radyo</title>
    <style>
        /* Tasarım kodların aynı kalsın diye özet geçiyorum, senin orijinal CSS'ini buraya koyabilirsin */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 8px; width: 320px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 5px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; color: #fff; }
        #floating-mixer { position: absolute; top: 80px; left: 50px; width: 300px; background: #2c3e50; border: 3px solid #1a252f; border-radius: 12px; z-index: 3000; display: none; padding: 15px; }
        .led-live { background: #ff4757; box-shadow: 0 0 10px #ff4757; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71;">Keyifciyiz FM</h3><br>
        <input type="text" id="nick-input" placeholder="Nickiniz..." style="width:100%; padding:10px; margin-bottom:10px; background:#222; color:#fff; border:1px solid #444;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="width:100%; padding:10px; margin-bottom:10px; background:#222; color:#fff; border:1px solid #444;"></div>
        <button class="f-btn" onclick="joinChat()" style="width:100%; padding:12px;">BAĞLAN</button>
    </div>
</div>

<div id="chat-container">
    <div id="action-bar">
        <div id="admin-tools" style="display:none;">
            <button class="f-btn" style="color:#f1c40f;" onclick="document.getElementById('floating-mixer').style.display='block'">🎚️ MIXER</button>
        </div>
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="floating-mixer">
        <button id="live-btn" class="f-btn" style="background:#27ae60; width:100%;" onclick="toggleBroadcasting()">🔴 YAYINI BAŞLAT</button>
        <hr style="margin:10px 0; border:1px solid #1a252f;">
        <label style="font-size:11px; color:#fff;"><input type="checkbox" id="mic-toggle" checked> Mikrofonu Aç</label>
    </div>

    <div id="messages"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // HTTPS VE PORT AYARINI OTOMATİK YAPAN BAĞLANMA KOMUTU
    var socket = io({ transports: ['websocket', 'polling'], upgrade: true });
    var myNick = "", myRole = "";

    // SES DEĞİŞKENLERİ
    let audioCtx, mixerDest, isBroadcasting = false;
    let mediaSource = new MediaSource();
    let sourceBuffer;
    let queue = [];
    let audioPlayer = new Audio();
    audioPlayer.autoplay = true;

    // 1. DJ: YAYIN BAŞLATMA
    async function toggleBroadcasting() {
        if (!isBroadcasting) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mixerDest = audioCtx.createMediaStreamDestination();
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const micNode = audioCtx.createMediaStreamSource(stream);
                micNode.connect(mixerDest);

                const recorder = new MediaRecorder(mixerDest.stream, { mimeType: 'audio/webm;codecs=opus' });
                recorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        e.data.arrayBuffer().then(buf => socket.emit('audio-stream', buf));
                    }
                };
                recorder.start(1000);
                isBroadcasting = true;
                document.getElementById('live-btn').innerText = "⬛ DURDUR";
                document.getElementById('live-btn').style.background = "#c0392b";
            } catch (err) { alert("Hata: " + err); }
        } else { location.reload(); }
    }

    // 2. DİNLEYİCİ: SESİ OYNATMA (EN KRİTİK KISIM)
    socket.on('audio-out', (buf) => {
        if (myRole === 'Yönetici') return;
        
        if (!audioPlayer.src) {
            audioPlayer.src = URL.createObjectURL(mediaSource);
            mediaSource.onsourceopen = () => {
                sourceBuffer = mediaSource.addSourceBuffer('audio/webm;codecs=opus');
                sourceBuffer.mode = 'sequence';
                sourceBuffer.onupdateend = () => {
                    if (queue.length > 0 && !sourceBuffer.updating) sourceBuffer.appendBuffer(queue.shift());
                };
            };
        }

        if (sourceBuffer && !sourceBuffer.updating) {
            sourceBuffer.appendBuffer(buf);
            audioPlayer.play().catch(() => {}); // Autoplay engelini aşmaya çalış
        } else {
            queue.push(buf);
        }
    });

    // GİRİŞ VE SOHBET
    function joinChat() {
        const n = document.getElementById('nick-input').value;
        const p = document.getElementById('pass-input').value;
        socket.emit('join', { nick: n, password: p });
    }

    document.getElementById('nick-input').onkeyup = function(e) {
        document.getElementById('pass-area').style.display = (this.value === "Keyifciyiz_Fm") ? "block" : "none";
    };

    socket.on('login success', d => {
        myNick = d.nick; myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') document.getElementById('admin-tools').style.display = 'block';
        
        // Dinleyiciye tıklama şartı (SES İÇİN ŞART!)
        if (myRole === 'Dinleyici') {
            const btn = document.createElement('button');
            btn.innerHTML = "📢 RADYOYU DİNLEMEK İÇİN TIKLA";
            btn.style = "width:100%; padding:15px; background:#f1c40f; border:none; cursor:pointer; font-weight:bold;";
            btn.onclick = function() { audioPlayer.play(); this.remove(); };
            document.getElementById('messages').prepend(btn);
        }
    });
</script>
</body>
</html>
