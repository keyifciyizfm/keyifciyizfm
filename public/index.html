<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Flatcast Style Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 5px; width: 320px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; gap: 5px; }
        .f-btn.active { background: #2ecc71; color: #000; }

        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        
        .user-item { padding: 8px 0; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; }
        .rank-text { font-family: 'Georgia', serif; font-style: italic; font-size: 11px; margin-left: 12px; font-weight: bold; }

        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM Sohbet</h3>
        <input type="text" id="nick-input" placeholder="Rumuz..." oninput="checkAdmin(this.value)" style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;">
        <div id="pass-area" style="display:none;">
            <input type="password" id="pass-input" placeholder="Yönetici Şifresi..." style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;">
        </div>
        <button class="f-btn" style="margin: 0 auto; padding: 10px 30px;" onclick="joinChat()">GİRİŞ</button>
        <p id="error-msg" style="color:red; font-size:11px; margin-top:10px;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <span style="color:#f1c40f; font-size:11px; font-weight:bold;">SOHBET ODASI</span>
        <div style="flex: 1;"></div>
        <button class="f-btn" style="background: #e74c3c; border:none;" onclick="location.reload()">ÇIKIŞ</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yazın..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myRole = "", myNick = "";

    function checkAdmin(v) { 
        document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; 
    }
    
    function joinChat() {
        var nick = document.getElementById('nick-input').value;
        var pass = document.getElementById('pass-input').value;
        if(nick.trim() != "") {
            socket.emit('join', { nick: nick, password: pass });
        }
    }

    socket.on('auth error', (m) => { document.getElementById('error-msg').innerText = m; });
    socket.on('login success', (d) => {
        myRole = d.role; myNick = d.nick;
        document.getElementById('login-overlay').style.display = 'none';
    });

    function sendMessage(e) {
        e.preventDefault();
        var input = document.getElementById('input');
        if (input.value) {
            socket.emit('chat message', { text: input.value });
            input.value = '';
        }
    }

    socket.on('chat message', function(data) {
        var div = document.createElement('div');
        div.style.marginBottom = "8px";
        // SOHBETTE YETKİ GÖRÜNMEYECEK, SADECE NİCK: MESAJ
        div.innerHTML = `<b style="color:${data.color}; cursor:pointer" onclick="admAction('${data.user}')">${data.user}:</b> <span style="color:${data.color};">${data.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', function(list) {
        var userDiv = document.getElementById('users');
        userDiv.innerHTML = '';
        list.forEach(function(u) {
            var item = document.createElement('div');
            item.className = 'user-item';
            item.style.color = u.color;
            item.style.display = "flex";
            item.style.alignItems = "center";
            item.onclick = () => admAction(u.nick);
            
            let badge = "";
            if(u.role === 'DJ') {
                badge = `<span class="rank-text" style="color:#f1c40f; border-bottom:1px solid #f1c40f;">Dj</span>`;
            }
            
            item.innerHTML = `<span>${u.nick}</span> ${badge}`;
            userDiv.appendChild(item);
        });
    });

    function admAction(tN) {
        if (myRole !== 'DJ' || tN === myNick) return;
        var c = prompt(tN + " için işlem: 1: At, 2: Ban");
        if(c === "1") socket.emit('admin command', {action: 'kick', targetNick: tN});
        if(c === "2") socket.emit('admin command', {action: 'ban', targetNick: tN});
    }

    socket.on('force logout', (m) => { alert(m); location.reload(); });
</script>
</body>
</html>
