<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Flatcast Style</title>
    <style>
        body { background: #222; color: #00ff00; font-family: Tahoma, sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        #chat-container { width: 800px; height: 500px; background: #333; border: 3px solid #555; display: flex; flex-direction: column; }
        #top-bar { background: linear-gradient(to right, green, yellow, red); height: 10px; width: 100%; }
        #main-area { display: flex; flex: 1; overflow: hidden; }
        #messages { flex: 3; background: #000; margin: 10px; padding: 10px; overflow-y: auto; border: 1px solid #444; }
        #user-list { flex: 1; background: #111; margin: 10px 10px 10px 0; border: 1px solid #444; padding: 10px; font-size: 14px; }
        #input-area { padding: 10px; background: #444; display: flex; }
        input { flex: 1; background: #000; color: #fff; border: 1px solid #777; padding: 5px; }
        button { background: #666; color: white; border: 1px solid #999; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="top-bar"></div>
        <div id="main-area">
            <div id="messages"></div>
            <div id="user-list"><b>Kullanıcılar:</b><br><br>• Sen</div>
        </div>
        <form id="form" id="input-area" style="display:flex; padding: 10px;">
            <input id="input" autocomplete="off" placeholder="Mesajınızı yazın..." />
            <button>Gönder</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        var form = document.getElementById('form');
        var input = document.getElementById('input');
        var messages = document.getElementById('messages');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', function(data) {
            var item = document.createElement('div');
            item.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
