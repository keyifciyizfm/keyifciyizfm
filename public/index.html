<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Flatcast Style</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #1a1a1a; color: #ccc; font-family: Tahoma; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        /* Giriş Ekranı */
        #login-screen { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; }
        .login-box { border: 1px solid #444; padding: 20px; background: #222; text-align: center; }
        /* Üst Araç Çubuğu (image_11'e göre) */
        .toolbar { display: flex; gap: 5px; padding: 10px; background: #333; align-items: center; border-bottom: 1px solid #444; }
        .btn { background: #eee; border: 1px solid #999; padding: 2px 8px; cursor: pointer; color: #000; font-size: 12px; font-weight: bold; }
        .btn:active { background: #ccc; }
        /* Chat Alanı */
        .main { display: flex; flex: 1; overflow: hidden; }
        #chat-window { flex: 3; background: #000; padding: 10px; overflow-y: auto; border-right: 1px solid #333; }
        .user-list { width: 200px; background: #111; padding: 10px; font-size: 12px; }
        /* Yazı Yazma Alanı */
        .input-area { padding: 10px; background: #222; display: flex; gap: 5px; }
        #msg-input { flex: 1; padding: 10px; background: #000; color: #fff; border: 1px solid #444; }
        #visualizer { width: 100%; height: 40px; background: #000; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h3 style="color:#fff">GİRİŞ PANELİ</h3>
        <input type="text" id="nick" placeholder="Nickiniz..." style="width:100%; margin-bottom:10px; padding:8px;">
        <input type="password" id="pass" placeholder="Şifre (DJ)" style="width:100%; margin-bottom:10px; padding:8px;">
        <button onclick="baglan()" style="width:100%; padding:10px; cursor:pointer;">GİRİŞ</button>
    </div>
</div>

<div class="header" style="padding:5px; background:#111;">
    <canvas id="visualizer"></canvas>
    <div class="toolbar">
        <button class="btn" onclick="size('up')">A+</button>
        <button class="btn" onclick="size('down')">A-</button>
        <button class="btn" onclick="addEmoji('😊')">😊</button>
        <button class="btn" id="b-btn" onclick="toggle('bold')">B</button>
        <button class="btn" id="i-btn" onclick="toggle('italic')">I</button>
        <button class="btn" id="u-btn" onclick="toggle('underline')">U</button>
        <input type="color" id="clr" value="#ff0000" onchange="st.color=this.value" style="width:40px; height:24px; border:none; padding:0;">
        <button class="btn">Sound</button>
        <button class="btn" id="mixer-btn" style="display:none; background:#ff9900;" onclick="alert('Mixer Açıldı')">Login</button>
    </div>
</div>

<div class="main">
    <div id="chat-window"></div>
    <div class="user-list" id="users"></div>
</div>

<div class="input-area">
    <input type="text" id="msg-input" placeholder="Mesaj yaz kutusu..." onkeypress="if(event.key==='Enter') gonder()">
    <button onclick="gonder()" class="btn" style="padding:10px 20px;">GÖNDER</button>
</div>

<audio id="radyo" crossorigin="anonymous"></audio>

<script>
    const socket = io();
    let st = { bold: false, italic: false, underline: false, color: '#ff0000', size: 14 };

    function baglan() {
        const n = document.getElementById('nick').value;
        const p = document.getElementById('pass').value;
        if(n) socket.emit('join', { username: n, password: p });
    }

    socket.on('authStatus', d => {
        document.getElementById('login-screen').style.display = 'none';
        if(d.role === "ADMIN") document.getElementById('mixer-btn').style.display = 'block';
    });

    function toggle(t) { 
        st[t] = !st[t]; 
        document.getElementById(t[0]+'-btn').style.background = st[t] ? '#aaa' : '#eee';
    }
    
    function size(d) { st.size = (d === 'up') ? st.size + 2 : st.size - 2; }
    function addEmoji(e) { document.getElementById('msg-input').value += e; }

    function gonder() {
        const inp = document.getElementById('msg-input');
        if(inp.value) {
            socket.emit('sendMessage', { text: inp.value, format: st });
            inp.value = '';
        }
    }

    socket.on('message', d => {
        const cw = document.getElementById('chat-window');
        const s = `color:${d.format.color}; font-weight:${d.format.bold?'bold':'normal'}; font-style:${d.format.italic?'italic':'normal'}; text-decoration:${d.format.underline?'underline':'none'}; font-size:${d.format.size}px;`;
        cw.innerHTML += `<div><b>${d.user}:</b> <span style="${s}">${d.text}</span></div>`;
        cw.scrollTop = cw.scrollHeight;
    });

    socket.on('updateUserList', u => {
        document.getElementById('users').innerHTML = u.map(x => `<div>● ${x.username}</div>`).join('');
    });
</script>
</body>
</html>
