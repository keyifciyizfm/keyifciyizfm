<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet & DJ Panel - Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #chat-container { width: 980px; height: 650px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 30px #000; }
        #top-gradient { height: 12px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 10px; gap: 10px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 15px; overflow-y: auto; color: #fff; font-size: 14px; }
        
        #right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        #user-list { flex: 2; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; }

        /* MİKSER TASARIMI */
        #mixer-area { display: none; background: #111; border: 1px solid #444; padding: 15px; flex-direction: column; gap: 10px; }
        .mixer-channel { background: #1d1d1d; border: 1px solid #333; padding: 10px; border-radius: 4px; }
        .mixer-header { color: #f1c40f; font-weight: bold; font-size: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 8px; cursor: pointer; font-size: 11px; border-radius: 3px; }
        .mixer-slider { -webkit-appearance: none; width: 100%; height: 4px; background: #444; outline: none; }
        .mixer-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: #2ecc71; border-radius: 50%; cursor: pointer; }

        form#form { display: flex; padding: 15px; background: #3b3b3b; gap: 10px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 12px; outline: none; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="background: #333; padding: 40px; border: 2px solid #555; text-align: center; width: 350px;">
        <h2 style="color:#2ecc71; margin-bottom: 20px;">KEYİFCİYİZ FM</h2>
        <input type="text" id="nick-input" placeholder="Nickiniz..." style="padding:12px; width:100%; margin-bottom:10px; background:#111; color:#fff; border:1px solid #444;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="padding:12px; width:100%; margin-bottom:10px; background:#111; color:#fff; border:1px solid #444;"></div>
        <button class="f-btn" style="width:100%; padding:12px; background:#2ecc71; color:#000; font-weight:bold;" onclick="joinChat()">GİRİŞ YAP</button>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="main-area">
        <div id="messages"></div>
        <div id="right-panel">
            <div id="user-list">
                <b style="color:#f1c40f">Dinleyiciler</b>
                <hr style="margin:10px 0; border:#222 1px solid;">
                <div id="users"></div>
            </div>

            <div id="mixer-area">
                <b style="color:#f1c40f">YAYIN MERKEZİ</b>
                <button id="stream-btn" class="f-btn" style="background:#e74c3c; margin-bottom:5px;" onclick="startBroadcasting()">🎤 MİKROFONU AÇ</button>
                <button class="f-btn" style="background:#3498db; margin-bottom:10px;" onclick="document.getElementById('music-file').click()">🎵 PC'DEN MÜZİK SEÇ</button>
                <input type="file" id="music-file" hidden accept="audio/*" onchange="handleMusic(this)">

                <div class="mixer-channel">
                    <div class="mixer-header"><span>MÜZİK SESİ</span> <small id="mus-val">%50</small></div>
                    <input type="range" class="mixer-slider" min="0" max="100" value="50" oninput="adjustMusic(this.value)">
                </div>
                <audio id="dj-player" controls style="width: 100%; height: 30px; margin-top: 5px;"></audio>
            </div>
        </div>
    </div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn" style="background:#2ecc71; color:#000; width:100px; font-weight:bold;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myRole = "";
    let audioCtx, dest, musicSource, musicGain, mediaRecorder;

    // Yönetici Giriş Kontrolü
    document.getElementById('nick-input').oninput = function() {
        document.getElementById('pass-area').style.display = (this.value === "Keyifciyiz_Fm") ? "block" : "none";
    };

    function joinChat() {
        socket.emit('join', { 
            nick: document.getElementById('nick-input').value, 
            password: document.getElementById('pass-input').value 
        });
    }

    socket.on('login success', d => {
        myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') document.getElementById('mixer-area').style.display = 'flex';
    });

    // MÜZİK YÖNETİMİ
    function handleMusic(input) {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
        }
        const file = input.files[0];
        const player = document.getElementById('dj-player');
        player.src = URL.createObjectURL(file);
        player.play();

        if (!musicSource) {
            musicSource = audioCtx.createMediaElementSource(player);
            musicGain = audioCtx.createGain();
            musicSource.connect(musicGain);
            musicGain.connect(dest);
            musicSource.connect(audioCtx.destination);
        }
    }

    function adjustMusic(v) {
        document.getElementById('mus-val').innerText = "%" + v;
        if (musicGain) musicGain.gain.value = v / 100;
    }

    // YAYIN YÖNETİMİ
    async function startBroadcasting() {
        const btn = document.getElementById('stream-btn');
        if (btn.innerText.includes("AÇ")) {
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            if (audioCtx) {
                const micNode = audioCtx.createMediaStreamSource(micStream);
                micNode.connect(dest);
            }
            const finalStream = dest ? dest.stream : micStream;
            mediaRecorder = new MediaRecorder(finalStream);
            mediaRecorder.ondataavailable = (e) => socket.emit('voice-data', e.data);
            mediaRecorder.start(200);
            btn.innerText = "🛑 YAYINI KAPAT";
            btn.style.background = "#222";
        } else {
            mediaRecorder.stop();
            btn.innerText = "🎤 MİKROFONU AÇ";
            btn.style.background = "#e74c3c";
        }
    }

    socket.on('audio-stream', (data) => {
        const blob = new Blob([data], { type: 'audio/webm' });
        const audio = new Audio(URL.createObjectURL(blob));
        audio.play();
    });

    // SOHBET FONKSİYONLARI
    socket.on('chat message', d => {
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> ${d.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    function sendMessage(e) {
        e.preventDefault();
        const i = document.getElementById('input');
        if(i.value) { socket.emit('chat message', { text: i.value }); i.value = ''; }
    }

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => { 
            uDiv.innerHTML += `<div style="color:${u.color}; padding:5px 0;">${u.nick} ${u.role==='Yönetici'?'(DJ)':''}</div>`; 
        });
    });
</script>
</body>
</html>
