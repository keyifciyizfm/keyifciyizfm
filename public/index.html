<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Canlı Sohbet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; font-family: 'Verdana', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* GİRİŞ EKRANI */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #222; padding: 40px; border: 2px solid #444; text-align: center; border-radius: 10px; width: 350px; }
        #nick-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; outline: none; }

        /* ANA SOHBET PANELİ */
        #chat-container { 
            width: 950px; height: 620px; 
            background: #333; border: 3px solid #444; 
            display: flex; flex-direction: column; 
            position: relative; overflow: hidden;
        }

        /* VİDEODAKİ GİBİ MAVİ EKRAN SİSTEMİ */
        #flatcast-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #0077c5 0%, #003a66 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; font-family: 'Arial Black', sans-serif;
        }

        /* PARLAK BEYAZ BÜYÜK YAZI */
        .welcome-msg {
            color: #fff;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 2px 2px 4px rgba(0,0,0,0.5);
            animation: textPulse 2s infinite alternate;
        }

        @keyframes textPulse {
            from { opacity: 0.8; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* NOSTALJİK F5 GÖRÜNÜMÜ */
        .f5-glow { 
            font-size: 170px; color: #f1c40f; font-style: italic; 
            text-shadow: 8px 8px 0px #947600, 0 0 40px rgba(241, 196, 15, 0.4); 
            position: relative; line-height: 1; user-select: none;
        }
        .rolling-ball { 
            width: 48px; height: 48px; 
            background: radial-gradient(circle at 15px 15px, #00f2ff, #005a9c); 
            border-radius: 50%; position: absolute; top: 42%;
            box-shadow: 0 0 25px #00f2ff; 
            animation: bounceAcross 2.2s ease-in-out infinite; 
        }
        @keyframes bounceAcross {
            0% { transform: translateX(-170px); }
            50% { transform: translateX(170px); }
            100% { transform: translateX(-170px); }
        }

        /* İÇ PANEL DÜZENİ */
        #top-gradient { height: 10px; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #444; padding: 10px; display: flex; gap: 8px; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #666, #222); border: 1px solid #000; color: #fff; padding: 5px 15px; font-size: 12px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #000; padding: 5px; gap: 5px; }
        #messages { flex: 3; background: #000; padding: 15px; overflow-y: auto; color: #fff; background-size: cover; border: 1px solid #222; }
        #user-list { width: 200px; background: #0a0a0a; border: 1px solid #222; padding: 10px; }
        #input { flex: 1; background: #111; color: #fff; border: 1px solid #444; padding: 12px; outline: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="color:#f1c40f; margin-bottom:20px;">KEYİFCİYİZ FM</h2>
        <input type="text" id="nick-input" placeholder="Rumuzunuz..." onkeyup="checkAdmin(this.value)">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..."></div>
        <button class="f-btn" onclick="joinChat()" style="width:100%; height:45px;">RADYOYA GİR</button>
    </div>
</div>

<div id="chat-container">
    <div id="flatcast-loader">
        <div class="welcome-msg">Radyomuza Hoşgeldiniz</div>
        <div class="f5-glow">F5<div class="rolling-ball"></div></div>
    </div>

    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="location.reload()">ÇIKIŞ</button>
        <div style="flex:1"></div>
        <button class="f-btn" onclick="document.getElementById('bg-up').click()">RESİM YAZDIR</button>
        <input type="file" id="bg-up" style="display:none" onchange="uploadBg(this)">
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list">
            <b style="color:#f1c40f; font-size:11px;">DİNLEYİCİLER</b><hr style="margin:5px 0; border:#222 1px solid;">
            <div id="users"></div>
        </div>
    </div>

    <form id="form" onsubmit="sendMessage(event)" style="display:flex; padding:10px; background:#333; gap:5px;">
        <input id="input" autocomplete="off" placeholder="Mesajınızı buraya yazın..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }

    function joinChat() {
        const n = document.getElementById('nick-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(!n) return;
        document.getElementById('flatcast-loader').style.display = 'flex';
        setTimeout(() => { socket.emit('join', { nick: n, password: p }); }, 10000);
    }

    socket.on('auth error', m => { document.getElementById('flatcast-loader').style.display = 'none'; alert(m); });

    socket.on('login success', d => {
        const loader = document.getElementById('flatcast-loader');
        loader.style.transition = "opacity 1s";
        loader.style.opacity = "0";
        setTimeout(() => { 
            loader.style.display = "none"; 
            document.getElementById('login-overlay').style.display = 'none'; 
        }, 1000);
    });

    socket.on('chat message', d => {
        const div = document.createElement('div');
        div.style.marginBottom = "5px";
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span style="color:#fff">${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', data => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        data.list.forEach(u => {
            const item = document.createElement('div');
            item.innerHTML = `<span style="color:${u.color}">• ${u.nick}</span>`;
            uDiv.appendChild(item);
        });
    });

    socket.on('background changed', url => { document.getElementById('messages').style.backgroundImage = `url('${url}')`; });

    function uploadBg(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = (e) => socket.emit('change background', e.target.result); reader.readAsDataURL(input.files[0]); } }
    function sendMessage(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value }); i.value = ''; } }
</script>
</body>
</html>
