<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 5000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 5px; width: 320px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center; }
        .f-btn.active { background: #2ecc71 !important; color: #000 !important; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { padding: 6px 0; border-bottom: 1px solid #222; cursor: pointer; }
        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 12px; background: #333; border: 2px solid #555; padding: 15px; flex-wrap: wrap; gap: 10px; width: 280px; border-radius: 8px; z-index: 50; }
        .emoji-item { cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
        #custom-menu { display: none; position: absolute; background: #2a2a2a; border: 1px solid #f1c40f88; z-index: 2000; width: 160px; border-radius: 2px; }
        .menu-item { padding: 10px 15px; cursor: pointer; color: #ddd; font-size: 12px; border-bottom: 1px solid #333; }

        /* YÜZEN MİKSER STİLLERİ */
        #mixer-panel { display: none; position: fixed; top: 20px; right: 20px; width: 240px; background: #222; border: 2px solid #f1c40f; border-radius: 8px; z-index: 4000; padding: 10px; cursor: move; box-shadow: 0 10px 30px #000; }
        .mixer-title { font-size: 11px; color: #f1c40f; text-align: center; font-weight: bold; margin-bottom: 10px; }
        .mixer-sec { background: #333; padding: 8px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #444; }
        .mixer-label { font-size: 9px; color: #aaa; display: block; margin-bottom: 4px; }
        #broadcast-btn { width: 100%; background: #e74c3c; border: none; color: white; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        #broadcast-btn.on { background: #2ecc71; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nick..." oninput="checkAdmin(this.value)" style="padding:10px; width:100%; background:#222; color:#fff; border:1px solid #444; margin-bottom:10px;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="padding:10px; width:100%; background:#222; color:#fff; border:1px solid #444; margin-bottom:10px;"></div>
        <button class="f-btn" style="width:100%; padding:10px;" onclick="joinChat()">BAĞLAN</button>
    </div>
</div>

<div id="mixer-panel">
    <div class="mixer-title">STUDIO MIXER</div>
    <div class="mixer-sec">
        <span class="mixer-label">MÜZİK SEÇ</span>
        <input type="file" id="m-file" accept="audio/*" style="font-size:10px;" onchange="handleFile(this)">
        <audio id="m-player" loop style="display:none;"></audio>
    </div>
    <div class="mixer-sec">
        <span class="mixer-label">MÜZİK SESİ</span>
        <input type="range" min="0" max="1" step="0.1" value="0.5" style="width:100%;" oninput="if(gainN) gainN.gain.value = this.value">
    </div>
    <button id="broadcast-btn" onclick="toggleStream()">YAYINI BAŞLAT</button>
</div>

<div id="custom-menu">
    <div class="menu-item" onclick="kickAction()" style="color:#ff4757;">🚫 Odadan At</div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmojiPanel(event)">😊 Emojiler</button>
        <div style="margin-left:20px; display:flex; gap:5px;">
            <button class="f-btn" onclick="changeFontSize(2)">A+</button>
            <button class="f-btn" onclick="changeFontSize(-2)">A-</button>
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>B</b></button>
        </div>
        <input type="color" id="colorPicker" value="#2ecc71" onchange="selectedColor = this.value" style="margin-left:20px; width:30px; height:20px;">
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>
    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>
    <div id="emoji-panel"></div>
    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io(), myNick = "", myRole = "", selectedTarget = "", currentFontSize = 13, selectedColor = "#2ecc71", styles = { bold: false };
    var actx, dst, mNode, gainN, rec, mStream;

    // EMOJİLER
    const emojis = [{c:':smile:', i:'1f60a'}, {c:':joy:', i:'1f602'}, {c:':cool:', i:'1f60e'}, {c:':heart:', i:'2764'}, {c:':fire:', i:'1f525'}, {c:':rose:', i:'1f339'}, {c:':thumbsup:', i:'1f44d'}, {c:':microphone:', i:'1f399'}];
    emojis.forEach(e => {
        let d = document.createElement('div'); d.className='emoji-item'; d.innerHTML=`<img src="https://raw.githubusercontent.com/jakejarvis/apple-emoji-svg/main/emoji/${e.i}.svg" style="width:22px;">`;
        d.onclick=()=>{document.getElementById('input').value+=e.c+' ';}; document.getElementById('emoji-panel').appendChild(d);
    });

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() { socket.emit('join', { nick: document.getElementById('nick-input').value, password: document.getElementById('pass-input').value }); }
    
    socket.on('login success', d => { 
        myNick = d.nick; myRole = d.role; document.getElementById('login-overlay').style.display = 'none'; 
        if(myRole === 'Yönetici') document.getElementById('mixer-panel').style.display = 'block';
    });

    // MİKSER MOTORU
    function handleFile(input) {
        if(!actx) {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            dst = actx.createMediaStreamDestination();
            gainN = actx.createGain(); gainN.connect(dst); gainN.connect(actx.destination);
            mNode = actx.createMediaElementSource(document.getElementById('m-player'));
            mNode.connect(gainN);
        }
        document.getElementById('m-player').src = URL.createObjectURL(input.files[0]);
        document.getElementById('m-player').play();
    }

    async function toggleStream() {
        const btn = document.getElementById('broadcast-btn');
        if(!actx) return alert("Önce müzik seçin!");
        if(btn.innerText.includes("BAŞLAT")) {
            mStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const mic = actx.createMediaStreamSource(mStream); mic.connect(dst);
            rec = new MediaRecorder(dst.stream);
            rec.ondataavailable = (e) => socket.emit('voice-data', e.data);
            rec.start(200);
            btn.innerText = "🛑 YAYINI DURDUR"; btn.classList.add('on');
        } else {
            rec.stop(); mStream.getTracks().forEach(t=>t.stop());
            btn.innerText = "YAYINI BAŞLAT"; btn.classList.remove('on');
        }
    }

    // DİNLEYİCİ SES ÇALMA
    socket.on('audio-stream', (data) => {
        const b = new Blob([data], { type: 'audio/webm' });
        new Audio(URL.createObjectURL(b)).play().catch(()=>{});
    });

    // CHAT FONKSİYONLARI
    socket.on('chat message', d => {
        const div = document.createElement('div'); div.style.marginBottom = "5px";
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span style="font-weight:${d.style?.bold?'bold':'normal'}">${d.text}</span>`;
        document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop = 100000;
    });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const i = document.createElement('div'); i.className = 'user-item'; i.style.color = u.color;
            i.innerText = u.nick + (u.nick === "Keyifciyiz_Fm" ? " (Dj)" : "");
            i.onclick = (e) => openAdminMenu(u.nick, e); uDiv.appendChild(i);
        });
    });

    function sendMessage(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value){ socket.emit('chat message', {text:i.value, color:selectedColor, style:styles}); i.value=''; } }
    function openAdminMenu(t, e) { if (myRole !== 'Yönetici' || t === myNick) return; selectedTarget = t; const m = document.getElementById('custom-menu'); m.style.display='block'; m.style.left=e.pageX+"px"; m.style.top=e.pageY+"px"; e.stopPropagation(); }
    document.addEventListener('click', () => { document.getElementById('custom-menu').style.display='none'; document.getElementById('emoji-panel').style.display='none'; });
    function toggleEmojiPanel(e) { e.stopPropagation(); const p = document.getElementById('emoji-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
    function changeFontSize(n) { currentFontSize += n; document.getElementById('messages').style.fontSize = currentFontSize + "px"; }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function kickAction() { socket.emit('admin command', {action: 'kick', targetNick: selectedTarget}); }

    // SÜRÜKLEME
    const mx = document.getElementById("mixer-panel");
    let drag = false, off = [0,0];
    mx.onmousedown = (e) => { drag = true; off = [mx.offsetLeft - e.clientX, mx.offsetTop - e.clientY]; };
    document.onmouseup = () => drag = false;
    document.onmousemove = (e) => { if(drag) { mx.style.left = (e.clientX + off[0]) + 'px'; mx.style.top = (e.clientY + off[1]) + 'px'; } };
</script>
</body>
</html>
