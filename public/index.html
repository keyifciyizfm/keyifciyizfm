<!DOCTYPE html>
<html>
<head>
    <title>KeyifciyizFM - Giriş</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; }
        #auth-container { margin-top: 100px; }
        #chat-container { display: none; } /* Giriş yapana kadar gizli */
        .form-box { background: #222; padding: 20px; display: inline-block; border-radius: 10px; border: 1px solid #444; }
        input { display: block; margin: 10px auto; padding: 10px; width: 200px; background: #333; color: white; border: 1px solid #555; }
        button { padding: 10px 20px; cursor: pointer; background: #0066cc; color: white; border: none; }
        #chat-box { height: 400px; overflow-y: auto; background: black; text-align: left; padding: 20px; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="auth-container">
    <h2>KeyifciyizFM'e Hoşgeldiniz</h2>
    <div class="form-box">
        <input type="text" id="user" placeholder="Kullanıcı Adı">
        <input type="password" id="pass" placeholder="Şifre">
        <button onclick="login()">Giriş Yap</button>
        <button onclick="register()" style="background: #444;">Kayıt Ol</button>
    </div>
</div>

<div id="chat-container">
    <h3>KeyifciyizFM Canlı Sohbet</h3>
    <div id="chat-box"></div>
    <input type="text" id="msgInput" placeholder="Mesaj yazın...">
    <button onclick="send()">Gönder</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    let currentUsername = "";
    const socket = io();

    async function register() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        await fetch('/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });
        alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
    }

    async function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });
        const data = await res.json();
        if(data.success) {
            currentUsername = u;
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('chat-container').style.display = 'block';
        } else {
            alert(data.message);
        }
    }

    function send() {
        const text = document.getElementById('msgInput').value;
        socket.emit('chat message', { user: currentUsername, text: text });
        document.getElementById('msgInput').value = '';
    }

    socket.on('chat message', (data) => {
        const div = document.createElement('div');
        div.innerHTML = `<b>${data.user}:</b> ${data.text}`;
        document.getElementById('chat-box').appendChild(div);
    });
</script>
</body>
</html>
