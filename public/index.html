<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Canlı Sohbet & Mixer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Giriş Paneli */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 8px; width: 320px; }
        #nick-input, #pass-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #222; border: 1px solid #444; color: #fff; outline: none; }

        /* Ana Konteyner */
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        
        /* Mixer Paneli (Sadece Admin) */
        #admin-mixer { display: none; position: fixed; top: 80px; right: 20px; width: 280px; background: #2a2a2a; border: 2px solid #ff4757; border-radius: 8px; z-index: 3000; padding: 12px; color: #eee; cursor: move; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        #mixer-playlist { margin-top: 10px; max-height: 150px; overflow-y: auto; background: #000; padding: 5px; border-radius: 4px; font-size: 11px; }
        .playlist-item { padding: 5px; border-bottom: 1px solid #222; cursor: pointer; color: #2ecc71; }
        .playlist-item:hover { background: #333; }

        /* Ses Uyarı Butonu */
        #audio-notice { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: #f1c40f; color: #000; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; z-index: 5000; display: none; }

        /* Sohbet Alanları */
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; color: #fff; background-size: cover; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; }
        
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 5px 10px; font-size: 11px; cursor: pointer; border-radius: 3px; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
        #ban-overlay { display: none; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; color: #ff4757; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

<div id="audio-notice" onclick="activateAudio()">🎧 Yayını Duymak İçin Tıkla</div>
<audio id="player" style="display:none;"></audio>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nickiniz..." onkeyup="checkAdmin(this.value)">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Admin Şifresi..."></div>
        <button class="f-btn" onclick="joinChat()" style="padding:10px 40px;">BAĞLAN</button>
        <p id="error-msg" style="color:#ff4757; font-size:11px; margin-top:10px; display:none;"></p>
    </div>
</div>

<div id="admin-mixer">
    <div style="text-align:center; font-weight:bold; border-bottom:1px solid #444; padding-bottom:5px;">YAYIN MİKSERİ</div>
    <div style="display:flex; gap:5px; margin:10px 0;">
        <button onclick="startLive()" style="flex:1; background:#27ae60; color:#fff; border:none; padding:5px; border-radius:3px; cursor:pointer; font-size:10px;">YAYINI BAŞLAT</button>
        <button onclick="stopLive()" style="flex:1; background:#c0392b; color:#fff; border:none; padding:5px; border-radius:3px; cursor:pointer; font-size:10px;">DURDUR</button>
    </div>
    <div style="background:#1a1a1a; padding:8px; border-radius:4px;">
        <label style="font-size:10px; color:#888;">Müzik Ekle (Çoklu Seçim):</label>
        <input type="file" id="music-upload" multiple accept="audio/*" style="width:100%; font-size:10px; margin-top:5px; color:#ccc;">
    </div>
    <div id="mixer-playlist"></div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <div style="display:flex; gap:5px;" id="admin-tools">
            <button class="f-btn" onclick="clearChat()">🧹 Temizle</button>
            <button class="f-btn" onclick="document.getElementById('bg-upload').click()">🖼️ Arkaplan</button>
            <input type="file" id="bg-upload" style="display:none;" onchange="uploadBg(this)">
        </div>
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="ban-overlay"><h1 id="ban-text">BAĞLANTI KESİLDİ</h1></div>
        <div id="messages"></div>
        <div id="user-list">
            <div id="fixed-admin" style="text-align:center; padding:10px; background:#1a1a1a; border:1px solid #333; margin-bottom:10px;">
                <div style="font-size:9px; color:#666;">YAYINDA</div>
                <div id="admin-display-name" style="font-weight:bold; color:#ff4757;">Keyifciyiz_Fm</div>
            </div>
            <b>Dinleyiciler</b><hr style="border:#333 1px solid; margin:5px 0;">
            <div id="users"></div>
        </div>
    </div>

    <form id="form" onsubmit="sendMessage(event)" style="display:flex; padding:10px; background:#3b3b3b; gap:5px;">
        <input id="input" autocomplete="off" placeholder="Mesajınız..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", audioReady = false;
    var player = document.getElementById('player');

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() {
        const n = document.getElementById('nick-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(n) socket.emit('join', { nick: n, password: p });
    }

    function activateAudio() {
        player.play().then(() => { player.pause(); audioReady = true; document.getElementById('audio-notice').style.display = 'none'; });
    }

    socket.on('login success', d => {
        myNick = d.nick; myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') {
            document.getElementById('admin-mixer').style.display = 'block';
            dragElement(document.getElementById('admin-mixer'));
        }
    });

    // MÜZİK YÖNETİMİ
    document.getElementById('music-upload').addEventListener('change', function(e) {
        const list = document.getElementById('mixer-playlist');
        list.innerHTML = "";
        Array.from(e.target.files).forEach(file => {
            let div = document.createElement('div');
            div.className = "playlist-item";
            div.innerText = "🎵 " + file.name.substring(0, 30);
            div.onclick = () => {
                const reader = new FileReader();
                reader.onload = (ev) => socket.emit('play music', { name: file.name, stream: ev.target.result });
                reader.readAsDataURL(file);
            };
            list.appendChild(div);
        });
    });

    function startLive() { socket.emit('chat message', { text: "🔴 CANLI YAYIN BAŞLADI!", color: "#ff4757", style: { bold: true } }); }
    function stopLive() { socket.emit('stop music'); socket.emit('chat message', { text: "⚪ Yayın sona erdi.", color: "#7f8c8d" }); }

    socket.on('client play', (data) => {
        if(!audioReady) document.getElementById('audio-notice').style.display = 'block';
        player.src = data.stream;
        player.play();
        const div = document.createElement('div');
        div.innerHTML = `<span style="color:#f1c40f; font-size:11px;">🎧 Şu an çalıyor: ${data.name}</span>`;
        document.getElementById('messages').appendChild(div);
    });

    socket.on('client stop', () => { player.pause(); player.src = ""; });

    // DİĞER SOCKET OLAYLARI
    socket.on('chat message', d => {
        const div = document.createElement('div'); div.style.marginBottom = "5px";
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span style="color:${d.color}">${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', data => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        data.list.forEach(u => {
            if(u.nick === "Keyifciyiz_Fm") return;
            const item = document.createElement('div');
            item.innerHTML = `<span style="color:${u.color}">● ${u.nick}</span>`;
            uDiv.appendChild(item);
        });
    });

    function sendMessage(e) {
        e.preventDefault();
        const i = document.getElementById('input');
        if(i.value) { socket.emit('chat message', { text: i.value }); i.value = ''; }
    }

    function dragElement(elmnt) {
        var p1 = 0, p2 = 0, p3 = 0, p4 = 0;
        elmnt.onmousedown = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            p3 = e.clientX; p4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (e) => {
                p1 = p3 - e.clientX; p2 = p4 - e.clientY; p3 = e.clientX; p4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - p2) + "px"; elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
            };
        };
    }

    function uploadBg(input) { if(input.files[0]) { const r = new FileReader(); r.onload = (e) => socket.emit('change background', e.target.result); r.readAsDataURL(input.files[0]); } }
    socket.on('background changed', url => { document.getElementById('messages').style.backgroundImage = `url('${url}')`; });
</script>
</body>
</html>
