<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Canlı Radyo & Sohbet</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #app { width: 900px; height: 600px; background: #1e1e1e; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* Login */
        #login { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: #252525; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #121212; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
        
        /* Radyo Paneli */
        #radio-header { background: #252525; padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #121212; }
        #status-dot { width: 12px; height: 12px; background: #555; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .live { background: #ff4757 !important; box-shadow: 0 0 10px #ff4757; }
        
        /* Sohbet Alanı */
        #main { flex: 1; display: flex; overflow: hidden; }
        #chat { flex: 1; display: flex; flex-direction: column; padding: 15px; }
        #messages { flex: 1; overflow-y: auto; margin-bottom: 15px; font-size: 14px; }
        .msg { margin-bottom: 8px; }
        .msg b { color: #2ecc71; }

        /* Admin Kontrolleri */
        #admin-panel { background: #2c3e50; padding: 15px; display: none; gap: 10px; align-items: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-play { background: #2ecc71; color: white; }
        .btn-stop { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div id="login">
    <div class="login-card">
        <h2 style="color:#2ecc71">Keyifciyiz FM</h2>
        <input type="text" id="nick" placeholder="Nickiniz">
        <input type="password" id="pass" placeholder="Şifre (Sadece Admin)">
        <button class="btn btn-play" style="width:100%" onclick="join()">BAĞLAN</button>
    </div>
</div>

<div id="app">
    <div id="radio-header">
        <div>
            <span id="status-dot"></span>
            <span id="status-text">YAYIN YOK</span>
        </div>
        <audio id="radio-player" controls style="height: 30px;"></audio>
    </div>

    <div id="admin-panel">
        <input type="file" id="music-file" accept="audio/*" style="width: auto;">
        <button class="btn btn-play" onclick="publishMusic()">Şarkıyı Yayınla</button>
        <button class="btn btn-stop" onclick="stopMusic()">Yayını Kes</button>
    </div>

    <div id="main">
        <div id="chat">
            <div id="messages"></div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="m-input" placeholder="Mesaj yazın..." style="flex:1">
                <button class="btn" onclick="sendMsg()">Gönder</button>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const player = document.getElementById('radio-player');
    let myRole = "";

    function join() {
        const nick = document.getElementById('nick').value;
        const password = document.getElementById('pass').value;
        if(!nick) return alert("Nick girin!");
        socket.emit('join', { nick, password });
    }

    socket.on('login-success', d => {
        myRole = d.role;
        document.getElementById('login').style.display = 'none';
        if(myRole === 'Yönetici') {
            document.getElementById('admin-panel').style.display = 'flex';
        }
    });

    // --- YÖNETİCİ FONKSİYONLARI ---
    function publishMusic() {
        const file = document.getElementById('music-file').files[0];
        if(!file) return alert("Dosya seçin!");

        const reader = new FileReader();
        reader.onload = function(e) {
            const buffer = e.target.result;
            // Kendi player'ımızda çal
            const blob = new Blob([buffer], { type: file.type });
            player.src = URL.createObjectURL(blob);
            player.play();
            
            // Diğerlerine gönder
            socket.emit('admin-play', { buffer, type: file.type });
            updateStatus(true);
        };
        reader.readAsArrayBuffer(file);
    }

    function stopMusic() {
        player.pause();
        player.src = "";
        socket.emit('admin-stop');
        updateStatus(false);
    }

    // --- DİNLEYİCİ FONKSİYONLARI ---
    socket.on('client-play', (data) => {
        const blob = new Blob([data.buffer], { type: data.type });
        const url = URL.createObjectURL(blob);
        player.src = url;
        player.play().catch(() => {
            console.log("Otomatik oynatma tarayıcı tarafından engellendi. Play'e basın.");
        });
        updateStatus(true);
    });

    socket.on('client-stop', () => {
        player.pause();
        player.src = "";
        updateStatus(false);
    });

    // --- YARDIMCI ARAÇLAR ---
    function updateStatus(isLive) {
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-text');
        if(isLive) {
            dot.classList.add('live');
            txt.innerText = "CANLI YAYIN";
            txt.style.color = "#ff4757";
        } else {
            dot.classList.remove('live');
            txt.innerText = "YAYIN YOK";
            txt.style.color = "#555";
        }
    }

    function sendMsg() {
        const input = document.getElementById('m-input');
        if(input.value) {
            socket.emit('chat-message', input.value);
            input.value = "";
        }
    }

    socket.on('chat-message', d => {
        const msgs = document.getElementById('messages');
        msgs.innerHTML += `<div class="msg"><b>${d.user}:</b> ${d.text}</div>`;
        msgs.scrollTop = msgs.scrollHeight;
    });
</script>
</body>
</html>
