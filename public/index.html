<div id="action-bar">
    <button class="f-btn">💬 Chat</button>
    
    <div style="display: flex; gap: 2px; margin-left: 10px;">
        <button class="f-btn" onclick="changePersonalSize(2)">➕</button>
        <button class="f-btn" onclick="changePersonalSize(-2)">➖</button>
    </div>

    <div style="display: flex; gap: 2px; margin-left: 15px;">
        <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>A</b></button>
        <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')"><i>I</i></button>
        <button id="btn-underline" class="f-btn" onclick="toggleStyle('underline')"><u>U</u></button>
    </div>

    <div style="display: flex; align-items: center; gap: 5px; margin-left: 25px;">
        <input type="color" id="colorPicker" onchange="changeColor(this.value)" style="width:35px; height:22px; border:1px solid #222; cursor:pointer; background:none;">
        <span style="font-size:10px; color:#aaa; font-weight:bold;">RENK</span>
    </div>

    <div style="flex:1"></div>

    <button class="f-btn" onclick="location.reload()">👤 Çıkış</button>
</div>
