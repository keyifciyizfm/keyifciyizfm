<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Keyifciyiz FM</title>
    <style>
        /* SENİN MEVCUT STİLLERİN (BOZULMADI) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 5px; width: 320px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; min-width: 35px; justify-content: center; }
        .f-btn.active { background: #2ecc71; color: #000; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { padding: 6px 0; border-bottom: 1px solid #222; cursor: pointer; }
        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 12px; background: #333; border: 2px solid #555; padding: 15px; flex-wrap: wrap; gap: 10px; width: 280px; border-radius: 8px; box-shadow: 0 -5px 25px #000; z-index: 50; }
        .emoji-item { cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
        #custom-menu { display: none; position: absolute; background: #2a2a2a; border: 1px solid #f1c40f88; z-index: 2000; width: 160px; border-radius: 2px; }
        .menu-item { padding: 10px 15px; cursor: pointer; color: #ddd; font-size: 12px; border-bottom: 1px solid #333; }

        /* --- YENİ MİKSER STİLLERİ --- */
        #floating-mixer {
            display: none; position: fixed; top: 50px; right: 50px; width: 260px;
            background: #222; border: 2px solid #f1c40f; border-radius: 10px;
            z-index: 3000; cursor: move; box-shadow: 0 10px 40px rgba(0,0,0,0.8); padding: 15px;
        }
        .mixer-title { color: #f1c40f; font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; pointer-events: none; }
        .control-group { background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #444; }
        .control-label { font-size: 10px; color: #aaa; margin-bottom: 5px; display: block; }
        .mixer-slider { width: 100%; cursor: pointer; accent-color: #f1c40f; }
        #broadcast-btn { width: 100%; padding: 10px; font-weight: bold; margin-top: 5px; background: #e74c3c; border: none; color: white; border-radius: 4px; cursor: pointer; }
        #broadcast-btn.on { background: #2ecc71; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nickiniz..." oninput="checkAdmin(this.value)" style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="padding:10px; margin-bottom:10px; display:block; width:100%; background:#222; color:#fff; border:1px solid #444;"></div>
        <button class="f-btn" style="margin: 0 auto; padding: 10px 30px;" onclick="joinChat()">BAĞLAN</button>
    </div>
</div>

<div id="floating-mixer">
    <div class="mixer-title">🎧 YAYIN STÜDYOSU</div>
    
    <div class="control-group">
        <span class="control-label">MÜZİK YÜKLE</span>
        <input type="file" id="music-upload" accept="audio/*" style="font-size: 10px; color: #fff;" onchange="loadMusic(this)">
        <audio id="dj-player" style="display:none;" loop></audio>
    </div>

    <div class="control-group">
        <span class="control-label">MÜZİK SESİ</span>
        <input type="range" id="music-vol" class="mixer-slider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div class="control-group">
        <button id="broadcast-btn" onclick="toggleBroadcast()">📡 YAYINI BAŞLAT</button>
        <p id="stream-status" style="font-size: 9px; text-align: center; margin-top: 5px; color: #888;">Yayın Kapalı</p>
    </div>
</div>

<div id="custom-menu">
    <div class="menu-item" onclick="muteAction()">🔇 Sustur/Aç</div>
    <div class="menu-item" onclick="kickAction()" style="color:#ff4757;">🚫 Odadan At</div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmojiPanel(event)">😊 Emojiler</button>
        <div style="margin-left: 20px; border-left: 1px solid #555; padding-left: 15px; display: flex; align-items: center; gap: 5px;">
            <button class="f-btn" onclick="changeFontSize(2)">A+</button>
            <button class="f-btn" onclick="changeFontSize(-2)">A-</button>
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>A</b></button>
        </div>
        <input type="color" id="colorPicker" value="#2ecc71" onchange="changeColor(this.value)" style="margin-left:20px; width:35px; height:22px;">
        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <div id="emoji-panel"></div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", selectedTarget = "", currentFontSize = 13, selectedColor = "#2ecc71", styles = { bold: false, italic: false, underline: false };
    
    // SES DEĞİŞKENLERİ
    let audioCtx, dest, musicNode, gainNode, recorder, micStream;

    // --- MİKSER FONKSİYONLARI ---
    function loadMusic(input) {
        const file = input.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            document.getElementById('dj-player').src = url;
            document.getElementById('dj-player').play();
            initAudioEngine();
        }
    }

    function initAudioEngine() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
            
            // Müzik ayarı
            musicNode = audioCtx.createMediaElementSource(document.getElementById('dj-player'));
            gainNode = audioCtx.createGain();
            
            musicNode.connect(gainNode);
            gainNode.connect(dest);
            gainNode.connect(audioCtx.destination); // DJ de müziği duysun

            // Ses ayarını slider'a bağla
            document.getElementById('music-vol').oninput = (e) => {
                gainNode.gain.value = e.target.value;
            };
        }
    }

    async function toggleBroadcast() {
        const btn = document.getElementById('broadcast-btn');
        if (!audioCtx) { alert("Lütfen önce bir müzik yükleyin!"); return; }

        if (btn.innerText.includes("BAŞLAT")) {
            try {
                // Mikrofonu al ve miksere ekle
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const micNode = audioCtx.createMediaStreamSource(micStream);
                micNode.connect(dest);

                recorder = new MediaRecorder(dest.stream);
                recorder.ondataavailable = (e) => socket.emit('voice-data', e.data);
                recorder.start(200);

                btn.innerText = "🛑 YAYINI DURDUR";
                btn.classList.add('on');
                document.getElementById('stream-status').innerText = "🔴 CANLI YAYINDA";
                document.getElementById('stream-status').style.color = "#2ecc71";
            } catch (err) { alert("Mikrofon izni reddedildi!"); }
        } else {
            recorder.stop();
            micStream.getTracks().forEach(t => t.stop());
            btn.innerText = "📡 YAYINI BAŞLAT";
            btn.classList.remove('on');
            document.getElementById('stream-status').innerText = "Yayın Kapalı";
            document.getElementById('stream-status').style.color = "#888";
        }
    }

    // Dinleyiciler için sesi çalma
    socket.on('audio-stream', (data) => {
        const blob = new Blob([data], { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play().catch(e => {});
    });

    // --- SENİN MEVCUT SOHBET FONKSİYONLARIN (BOZULMADI) ---
    const emojis = [{c: ':smile:', i: '1f60a'}, {c: ':joy:', i: '1f602'}, {c: ':cool:', i: '1f60e'}, {c: ':heart:', i: '2764'}, {c: ':fire:', i: '1f525'}, {c: ':rose:', i: '1f339'}, {c: ':thumbsup:', i: '1f44d'}, {c: ':microphone:', i: '1f399'}, {c: ':wink:', i: '1f609'}, {c: ':star:', i: '2b50'}, {c: ':coffee:', i: '2615'}, {c: ':musical_note:', i: '1f3b5'}];
    const panel = document.getElementById('emoji-panel');
    emojis.forEach(e => {
        let d = document.createElement('div'); d.className = 'emoji-item';
        d.innerHTML = `<img src="https://raw.githubusercontent.com/jakejarvis/apple-emoji-svg/main/emoji/${e.i}.svg" style="width:24px;">`;
        d.onclick = () => { document.getElementById('input').value += e.c + ' '; document.getElementById('input').focus(); };
        panel.appendChild(d);
    });

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() { const n = document.getElementById('nick-input').value, p = document.getElementById('pass-input').value; if(n) socket.emit('join', { nick: n, password: p }); }
    
    socket.on('login success', d => { 
        myNick = d.nick; myRole = d.role; 
        document.getElementById('login-overlay').style.display = 'none'; 
        if(myRole === 'Yönetici') document.getElementById('floating-mixer').style.display = 'block';
    });

    socket.on('chat message', d => {
        const div = document.createElement('div'); div.style.marginBottom = "8px"; const s = d.style || {};
        div.innerHTML = `<b style="color:${d.color}; cursor:pointer;" onclick="openAdminMenu('${d.user}', event)">${d.user}:</b> 
            <span style="color:${d.color}; font-weight:${s.bold?'bold':'normal'};">${d.text}</span>`;
        document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const i = document.createElement('div'); i.className = 'user-item'; i.style.color = u.color;
            i.innerText = u.nick + (u.nick === "Keyifciyiz_Fm" ? " (Dj)" : "");
            i.onclick = (e) => { e.stopPropagation(); openAdminMenu(u.nick, e); };
            uDiv.appendChild(i);
        });
    });

    function openAdminMenu(t, e) { if (myRole !== 'Yönetici' || t === myNick) return; selectedTarget = t; const m = document.getElementById('custom-menu'); m.style.display = 'block'; m.style.left = e.pageX + "px"; m.style.top = e.pageY + "px"; e.stopPropagation(); }
    document.addEventListener('click', () => { document.getElementById('custom-menu').style.display = 'none'; document.getElementById('emoji-panel').style.display = 'none'; });
    function toggleEmojiPanel(e) { e.stopPropagation(); const p = document.getElementById('emoji-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
    function changeFontSize(n) { currentFontSize += n; document.getElementById('messages').style.fontSize = currentFontSize + "px"; }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function changeColor(c) { selectedColor = c; document.getElementById('input').style.color = c; }
    function sendMessage(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value, color: selectedColor, style: styles }); i.value = ''; } }
    function kickAction() { socket.emit('admin command', {action: 'kick', targetNick: selectedTarget}); }

    // --- MİKSERİ SÜRÜKLEME ÖZELLİĞİ ---
    const mixer = document.getElementById("floating-mixer");
    let isDragging = false, offset = [0,0];
    mixer.addEventListener('mousedown', (e) => { isDragging = true; offset = [mixer.offsetLeft - e.clientX, mixer.offsetTop - e.clientY]; });
    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => { if (isDragging) { mixer.style.left = (e.clientX + offset[0]) + 'px'; mixer.style.top = (e.clientY + offset[1]) + 'px'; } });
</head>
