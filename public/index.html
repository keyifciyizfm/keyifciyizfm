<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Flatcast Style Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Giriş Paneli Tasarımı */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 10px; width: 380px; box-shadow: 0 0 25px #000; }
        
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }

        /* Buton Stilleri - Daha Belirgin ve Okunur */
        .f-btn { 
            background: linear-gradient(to bottom, #888, #222); 
            border: 1px solid #000; 
            color: #fff !important; 
            padding: 8px 16px; 
            font-size: 12px; 
            font-weight: bold;
            cursor: pointer; 
            border-radius: 4px; 
            text-shadow: 1px 1px 2px #000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .f-btn:hover { background: linear-gradient(to bottom, #999, #444); color: #fff; }
        .f-btn.active { background: #2ecc71; color: #000 !important; text-shadow: none; }

        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        
        .auth-input { padding: 12px; margin-bottom: 15px; width: 100%; background: #000; color: #fff; border: 1px solid #666; border-radius: 5px; font-size: 14px; }
        
        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 15px; background: #333; border: 2px solid #555; padding: 10px; flex-wrap: wrap; gap: 12px; width: 240px; border-radius: 5px; z-index: 1000; }
        .emoji-item { font-size: 24px; cursor: pointer; }

        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #222; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 id="auth-title" style="color:#f1c40f; margin-bottom:20px; font-size: 20px;">Sohbet Girişi</h3>
        <input type="text" id="nick-input" class="auth-input" placeholder="Kullanıcı Adı">
        <input type="password" id="pass-input" class="auth-input" placeholder="Şifre">
        
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button id="main-auth-btn" class="f-btn" onclick="handleAuth()">GİRİŞ YAP</button>
            <button id="switch-btn" class="f-btn" style="background: linear-gradient(to bottom, #666, #333);" onclick="toggleAuthMode()">KAYIT OL</button>
        </div>
        <p id="auth-msg" style="font-size:12px; margin-top:20px; color:#ff4d4d; font-weight: bold; min-height: 15px;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmojiPanel()">😊 Emojiler</button>
        <div style="display: flex; gap: 5px; margin-left: 15px; border-left: 1px solid #555; padding-left: 15px;">
            <button class="f-btn" onclick="changePersonalSize(2)">➕</button>
            <button class="f-btn" onclick="changePersonalSize(-2)">➖</button>
        </div>
        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()">👤 Çıkış</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <div id="emoji-panel">
        <span class="emoji-item" onclick="addEmoji('😊')">😊</span>
        <span class="emoji-item" onclick="addEmoji('😂')">😂</span>
        <span class="emoji-item" onclick="addEmoji('😉')">😉</span>
        <span class="emoji-item" onclick="addEmoji('😎')">😎</span>
        <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
        <span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
        <span class="emoji-item" onclick="addEmoji('🌹')">🌹</span>
    </div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesajınız..." />
        <button type="submit" class="f-btn" style="width: 100px;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var isRegisterMode = false;
    var personalFontSize = 13;

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "Yeni Kayıt" : "Sohbet Girişi";
        document.getElementById('auth-title').style.color = isRegisterMode ? "#2ecc71" : "#f1c40f";
        document.getElementById('main-auth-btn').innerText = isRegisterMode ? "KAYDOL" : "GİRİŞ YAP";
        document.getElementById('switch-btn').innerText = isRegisterMode ? "İPTAL" : "KAYIT OL";
        document.getElementById('auth-msg').innerText = "";
    }

    function handleAuth() {
        var nick = document.getElementById('nick-input').value.trim();
        var pass = document.getElementById('pass-input').value.trim();
        if(!nick || !pass) { 
            document.getElementById('auth-msg').innerText = "Lütfen alanları doldurun!"; 
            return; 
        }
        
        if(isRegisterMode) { 
            socket.emit('register', { nick: nick, password: pass }); 
        } else { 
            socket.emit('login', { nick: nick, password: pass }); 
        }
    }

    // Sunucu yanıtları
    socket.on('auth error', (msg) => { 
        document.getElementById('auth-msg').style.color = "#ff4d4d"; 
        document.getElementById('auth-msg').innerText = msg; 
    });
    socket.on('auth success', (msg) => { 
        toggleAuthMode(); 
        document.getElementById('auth-msg').style.color = "#2ecc71"; 
        document.getElementById('auth-msg').innerText = msg; 
    });
    socket.on('login success', () => { 
        document.getElementById('login-overlay').style.display = 'none'; 
    });

    // Mesajlaşma fonksiyonları...
    function toggleEmojiPanel() { var p = document.getElementById('emoji-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }
    function addEmoji(e) { document.getElementById('input').value += e; document.getElementById('input').focus(); }
    function changePersonalSize(a) { personalFontSize += a; document.getElementById('messages').style.fontSize = personalFontSize + "px"; }

    function sendMessage(e) {
        e.preventDefault();
        var input = document.getElementById('input');
        if (input.value.trim()) {
            socket.emit('chat message', { text: input.value, color: "#2ecc71", style: {} });
            input.value = '';
            document.getElementById('emoji-panel').style.display = 'none';
        }
    }

    socket.on('chat message', (data) => {
        var div = document.createElement('div');
        div.style.marginBottom = "5px";
        div.innerHTML = `<span style="font-weight:bold; color:${data.color}">${data.user}:</span> <span style="color:${data.color}">${data.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', (u) => {
        var d = document.getElementById('users'); d.innerHTML = '';
        u.forEach((user) => { 
            var i = document.createElement('div'); 
            i.style.color = user.color; 
            i.innerHTML = '👤 ' + user.nick; 
            d.appendChild(i); 
        });
    });
</script>
</body>
</html>
