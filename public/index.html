<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Canlı Sohbet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #1e1e1e; padding: 30px; border: 1px solid #333; text-align: center; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #nick-input, #pass-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; }
        
        /* ANA PANEL */
        #chat-container { width: 950px; height: 650px; background: #1e1e1e; border: 1px solid #333; display: flex; flex-direction: column; position: relative; border-radius: 8px; overflow: hidden; }
        
        /* --- ŞIK RADYO PLAYER ALANI --- */
        #radio-header { 
            background: #252525; 
            height: 60px; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            border-bottom: 2px solid #e81e4d; 
            justify-content: space-between;
        }
        .player-box {
            background: #fff; /* Caster beyaz temasıyla bütünleşmesi için */
            border-radius: 30px;
            height: 40px;
            width: 180px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        /* Caster Widget Kırpma: Sadece Play butonuna odaklan */
        .cstrEmbed { 
            transform: scale(0.9); 
            margin-top: 5px; 
        }

        /* AKSİYON ÇUBUĞU */
        #action-bar { background: #2a2a2a; padding: 8px 15px; display: flex; align-items: center; border-bottom: 1px solid #111; gap: 5px; }
        .tool-group { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-right: 1px solid #444; }
        .f-btn { background: #333; border: 1px solid #444; color: #eee; padding: 5px 10px; font-size: 11px; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .f-btn:hover { background: #444; }
        .f-btn.active { background: #e81e4d !important; color: #fff; border-color: #e81e4d; }
        
        #main-area { display: flex; flex: 1; overflow: hidden; background: #0a0a0a; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #111; border: 1px solid #222; padding: 15px; overflow-y: auto; font-size: 13px; color: #eee; border-radius: 4px; }
        #user-list { flex: 1; background: #161616; border: 1px solid #222; padding: 12px; font-size: 12px; overflow-y: auto; border-radius: 4px; }
        
        #fixed-admin { padding: 10px; background: #222; border: 1px solid #333; border-radius: 6px; margin-bottom: 15px; text-align: center; border-left: 4px solid #e81e4d; }
        #admin-display-name { font-weight: bold; font-size: 14px; color: #e81e4d; }
        
        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 12px; background: #2a2a2a; border: 1px solid #444; padding: 10px; flex-wrap: wrap; gap: 10px; width: 280px; z-index: 2000; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        #input { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px; outline: none; border-radius: 6px; }
        #input:focus { border-color: #e81e4d; }
        
        .selected-nick { background-color: rgba(232, 30, 77, 0.2); border: 1px solid #e81e4d; padding: 2px 8px; border-radius: 4px; }
        #ban-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: #ff4757; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="color:#e81e4d; margin-bottom:20px; letter-spacing: 1px;">Keyifciyiz FM</h2>
        <input type="text" id="nick-input" placeholder="Kullanıcı Adı">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Yönetici Şifresi"></div>
        <button class="f-btn" onclick="joinChat()" style="width:100%; padding:12px; background:#e81e4d; border:none; font-weight:bold; font-size:14px;">BAĞLAN</button>
        <p id="error-msg" style="color:#ff4757; font-size:12px; margin-top:10px; display:none;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="radio-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:10px; height:10px; background:#e81e4d; border-radius:50%; animation: pulse 1.5s infinite;"></div>
            <span style="font-weight:bold; font-size:13px; letter-spacing:1px; color:#eee;">CANLI YAYIN</span>
        </div>
        
        <div class="player-box">
            <div data-type="newStreamPlayer" data-publicToken="684f0b21-8aad-453f-8984-b5bd4a927c45" data-theme="light" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Radio</a>
            </div>
        </div>

        <div style="color:#666; font-size:11px;">YazgulumFM v2.0</div>
    </div>

    <div id="action-bar">
        <div class="tool-group"><button class="f-btn" onclick="toggleEmojiPanel(event)">😊</button></div>
        <div class="tool-group">
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')">B</button>
            <input type="color" id="colorPicker" value="#ff4757" onchange="handleColorChange(this.value)" style="width:25px; height:20px; cursor:pointer; background:none; border:none;">
        </div>
        <div class="tool-group" id="admin-tools" style="display:none;">
            <button class="f-btn" style="color:#f1c40f;" onclick="clearChat()">🧹</button>
            <button class="f-btn" style="color:#3498db;" onclick="document.getElementById('bg-upload').click()">🖼️</button>
            <input type="file" id="bg-upload" style="display:none;" onchange="uploadBg(this)">
        </div>
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()" style="background:#444;">ÇIKIŞ</button>
    </div>

    <div id="main-area">
        <div id="ban-overlay"><h1 style="font-size:50px;">🚫</h1><h3 id="ban-text">Yayın Sona Erdi!</h3></div>
        <div id="messages"></div>
        <div id="user-list">
            <div id="fixed-admin">
                <div style="font-size:9px; color:#888; margin-bottom:4px;">YAYINDA</div>
                <div id="admin-display-name">Keyifciyiz_Fm</div>
            </div>
            <b style="color:#f1c40f; font-size:11px; margin-left:5px;">DİNLEYİCİLER</b>
            <hr style="margin:8px 0; border:0; border-top:1px solid #333;">
            <div id="users"></div>
        </div>
    </div>

    <div id="emoji-panel"></div>

    <form id="form" onsubmit="sendMessage(event)" style="display:flex; padding:15px; background:#1e1e1e; gap:10px; border-top:1px solid #333;">
        <input id="input" autocomplete="off" placeholder="Mesajınızı buraya yazın..." />
        <button type="submit" class="f-btn" style="background:#e81e4d; border:none; padding:0 25px; font-weight:bold; font-size:13px;">GÖNDER</button>
    </form>
</div>

<style>
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .user-item { display: flex; align-items: center; padding: 8px; border-radius: 6px; margin-bottom: 2px; transition: 0.2s; }
    .user-item:hover { background: #222; }
</style>

<script src="/socket.io/socket.io.js"></script>
<script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", selectedColor = "#2ecc71";
    var styles = { bold: false, italic: false, underline: false };
    var privateTarget = null;

    // Login logic
    document.getElementById('nick-input').onkeyup = function() {
        document.getElementById('pass-area').style.display = (this.value === "Keyifciyiz_Fm") ? "block" : "none";
    };

    function joinChat() {
        const n = document.getElementById('nick-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(n) socket.emit('join', { nick: n, password: p });
    }

    socket.on('login success', d => {
        myNick = d.nick; myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') document.getElementById('admin-tools').style.display = 'flex';
    });

    // Chat logic
    socket.on('chat message', d => {
        const m = document.getElementById('messages');
        const div = document.createElement('div');
        div.style.marginBottom = "10px";
        let pref = `<b style="color:${d.color}">${d.user}:</b>`;
        if(d.user.includes("Özel ->") || d.user === "SİSTEM") pref = `<b style="color:${d.color}">[${d.user}]</b>`;
        div.innerHTML = `${pref} <span style="color:${d.color}; font-weight:${d.style?.bold?'bold':'normal'}">${d.text}</span>`;
        m.appendChild(div);
        m.scrollTop = m.scrollHeight;
    });

    socket.on('user list', data => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        data.list.forEach(u => {
            if(u.nick === "Keyifciyiz_Fm") return;
            const item = document.createElement('div'); item.className = 'user-item';
            const n = document.createElement('span');
            n.style.color = u.color; n.style.fontWeight = "bold"; n.innerText = u.nick; n.style.cursor = "pointer";
            
            if(myRole === 'Yönetici') {
                if(privateTarget && privateTarget.id === u.id) n.classList.add('selected-nick');
                n.onclick = () => {
                    privateTarget = (privateTarget?.id === u.id) ? null : { id: u.id, nick: u.nick };
                    document.querySelectorAll('.user-item span').forEach(s => s.classList.remove('selected-nick'));
                    if(privateTarget) n.classList.add('selected-nick');
                };
            }
            item.appendChild(n); uDiv.appendChild(item);
        });
    });

    // Helpers
    function handleColorChange(c) { selectedColor = c; socket.emit('update color', c); }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function sendMessage(e) {
        e.preventDefault();
        const i = document.getElementById('input');
        if(i.value) {
            socket.emit('chat message', { text: i.value, color: selectedColor, style: styles, targetId: privateTarget?.id, targetNick: privateTarget?.nick });
            i.value = '';
        }
    }

    // Emoji panel (Basit)
    function toggleEmojiPanel(e) { 
        const p = document.getElementById('emoji-panel'); 
        p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; 
    }
</script>
</body>
</html>
