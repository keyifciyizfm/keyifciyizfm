<div id="chat-container">
    <div id="radio-panel">
        <div class="player-wrapper">
            <iframe id="radio-frame" src="https://yazgulumfm.ismyradio.com/player" scrolling="no"></iframe>
        </div>
        <div class="player-text">🎧 Yayındayız... Keyifli Dinlemeler!</div>
    </div>

    <div id="top-gradient"></div>
    
    <div id="action-bar">
        <div class="tool-group"><button class="f-btn" onclick="toggleEmojiPanel(event)">😊</button></div>
        <div class="tool-group"><button class="f-btn" onclick="changeFontSize(2)">A+</button></div>
        <div class="tool-group">
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')">B</button>
            <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')">I</button>
        </div>
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <form id="form" onsubmit="sendMessage(event)" style="display:flex; padding:12px; background:#2a2a2a; gap:10px; border-bottom:2px solid #111;">
        <input id="input" autocomplete="off" placeholder="Mesajınızı buraya yazın..." style="flex:1; background:#000; color:#fff; border:1px solid #444; padding:12px; border-radius:4px;" />
        <button type="submit" class="f-btn" style="background:#e81e4d; border:none; padding:0 25px; font-weight:bold;">GÖNDER</button>
    </form>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list">
            </div>
    </div>
</div>
