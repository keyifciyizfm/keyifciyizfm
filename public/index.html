<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 5px; width: 320px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; }
        #mixer-panel { background: #2a2a2a; border-top: 2px solid #f1c40f; padding: 10px; display: none; }
        .live-tag { color: #ff4757; font-weight: bold; margin-right: 10px; animation: blink 1s infinite; display: none; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nick..." style="width:100%; padding:10px; margin-bottom:10px; background:#222; color:#fff; border:1px solid #444;">
        <input type="password" id="pass-input" placeholder="Şifre (DJ ise)" style="width:100%; padding:10px; margin-bottom:10px; background:#222; color:#fff; border:1px solid #444;">
        <button class="f-btn" style="width:100%; padding:10px;" onclick="joinChat()">BAĞLAN</button>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <span id="live-indicator" class="live-tag">● CANLI</span>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <div id="mixer-panel">
        <input type="file" id="music-file" accept="audio/*" style="color:white; font-size:11px;">
        <button class="f-btn" onclick="startBroadcasting()" style="background:#ff4757;">YAYINI BAŞLAT</button>
        <audio id="local-audio" loop></audio>
    </div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", audioCtx, listenerCtx, nextStartTime = 0;

    function joinChat() {
        const n = document.getElementById('nick-input').value;
        const p = document.getElementById('pass-input').value;
        if(n) socket.emit('join', { nick: n, password: p });
    }

    socket.on('login success', d => {
        myNick = d.nick; myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') document.getElementById('mixer-panel').style.display = 'block';
    });

    function sendMessage(e) {
        e.preventDefault();
        const i = document.getElementById('input');
        if(i.value) { socket.emit('chat message', { text: i.value }); i.value = ''; }
    }

    socket.on('chat message', d => {
        const div = document.createElement('div');
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span>${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const i = document.createElement('div'); i.style.color = u.color;
            i.innerText = u.nick + (u.role === 'Yönetici' ? " (DJ 🎧)" : "");
            uDiv.appendChild(i);
        });
    });

    // --- SES İŞLEMLERİ ---
    function startBroadcasting() {
        const file = document.getElementById('music-file').files[0];
        if(!file) return alert("Müzik seçin!");
        
        audioCtx = new AudioContext();
        const player = document.getElementById('local-audio');
        player.src = URL.createObjectURL(file);
        player.play();

        const source = audioCtx.createMediaElementSource(player);
        const processor = audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(processor);
        source.connect(audioCtx.destination);
        processor.connect(audioCtx.destination);

        processor.onaudioprocess = (e) => {
            const data = e.inputBuffer.getChannelData(0);
            socket.emit('audio-stream', new Float32Array(data));
        };
    }

    socket.on('audio-data', (data) => {
        if(myRole === 'Yönetici') return;
        document.getElementById('live-indicator').style.display = 'inline';
        if(!listenerCtx) listenerCtx = new AudioContext();
        
        const buffer = listenerCtx.createBuffer(1, data.length, listenerCtx.sampleRate);
        buffer.getChannelData(0).set(new Float32Array(data));
        const src = listenerCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(listenerCtx.destination);
        
        if(nextStartTime < listenerCtx.currentTime) nextStartTime = listenerCtx.currentTime;
        src.start(nextStartTime);
        nextStartTime += buffer.duration;
    });

    window.onclick = () => { if(listenerCtx) listenerCtx.resume(); };
</script>
</body>
</html>
