<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Flatcast Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Nick Giriş Ekranı */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; }
        #login-box { background: #333; padding: 20px; border: 2px solid #00ff00; text-align: center; border-radius: 10px; }
        
        #chat-container { width: 950px; height: 600px; background: #333; border: 2px solid #444; display: flex; flex-direction: column; }
        #top-gradient { height: 12px; width: 100%; background: linear-gradient(to right, #00ff00, #ffff00, #ff0000); }
        
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 5px; gap: 5px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 10px; overflow-y: auto; font-size: 13px; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 10px; font-size: 12px; overflow-y: auto; }
        
        .msg-line { margin-bottom: 5px; border-bottom: 1px solid #111; }
        .nick { color: #00ff00; font-weight: bold; }
        .sys-msg { color: #888; font-style: italic; font-size: 11px; }
        .user-item { color: #5bc0de; padding: 2px 0; border-bottom: 1px solid #222; }

        input { background: #000; border: 1px solid #555; color: #fff; padding: 8px; }
        button { background: linear-gradient(to bottom, #666, #333); color: #fff; padding: 5px 15px; cursor: pointer; border: 1px solid #000; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3>Hoşgeldiniz</h3><br>
        <input type="text" id="nick-input" placeholder="Nickinizi yazın..." maxlength="15"><br><br>
        <button onclick="joinChat()">Sohbete Başla</button>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list">
            <b style="color:#f0ad4e">Online Dinleyiciler</b><hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <div id="users"></div>
        </div>
    </div>
    <form id="form" style="display:flex; padding:10px; background:#333;">
        <input id="input" style="flex:1" autocomplete="off" placeholder="Mesaj gönder..." />
        <button type="submit">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    
    function joinChat() {
        var nick = document.getElementById('nick-input').value;
        if(nick.trim() != "") {
            socket.emit('join', nick);
            document.getElementById('login-overlay').style.display = 'none';
        }
    }

    document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        var input = document.getElementById('input');
        if (input.value) {
            socket.emit('chat message', input.value);
            input.value = '';
        }
    });

    socket.on('chat message', function(data) {
        var div = document.createElement('div');
        div.className = 'msg-line';
        if(data.system) {
            div.innerHTML = `<span class="sys-msg">${data.text}</span>`;
        } else {
            div.innerHTML = `<span class="nick">${data.user}:</span> ${data.text}`;
        }
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', function(userNames) {
        var userDiv = document.getElementById('users');
        userDiv.innerHTML = '';
        userNames.forEach(function(u) {
            var item = document.createElement('div');
            item.className = 'user-item';
            item.innerHTML = '• ' + u;
            userDiv.appendChild(item);
        });
    });
</script>
</body>
</html>
