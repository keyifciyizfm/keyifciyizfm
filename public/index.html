<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Canlı Sohbet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* GİRİŞ EKRANI */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 8px; width: 320px; box-shadow: 0 0 20px #000; }
        #nick-input, #pass-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; outline: none; }
        
        /* ANA PANEL */
        #chat-container { 
            width: 950px; height: 620px; 
            background: #3b3b3b; border: 2px solid #444; 
            display: flex; flex-direction: column; 
            position: relative; /* Loader bunun içine hapsolacak */
            overflow: hidden;
        }

        /* MAVİ LOADER - SADECE SOHBET BOYUTUNDA */
        #flatcast-loader {
            position: absolute; /* Parent olan #chat-container'ı baz alır */
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #005a9c 0%, #002a4d 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10000; font-family: 'Arial Black', sans-serif;
        }
        .welcome-text { color: #fff; font-size: 26px; margin-bottom: 35px; text-shadow: 0 0 10px #fff; letter-spacing: 2px; }
        .f5-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
        .f5-big { font-size: 130px; color: #f1c40f; font-style: italic; text-shadow: 5px 5px 0px #947600; margin: 0; user-select: none; }
        .ball { 
            width: 32px; height: 32px; background: radial-gradient(circle at 10px 10px, #00f2ff, #005a9c); 
            border-radius: 50%; position: absolute; box-shadow: 0 0 15px #00f2ff;
            animation: rollBall 2.2s ease-in-out infinite; 
        }
        @keyframes rollBall {
            0% { transform: translateX(-110px) rotate(0deg); }
            50% { transform: translateX(110px) rotate(360deg); }
            100% { transform: translateX(-110px) rotate(720deg); }
        }
        .loading-info { color: #88cfff; margin-top: 25px; font-size: 13px; font-family: 'Courier New', monospace; }

        /* ARAYÜZ STİLLERİ */
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; z-index: 500; }
        .tool-group { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-right: 1px solid #555; height: 25px; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 5px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; font-weight: bold; }
        .f-btn.active { background: #2ecc71 !important; color: #000; }

        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; position: relative; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 15px; overflow-y: auto; font-size: 13px; color: #fff; background-size: cover; background-position: center; }
        #user-list { width: 220px; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        #fixed-admin { padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; margin-bottom: 15px; text-align: center; }
        
        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 12px; background: #2a2a2a; border: 2px solid #555; padding: 10px; flex-wrap: wrap; gap: 10px; width: 280px; z-index: 2000; border-radius: 5px; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
        #ban-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: #ff4757; }
        
        .status-box { width: 18px; height: 18px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 2px; margin-right: 8px;}
        .status-0 { background: #222; } .status-1 { background: #3498db; } .status-2 { background: #e74c3c; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nickiniz..." onkeyup="checkAdmin(this.value)">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..."></div>
        <button class="f-btn" onclick="joinChat()" style="padding:10px 40px; width:100%;">BAĞLAN</button>
        <p id="error-msg" style="color:#ff4757; font-size:12px; margin-top:10px; display:none;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="flatcast-loader">
        <h2 class="welcome-text">RADYOMUZA HOŞGELDİNİZ</h2>
        <div class="f5-wrapper">
            <h1 class="f5-big">F5</h1>
            <div class="ball"></div>
        </div>
        <p class="loading-info">Flatcast Reloaded F5.3 Yükleniyor...</p>
    </div>

    <div id="top-gradient"></div>
    <div id="action-bar">
        <div class="tool-group"><button class="f-btn" onclick="toggleEmojiPanel(event)">😊 Emojiler</button></div>
        <div class="tool-group">
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')">B</button>
            <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')">I</button>
        </div>
        <div class="tool-group"><input type="color" id="colorPicker" value="#2ecc71" onchange="handleColorChange(this.value)" style="width:25px; height:20px; border:none; cursor:pointer;"></div>
        <div class="tool-group" id="admin-tools" style="display:none;">
            <button class="f-btn" style="color:#f1c40f;" onclick="clearChat()">🧹 Temizle</button>
            <button class="f-btn" style="color:#3498db;" onclick="document.getElementById('bg-upload').click()">🖼️ Yazdır</button>
            <input type="file" id="bg-upload" style="display:none;" onchange="uploadBg(this)">
        </div>
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="ban-overlay"><h1>🚫</h1><h3>Yayın Sona Erdi!</h3></div>
        <div id="messages"></div>
        <div id="user-list">
            <div id="fixed-admin">
                <div style="font-size:9px; color:#666; margin-bottom:4px;">ŞU AN YAYINDA</div>
                <div id="admin-display-name" style="font-weight:bold; font-size:15px;">Keyifciyiz_Fm</div>
            </div>
            <b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:8px 0; border:#333 1px solid;">
            <div id="users"></div>
        </div>
    </div>

    <div id="emoji-panel"></div>
    <form id="form" onsubmit="sendMessage(event)" style="display:flex; padding:10px; background:#3b3b3b; gap:5px;">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", selectedColor = "#2ecc71";
    var styles = { bold: false, italic: false };

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }

    function joinChat() {
        const n = document.getElementById('nick-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(!n) return;

        // Loader'ı container içinde başlat
        document.getElementById('flatcast-loader').style.display = 'flex';

        setTimeout(() => {
            socket.emit('join', { nick: n, password: p });
        }, 10000);
    }

    socket.on('auth error', m => { 
        document.getElementById('flatcast-loader').style.display = 'none';
        alert(m);
    });

    socket.on('login success', d => { 
        myNick = d.nick; myRole = d.role; 
        const loader = document.getElementById('flatcast-loader');
        loader.style.transition = "opacity 1s ease";
        loader.style.opacity = "0";
        setTimeout(() => { 
            loader.style.display = "none"; 
            document.getElementById('login-overlay').style.display = 'none'; 
        }, 1000);
        if(myRole === 'Yönetici') {
            document.getElementById('admin-tools').style.display = 'flex';
            selectedColor = "#ff4757";
        }
    });

    socket.on('chat message', d => {
        const div = document.createElement('div');
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span style="color:${d.color}">${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', data => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        data.list.forEach(u => {
            if(u.nick === "Keyifciyiz_Fm") return;
            const item = document.createElement('div');
            item.innerHTML = `<div class="status-box status-${u.status || 0}"></div><span style="color:${u.color}; font-weight:bold;">${u.nick}</span>`;
            item.style.display = "flex"; item.style.alignItems = "center"; item.style.marginBottom = "5px";
            uDiv.appendChild(item);
        });
    });

    socket.on('background changed', url => { document.getElementById('messages').style.backgroundImage = `url('${url}')`; });
    socket.on('chat cleared', () => { document.getElementById('messages').innerHTML = ''; });
    socket.on('force logout', () => { document.getElementById('ban-overlay').style.display = 'flex'; setTimeout(() => location.reload(), 2000); });

    function handleColorChange(c) { selectedColor = c; socket.emit('update color', c); }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function clearChat() { socket.emit('clear chat'); }
    function uploadBg(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = (e) => socket.emit('change background', e.target.result); reader.readAsDataURL(input.files[0]); } }
    function sendMessage(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value, color: selectedColor, style: styles }); i.value = ''; } }
</script>
</body>
</html>
