<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet & Radyo - Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Ana Panel */
        #chat-container { width: 980px; height: 650px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 30px #000; }
        #top-gradient { height: 12px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        
        /* Üst Araç Çubuğu */
        #action-bar { background: #4a4a4a; padding: 12px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; justify-content: center; min-width: 35px; }
        .f-btn:hover { background: #555; }
        .f-btn.active { background: #2ecc71; color: #000; font-weight: bold; }

        /* Mesaj ve Liste Alanı */
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 10px; gap: 10px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 15px; overflow-y: auto; border-radius: 2px; font-size: 14px; color: #fff; }
        
        #right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        #user-list { flex: 2; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { padding: 8px 0; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .user-item:hover { padding-left: 5px; background: #1a1a1a; }

        /* SADECE DJ GÖRECEK: Mikser */
        #mixer-area { display: none; background: #111; border: 1px solid #444; padding: 15px; flex-direction: column; gap: 12px; border-radius: 2px; }
        .mixer-channel { background: #1d1d1d; border: 1px solid #333; padding: 10px; border-radius: 4px; }
        .mixer-header { display: flex; justify-content: space-between; color: #f1c40f; font-weight: bold; font-size: 10px; margin-bottom: 8px; }
        .mixer-slider { -webkit-appearance: none; width: 100%; height: 4px; background: #444; outline: none; }
        .mixer-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #2ecc71; border-radius: 50%; cursor: pointer; }

        /* Emoji ve Sağ Tık Menü */
        #emoji-panel { display: none; position: absolute; bottom: 70px; left: 15px; background: #333; border: 2px solid #555; padding: 15px; flex-wrap: wrap; gap: 10px; width: 300px; border-radius: 8px; z-index: 100; }
        .emoji-item { cursor: pointer; transition: 0.2s; }
        .emoji-item:hover { transform: scale(1.3); }
        .emoji-item img { width: 28px; height: 28px; }

        #custom-menu { display: none; position: absolute; background: #2a2a2a; border: 1px solid #f1c40f88; z-index: 2000; width: 170px; box-shadow: 5px 5px 20px #000; }
        .menu-item { padding: 12px 15px; cursor: pointer; color: #ddd; font-size: 12px; border-bottom: 1px solid #333; }
        .menu-item:hover { background: #3d3d3d; color: #fff; }

        /* Alt Yazım Alanı */
        form#form { display: flex; padding: 15px; background: #3b3b3b; gap: 10px; border-top: 1px solid #444; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 12px; outline: none; border-radius: 3px; font-size: 14px; }

        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 5000; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="background: #333; padding: 40px; border: 2px solid #555; text-align: center; border-radius: 8px; width: 350px;">
        <h2 style="color:#2ecc71; margin-bottom:20px;">KEYİFCİYİZ FM</h2>
        <input type="text" id="nick-input" placeholder="Nickiniz..." oninput="checkAdmin(this.value)" style="padding:12px; margin-bottom:15px; display:block; width:100%; background:#111; color:#fff; border:1px solid #444; border-radius:4px;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Yönetici Şifresi..." style="padding:12px; margin-bottom:15px; display:block; width:100%; background:#111; color:#fff; border:1px solid #444; border-radius:4px;"></div>
        <button class="f-btn" style="width:100%; padding:12px;" onclick="joinChat()">GİRİŞ YAP</button>
        <p id="error-msg" style="color:#e74c3c; font-size:12px; margin-top:15px;"></p>
    </div>
</div>

<div id="custom-menu">
    <div class="menu-item" onclick="muteAction()">🔇 Sustur/Aç</div>
    <div class="menu-item" onclick="kickAction()" style="color:#ff4757;">🚫 Odadan At</div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmojiPanel(event)">😊 Emojiler</button>
        
        <div style="margin-left: 20px; border-left: 1px solid #555; padding-left: 15px; display: flex; align-items: center; gap: 8px;">
            <button class="f-btn" onclick="changeFontSize(2)">A+</button>
            <button class="f-btn" onclick="changeFontSize(-2)" style="margin-right: 15px;">A-</button>
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>A</b></button>
            <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')"><i>I</i></button>
            <button id="btn-underline" class="f-btn" onclick="toggleStyle('underline')"><u>U</u></button>
        </div>

        <input type="color" id="colorPicker" value="#2ecc71" onchange="changeColor(this.value)" style="margin-left:20px; width:40px; height:25px; cursor:pointer; background:none; border:none;">
        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()" style="background: #e74c3c;">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        
        <div id="right-panel">
            <div id="user-list">
                <b style="color:#f1c40f">DİNLEYİCİLER</b>
                <hr style="margin:10px 0; border:#333 1px solid;">
                <div id="users"></div>
            </div>

            <div id="mixer-area">
                <b style="color:#f1c40f">YAYIN MERKEZİ</b>
                <button id="stream-btn" class="f-btn" style="background: #e74c3c; margin-bottom: 5px; width: 100%;" onclick="startBroadcasting()">🎤 YAYINI BAŞLAT</button>
                <div class="mixer-channel">
                    <div class="mixer-header"><span>📻 MASTER SES</span> <small id="v1">%80</small></div>
                    <input type="range" class="mixer-slider" min="0" max="100" value="80" oninput="updateVol('master', this.value, 'v1')">
                </div>
            </div>
        </div>
    </div>

    <div id="emoji-panel"></div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesajınızı buraya yazın..." />
        <button type="submit" class="f-btn" style="background: #2ecc71; color: #000; font-weight: bold; width: 100px;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", selectedTarget = "", currentFontSize = 14, selectedColor = "#2ecc71", styles = { bold: false, italic: false, underline: false };

    // Emojileri Hazırla
    const emojis = [
        {c: ':smile:', i: '1f60a'}, {c: ':joy:', i: '1f602'}, {c: ':cool:', i: '1f60e'}, {c: ':heart:', i: '2764'},
        {c: ':fire:', i: '1f525'}, {c: ':rose:', i: '1f339'}, {c: ':thumbsup:', i: '1f44d'}, {c: ':microphone:', i: '1f399'},
        {c: ':wink:', i: '1f609'}, {c: ':star:', i: '2b50'}, {c: ':coffee:', i: '2615'}, {c: ':musical_note:', i: '1f3b5'}
    ];
    const ePanel = document.getElementById('emoji-panel');
    emojis.forEach(e => {
        let d = document.createElement('div'); d.className = 'emoji-item';
        d.innerHTML = `<img src="https://raw.githubusercontent.com/jakejarvis/apple-emoji-svg/main/emoji/${e.i}.svg">`;
        d.onclick = () => { document.getElementById('input').value += e.c + ' '; document.getElementById('input').focus(); };
        ePanel.appendChild(d);
    });

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() { const n = document.getElementById('nick-input').value, p = document.getElementById('pass-input').value; if(n) socket.emit('join', { nick: n, password: p }); }
    
    socket.on('login success', d => { 
        myNick = d.nick; myRole = d.role; 
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') document.getElementById('mixer-area').style.display = 'flex';
    });

    socket.on('chat message', d => {
        const div = document.createElement('div'); div.style.marginBottom = "10px"; const s = d.style || {};
        div.innerHTML = `<b style="color:${d.color}; cursor:pointer;" onclick="openAdminMenu('${d.user}', event)">${d.user}:</b> 
            <span style="color:${d.color}; font-weight:${s.bold?'bold':'normal'}; font-style:${s.italic?'italic':'normal'}; text-decoration:${s.underline?'underline':'none'};">${d.text}</span>`;
        document.getElementById('messages').appendChild(div); document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const i = document.createElement('div'); i.className = 'user-item'; i.style.color = u.color;
            let tag = (u.nick === "Keyifciyiz_Fm") ? " (Dj)" : (u.role === "Yönetici" ? " (Sahibi)" : "");
            i.innerText = u.nick + tag; i.onclick = (e) => { e.stopPropagation(); openAdminMenu(u.nick, e); };
            uDiv.appendChild(i);
        });
    });

    // SES YAYIN MANTIĞI
    let mediaRecorder;
    async function startBroadcasting() {
        const btn = document.getElementById('stream-btn');
        if (btn.innerText.includes("BAŞLAT")) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) socket.emit('voice-data', e.data); };
                mediaRecorder.start(200);
                btn.innerText = "🛑 YAYINI DURDUR"; btn.style.background = "#222";
            } catch (err) { alert("Mikrofon hatası: " + err); }
        } else {
            mediaRecorder.stop(); btn.innerText = "🎤 YAYINI BAŞLAT"; btn.style.background = "#e74c3c";
        }
    }

    socket.on('audio-stream', (data) => {
        const blob = new Blob([data], { type: 'audio/webm' });
        const audio = new Audio(window.URL.createObjectURL(blob));
        audio.play();
    });

    // ARAÇLAR VE MENÜLER
    function updateVol(t, v, l) { document.getElementById(l).innerText = "%" + v; }
    function openAdminMenu(t, e) { if (myRole !== 'Yönetici' || t === myNick) return; selectedTarget = t; const m = document.getElementById('custom-menu'); m.style.display = 'block'; m.style.left = e.pageX + "px"; m.style.top = e.pageY + "px"; e.stopPropagation(); }
    document.addEventListener('click', () => { document.getElementById('custom-menu').style.display = 'none'; document.getElementById('emoji-panel').style.display = 'none'; });
    function toggleEmojiPanel(e) { e.stopPropagation(); const p = document.getElementById('emoji-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
    function changeFontSize(n) { currentFontSize += n; document.getElementById('messages').style.fontSize = currentFontSize + "px"; }
    function toggleStyle(t) { styles[t] = !styles[t]; document.getElementById('btn-'+t).classList.toggle('active'); }
    function changeColor(c) { selectedColor = c; document.getElementById('input').style.color = c; }
    function sendMessage(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value, color: selectedColor, style: styles }); i.value = ''; } }
    function kickAction() { socket.emit('admin command', {action: 'kick', targetNick: selectedTarget}); }
    function muteAction() { alert(selectedTarget + " susturuldu."); }
    socket.on('force logout', m => { alert(m); location.reload(); });
</script>
</body>
</html>
