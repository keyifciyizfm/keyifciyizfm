<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet - Flatcast Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ccc; }
        
        #chat-container { width: 900px; height: 550px; background: #333; border: 2px solid #444; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        /* Nostaljik Üst Bar */
        #top-gradient { height: 12px; width: 100%; background: linear-gradient(to right, #00ff00 0%, #00ff00 40%, #ffff00 70%, #ff0000 100%); border-bottom: 1px solid #000; }
        
        /* Action Bar (Butonlar) */
        #action-bar { background: #444; padding: 5px; display: flex; gap: 5px; border-bottom: 1px solid #222; align-items: center; }
        button { background: linear-gradient(to bottom, #666, #333); border: 1px solid #000; color: #fff; padding: 3px 12px; font-size: 11px; cursor: pointer; border-radius: 2px; }
        button:hover { background: #555; }
        .btn-blue { color: #5bc0de; }
        .btn-yellow { color: #f0ad4e; }

        /* Ana Alan */
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 5px; gap: 5px; }
        
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 10px; overflow-y: auto; font-size: 13px; line-height: 1.5; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 10px; font-size: 12px; color: #888; }
        
        /* Mesaj Yazma Alanı */
        #input-area { background: #333; padding: 10px; display: flex; gap: 5px; border-top: 1px solid #444; }
        input { flex: 1; background: #000; border: 1px solid #555; color: #fff; padding: 8px; outline: none; }
        input:focus { border-color: #00ff00; }

        /* Mesaj Stilleri */
        .msg-line { margin-bottom: 4px; border-bottom: 1px solid #111; padding-bottom: 2px; }
        .nick { color: #00ff00; font-weight: bold; margin-right: 5px; }
        .time { color: #555; font-size: 10px; margin-left: 10px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="top-gradient"></div>
    
    <div id="action-bar">
        <button>💬 Chat</button>
        <button>🔍 Zoom+</button>
        <button>🔍 Zoom-</button>
        <div style="flex:1"></div>
        <button class="btn-yellow">🎨 Color</button>
        <button>🔊 Sound</button>
        <button class="btn-blue">➡ Login</button>
    </div>

    <div id="main-area">
        <div id="messages" id="message-box"></div>
        <div id="user-list">
            <b style="color:#aaa">Kullanıcılar</b><br><br>
            <div id="online-users">• Misafir (Sen)</div>
        </div>
    </div>

    <form id="form" id="input-area" style="display:flex; padding:10px; background:#333;">
        <input id="input" autocomplete="off" placeholder="Mesajınızı buraya yazın..." />
        <button type="submit" style="padding: 0 20px;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var form = document.getElementById('form');
    var input = document.getElementById('input');
    var msgBox = document.getElementById('messages');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (input.value) {
            socket.emit('chat message', input.value);
            input.value = '';
        }
    });

    socket.on('chat message', function(data) {
        var div = document.createElement('div');
        div.className = 'msg-line';
        var now = new Date();
        var timeStr = now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes();
        
        div.innerHTML = `<span class="nick">${data.user}:</span> <span>${data.text}</span> <span class="time">(${timeStr})</span>`;
        msgBox.appendChild(div);
        msgBox.scrollTop = msgBox.scrollHeight;
    });
</script>
</body>
</html>
