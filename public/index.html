<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #login-overlay { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        #login-box { background: #1e1e1e; padding: 40px; border-radius: 12px; border: 1px solid #333; text-align: center; width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-input { width: 100%; padding: 12px; margin: 15px 0; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 6px; outline: none; }
        
        #chat-container { width: 1000px; height: 700px; background: #1e1e1e; border: 1px solid #333; display: flex; flex-direction: column; position: relative; border-radius: 8px; box-shadow: 0 15px 50px rgba(0,0,0,0.8); }
        #chat-container.fullscreen { width: 100vw !important; height: 100vh !important; border-radius: 0; }

        #action-bar { background: #252525; padding: 12px 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; }
        .f-btn { background: #333; color: #fff; border: 1px solid #444; padding: 8px 15px; cursor: pointer; font-size: 13px; border-radius: 4px; transition: 0.2s; }
        .f-btn:hover { background: #444; }
        .f-btn.active { background: #2ecc71; color: #000; border-color: #27ae60; }
        .f-select { background: #333; color: #fff; border: 1px solid #444; padding: 7px; border-radius: 4px; font-size: 13px; }

        .win-controls { display: flex; gap: 8px; margin-left: auto; }
        .win-btn { width: 28px; height: 28px; background: #333; border: 1px solid #444; color: #fff; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

        #main-area { display: flex; flex: 1; overflow: hidden; padding: 15px; gap: 15px; }
        #messages { flex: 3; background: #121212; padding: 20px; overflow-y: auto; font-size: 15px; border-radius: 8px; border: 1px solid #222; }
        #user-sidebar { flex: 1; background: #181818; padding: 15px; border: 1px solid #222; border-radius: 8px; overflow-y: auto; }
        
        .user-item { padding: 8px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 14px; display: flex; align-items: center; }
        .user-item:hover { background: #252525; }

        #emoji-panel { display: none; position: absolute; bottom: 85px; left: 20px; background: #252525; border: 1px solid #444; padding: 15px; width: 280px; flex-wrap: wrap; gap: 10px; z-index: 500; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .emoji { font-size: 24px; cursor: pointer; transition: transform 0.1s; }
        .emoji:hover { transform: scale(1.2); }

        form { display: flex; padding: 20px; background: #1e1e1e; gap: 15px; border-top: 1px solid #333; }
        #input { flex: 1; background: #121212; color: #fff; border: 1px solid #333; padding: 15px; outline: none; border-radius: 6px; font-size: 15px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="color:#2ecc71; margin-bottom:10px;">Hoş Geldiniz</h2>
        <input id="nick-in" class="auth-input" placeholder="Nickinizi girin" oninput="checkAdm(this.value)">
        <div id="adm-p" style="display:none"><input id="pass-in" type="password" class="auth-input" placeholder="Yönetici Şifresi"></div>
        <button class="f-btn" style="width:100%; height:45px; background:#2ecc71; color:#000; font-weight:bold;" onclick="join()">BAĞLAN</button>
        <p id="err" style="color:#e74c3c; font-size:12px; margin-top:15px;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmo()">😊 Emojiler</button>
        <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>B</b></button>
        <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')"><i>I</i></button>
        <button id="btn-underline" class="f-btn" onclick="toggleStyle('underline')"><u>U</u></button>
        <select id="f-size" class="f-select" onchange="updateStyle()">
            <option value="13px">Küçük</option>
            <option value="15px" selected>Normal</option>
            <option value="18px">Büyük</option>
        </select>
        <input type="color" id="cp" value="#2ecc71" style="width:35px; height:35px; border:none; background:none; cursor:pointer;">
        
        <div class="win-controls">
            <button class="win-btn" onclick="toggleSize('full')">□</button>
            <button class="win-btn" style="background:#e74c3c" onclick="location.reload()">X</button>
        </div>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-sidebar">
            <h4 style="color:#2ecc71; font-size:12px; margin-bottom:15px; letter-spacing:1px;">AKTİF KULLANICILAR</h4>
            <div id="ulist"></div>
        </div>
    </div>

    <div id="emoji-panel">
        <span class="emoji" onclick="addEmo('😊')">😊</span><span class="emoji" onclick="addEmo('😂')">😂</span>
        <span class="emoji" onclick="addEmo('😍')">😍</span><span class="emoji" onclick="addEmo('🔥')">🔥</span>
        <span class="emoji" onclick="addEmo('🌹')">🌹</span><span class="emoji" onclick="addEmo('🎵')">🎵</span>
        <span class="emoji" onclick="addEmo('🎙️')">🎙️</span><span class="emoji" onclick="addEmo('👏')">👏</span>
    </div>

    <form onsubmit="send(event)">
        <input id="input" autocomplete="off" placeholder="Mesajınızı yazın...">
        <button class="f-btn" style="width:120px; background:#2ecc71; color:#000; font-weight:bold;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myRole = "", myNick = "";
    var styles = { bold: false, italic: false, underline: false, size: '15px' };

    function checkAdm(v) { document.getElementById('adm-p').style.display = (v === "Halil") ? "block" : "none"; }
    function join() {
        var n = document.getElementById('nick-in').value.trim();
        var p = document.getElementById('pass-in').value.trim();
        if(n) socket.emit('join', { nick: n, password: p });
    }
    
    function toggleSize(t) { document.getElementById('chat-container').classList.toggle('fullscreen'); }

    socket.on('auth error', (m) => document.getElementById('err').innerText = m);
    socket.on('login success', (d) => { myRole = d.role; myNick = d.nick; document.getElementById('login-overlay').style.display = 'none'; });

    function toggleEmo() { var p = document.getElementById('emoji-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }
    function addEmo(e) { document.getElementById('input').value += e; document.getElementById('input').focus(); }
    
    function toggleStyle(s) { styles[s] = !styles[s]; document.getElementById('btn-' + s).classList.toggle('active'); }
    function updateStyle() { styles.size = document.getElementById('f-size').value; }

    function send(e) {
        e.preventDefault();
        var i = document.getElementById('input');
        if(!i.value.trim()) return;
        updateStyle();
        socket.emit('chat message', { text: i.value, color: document.getElementById('cp').value, style: styles });
        i.value = ''; document.getElementById('emoji-panel').style.display = 'none';
    }

    socket.on('chat message', (d) => {
        var div = document.createElement('div');
        div.style.marginBottom = "12px";
        if(d.system) div.innerHTML = `<small style="color:#555"><i>${d.text}</i></small>`;
        else {
            var s = d.style || {};
            var styleStr = `color:${d.color}; font-size:${s.size || '15px'}; ${s.bold?'font-weight:bold;':''} ${s.italic?'font-style:italic;':''} ${s.underline?'text-decoration:underline;':''}`;
            var b = "";
            if(d.role === 'Yönetici') b = `<span style="background:#ff4757; color:#fff; font-size:10px; padding:2px 5px; border-radius:3px; margin-right:8px; font-weight:bold;">SAHİBİ</span>`;
            else if(d.role === 'Admin') b = `<span style="background:#e67e22; color:#fff; font-size:10px; padding:2px 5px; border-radius:3px; margin-right:8px; font-weight:bold;">ADM</span>`;
            else if(d.role === 'DJ') b = `<span style="background:#f1c40f; color:#000; font-size:10px; padding:2px 5px; border-radius:3px; margin-right:8px; font-weight:bold;">DJ</span>`;
            
            div.innerHTML = `${b}<b style="color:${d.color}; cursor:pointer" onclick="admMenu('${d.user}', '${d.role}')">${d.user}:</b> <span style="${styleStr}">${d.text}</span>`;
        }
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', (l) => {
        var c = document.getElementById('ulist'); c.innerHTML = '';
        l.forEach(u => {
            var d = document.createElement('div'); 
            d.className = 'user-item';
            d.style.color = u.color;
            d.onclick = () => admMenu(u.nick, u.role);
            var icon = (u.role==='Yönetici'?'👑 ':(u.role==='Admin'?'🛡️ ':'👤 '));
            d.innerHTML = `<span>${icon} ${u.nick}</span>`;
            c.appendChild(d);
        });
    });

    function admMenu(tN, tR) {
        if ((myRole !== 'Yönetici' && myRole !== 'Admin') || tN === myNick) return;
        var m = tN + " için işlem:\n1:At, 2:Ban, 3:DJ Yap";
        if (myRole === 'Yönetici') m += ", 4:Admin Yap";
        var c = prompt(m);
        if (choice(c, "1")) socket.emit('admin command', {action: 'kick', targetNick: tN});
        if (choice(c, "2")) socket.emit('admin command', {action: 'ban', targetNick: tN});
        if (choice(c, "3")) socket.emit('admin command', {action: 'make_dj', targetNick: tN});
        if (choice(c, "4") && myRole === 'Yönetici') socket.emit('admin command', {action: 'make_admin', targetNick: tN});
    }
    function choice(val, target) { return val === target; }

    socket.on('force logout', (m) => { alert(m); location.reload(); });
</script>
</body>
</html>
