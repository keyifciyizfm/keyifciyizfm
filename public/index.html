<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Flatcast Style Pro</title>
    <style>
        /* Önceki stiller aynen kalacak... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; font-size: 13px; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; }
        .user-item { padding: 5px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .user-item:hover { background: #333; }
        
        /* YETKİ MENÜSÜ STİLİ */
        #admin-menu { 
            display: none; position: absolute; background: #333; border: 2px solid #f1c40f; 
            padding: 5px; z-index: 5000; box-shadow: 0 5px 15px #000; width: 120px;
        }
        .menu-item { 
            padding: 8px; color: white; font-size: 11px; cursor: pointer; border-bottom: 1px solid #444;
        }
        .menu-item:hover { background: #f1c40f; color: black; }
        
        /* Diğer butonlar ve Mixer... (Önceki koddan aynen al) */
        #login-overlay { position: fixed; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; z-index:2000; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border: 1px solid #111; }
        #dj-mixer { display: none; position: absolute; top: 50px; right: 50px; width: 280px; background: #2c3e50; border: 2px solid #f1c40f; z-index: 3000; }
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; }
        #input { flex: 1; background: #000; color: #fff; padding: 10px; border: 1px solid #555; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <input type="text" id="nick-input" placeholder="Nick..." oninput="checkAdmin(this.value)" style="padding:10px; width:100%; margin-bottom:10px;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..." style="padding:10px; width:100%; margin-bottom:10px;"></div>
        <button class="f-btn" onclick="joinChat()">BAĞLAN</button>
    </div>
</div>

<div id="admin-menu">
    <div class="menu-item" onclick="execAction('reply')">💬 Cevapla</div>
    <div id="admin-tools" style="display:none;">
        <div class="menu-item" onclick="execAction('op')">💎 Yetki Ver</div>
        <div class="menu-item" onclick="execAction('mute')">🔇 Sustur</div>
        <div class="menu-item" onclick="execAction('kick')" style="color:#e74c3c;">🚫 At</div>
    </div>
</div>

<div id="chat-container">
    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b>Dinleyiciler</b><hr><div id="users"></div></div>
    </div>
    
    <div id="dj-mixer">
        <div style="background:#f1c40f; color:000; padding:5px; text-align:center; font-weight:bold;">🎧 DJ PANEL</div>
        <div style="padding:10px;">
            <button onclick="toggleBroadcast()" id="mic-btn" style="width:100%; background:#2980b9; color:white; border:none; padding:5px;">YAYINI BAŞLAT</button>
            <input type="file" id="music-input" accept="audio/*" style="width:100%; margin-top:5px;">
            <audio id="dj-player" controls style="width:100%; margin-top:5px;"></audio>
        </div>
    </div>

    <form id="form" onsubmit="sendM(event)">
        <input id="input" autocomplete="off" />
        <button class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myRole = 'Dinleyici';
    var selectedUserId = null;
    var selectedUserNick = null;

    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() { socket.emit('join', { nick: document.getElementById('nick-input').value, password: document.getElementById('pass-input').value }); }

    socket.on('login success', (data) => {
        document.getElementById('login-overlay').style.display = 'none';
        myRole = data.role;
        if(myRole === 'DJ') {
            document.getElementById('dj-mixer').style.display = 'block';
            document.getElementById('admin-tools').style.display = 'block';
        }
    });

    // KULLANICI LİSTESİ VE TIKLAMA
    socket.on('user list', (list) => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const item = document.createElement('div');
            item.className = 'user-item';
            item.style.color = u.color;
            item.innerHTML = `👤 ${u.nick} <small>(${u.role})</small>`;
            
            item.onclick = (e) => {
                selectedUserId = u.id;
                selectedUserNick = u.nick;
                const menu = document.getElementById('admin-menu');
                menu.style.display = 'block';
                menu.style.left = e.pageX + "px";
                menu.style.top = e.pageY + "px";
            };
            uDiv.appendChild(item);
        });
    });

    // MENÜ İŞLEMLERİ
    function execAction(action) {
        if(action === 'reply') {
            document.getElementById('input').value = `@${selectedUserNick} `;
            document.getElementById('input').focus();
        } else {
            socket.emit('admin-action', { action: action, targetId: selectedUserId });
        }
        document.getElementById('admin-menu').style.display = 'none';
    }

    // Menü dışına tıklandığında kapat
    window.onclick = (e) => { if(!e.target.classList.contains('user-item')) document.getElementById('admin-menu').style.display = 'none'; };

    // SES VE MESAJ KODLARI (Öncekiyle aynı)
    function sendM(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value }); i.value = ''; } }
    socket.on('chat message', (d) => {
        const div = document.createElement('div');
        div.innerHTML = d.system ? `<i>${d.text}</i>` : `<b style="color:${d.color}">${d.user}:</b> ${d.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    // DJ SES MOTORU (Kısa versiyon)
    var audioCtx = new AudioContext();
    var dest = audioCtx.createMediaStreamDestination();
    async function toggleBroadcast() {
        const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx.createMediaStreamSource(mic).connect(dest);
        const player = document.getElementById('dj-player');
        audioCtx.createMediaElementSource(player).connect(dest);
        audioCtx.createMediaElementSource(player).connect(audioCtx.destination);
        const recorder = new MediaRecorder(dest.stream);
        recorder.ondataavailable = (e) => socket.emit('audio-stream', e.data);
        recorder.start(250);
        document.getElementById('mic-btn').innerText = "YAYINDA";
    }
    socket.on('audio-receive', async (data) => {
        const buf = await data.arrayBuffer();
        audioCtx.decodeAudioData(buf, (b) => { const s = audioCtx.createBufferSource(); s.buffer = b; s.connect(audioCtx.destination); s.start(0); });
    });
    document.getElementById('music-input').onchange = (e) => { document.getElementById('dj-player').src = URL.createObjectURL(e.target.files[0]); };
</script>
</body>
</html>
