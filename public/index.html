<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Kararlı Yayın</title>
    <style>
        /* SİZİN ORİJİNAL STİLLERİNİZ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 8px; width: 320px; box-shadow: 0 0 20px #000; }
        #nick-input, #pass-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; outline: none; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; font-size: 13px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; }
        
        /* EK RADYO STİLLERİ */
        #radio-panel { background: #222; padding: 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #000; }
        .f-btn { background: #444; color: #fff; border: 1px solid #111; padding: 5px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; }
        .f-btn:hover { background: #555; }
        .live-pulse { width: 10px; height: 10px; background: #ff4757; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #ff4757; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <p style="color:#888; font-size:11px; margin-bottom:15px;">Sesi duymak için giriş yapmalısınız.</p>
        <input type="text" id="nick-input" placeholder="Nickiniz...">
        <div id="pass-area"><input type="password" id="pass-input" placeholder="Şifre..."></div>
        <button class="f-btn" onclick="startApp()" style="padding:10px 40px; background:#2ecc71; color:#000; font-weight:bold;">SİSTEME GİRİŞ YAP</button>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    
    <div id="radio-panel">
        <div>
            <span id="live-dot" style="display:none;" class="live-pulse"></span>
            <span id="status-text" style="font-size:11px; margin-left:5px;">YAYIN BEKLENİYOR...</span>
        </div>
        <div id="admin-controls" style="display:none; display:flex; gap:10px;">
            <input type="file" id="music-file" accept="audio/*" style="font-size:10px;">
            <button class="f-btn" onclick="toggleBroadcast()" id="broad-btn">🔴 YAYINI BAŞLAT</button>
        </div>
        <div>
            <span style="font-size:10px;">SES:</span>
            <input type="range" id="vol-control" min="0" max="1" step="0.1" value="0.5">
        </div>
    </div>

    <div style="display:flex; flex:1; overflow:hidden; padding:8px; gap:8px; background:#222;">
        <div id="messages"></div>
        <div id="user-list">
            <div id="fixed-admin" style="text-align:center; padding:10px; background:#1a1a1a; margin-bottom:10px; border-radius:4px;">
                <small style="color:#666;">YAYINCI</small><br>
                <b id="admin-name">Keyifciyiz_Fm</b>
            </div>
            <div id="users"></div>
        </div>
    </div>

    <form id="form" onsubmit="sendMsg(event)" style="display:flex; padding:10px; background:#3b3b3b; gap:5px;">
        <input id="input" autocomplete="off" placeholder="Mesajınız..." style="flex:1; background:#000; color:#fff; border:1px solid #555; padding:8px;" />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let audioCtx, gainNode, isLive = false, myRole = "";

    // 1. UYGULAMAYI VE SESİ BAŞLAT (TEK TIKLA ÇÖZÜM)
    function startApp() {
        const nick = document.getElementById('nick-input').value;
        const pass = document.getElementById('pass-input').value;
        if(!nick) return alert("Nick gir!");

        // Ses Kilidini Aç
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        gainNode = audioCtx.createGain();
        gainNode.connect(audioCtx.destination);
        
        // Boş ses gönder (Tarayıcıyı ikna et)
        const osc = audioCtx.createOscillator();
        osc.connect(gainNode);
        osc.start(0); osc.stop(0.1);

        socket.emit('join', { nick, password: pass });
    }

    socket.on('login success', d => {
        myRole = d.role;
        document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') document.getElementById('admin-controls').style.display = 'flex';
    });

    // 2. YÖNETİCİ: SES GÖNDERME
    let mediaRecorder;
    async function toggleBroadcast() {
        if (!isLive) {
            const file = document.getElementById('music-file').files[0];
            if(!file) return alert("Dosya seç!");

            const audio = new Audio(URL.createObjectURL(file));
            const stream = audio.captureStream ? audio.captureStream() : audio.mozCaptureStream();
            
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
            mediaRecorder.ondataavailable = e => {
                if(e.data.size > 0) socket.emit('audio-packet', e.data);
            };
            
            audio.play();
            mediaRecorder.start(500); // 500ms paketler
            isLive = true;
            document.getElementById('broad-btn').innerText = "⬛ DURDUR";
        } else {
            location.reload();
        }
    }

    // 3. DİNLEYİCİ: SESİ ÇALMA (PLAYER OLMADAN, DOĞRUDAN HOPARLÖRE)
    let nextTime = 0;
    socket.on('audio-stream', async (data) => {
        if(!audioCtx) return;
        
        document.getElementById('live-dot').style.display = 'inline-block';
        document.getElementById('status-text').innerText = "🔴 CANLI YAYIN";

        const buffer = await data.arrayBuffer();
        audioCtx.decodeAudioData(buffer, (decoded) => {
            const source = audioCtx.createBufferSource();
            source.buffer = decoded;
            source.connect(gainNode);
            
            if (nextTime < audioCtx.currentTime) nextTime = audioCtx.currentTime + 0.1;
            source.start(nextTime);
            nextTime += decoded.duration;
        });
    });

    // CHAT VE DİĞERLERİ
    function sendMsg(e) {
        e.preventDefault();
        const i = document.getElementById('input');
        if(i.value) { socket.emit('chat message', { text: i.value }); i.value = ''; }
    }

    socket.on('chat message', d => {
        const div = document.createElement('div');
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span>${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    document.getElementById('vol-control').oninput = (e) => {
        if(gainNode) gainNode.gain.value = e.target.value;
    };
</script>
</body>
</html>
