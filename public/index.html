<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>KeyifciyizFM - Canlı Sohbet</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #121212; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        
        /* Üst Bar */
        header { 
            background: linear-gradient(180deg, #333 0%, #000 100%); 
            padding: 10px; 
            text-align: center; 
            border-bottom: 2px solid #444;
            font-weight: bold;
            color: #00ff00; /* Flatcast yeşili */
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* Chat Penceresi */
        #chat-window { 
            flex: 3; 
            overflow-y: auto; 
            padding: 15px; 
            background: #000; 
            border-right: 1px solid #333;
        }

        /* Sağ Kullanıcı Listesi */
        #user-list { 
            flex: 1; 
            background: #1a1a1a; 
            padding: 10px; 
            font-size: 0.9em;
        }

        .user-item { color: #00ccff; margin-bottom: 5px; font-weight: bold; }

        /* Mesaj Alanı */
        .msg { margin-bottom: 8px; font-size: 0.95em; line-height: 1.4; border-bottom: 1px solid #111; padding-bottom: 4px; }
        .timestamp { color: #666; font-size: 0.8em; margin-right: 8px; }
        .username { color: #00ccff; font-weight: bold; margin-right: 5px; }

        /* Alt Giriş Alanı */
        footer { 
            background: #222; 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #444;
        }

        input { 
            flex: 1; 
            padding: 12px; 
            background: #333; 
            border: 1px solid #555; 
            color: #fff; 
            border-radius: 4px;
        }

        button { 
            padding: 10px 25px; 
            background: #0066cc; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #0052a3; }
    </style>
</head>
<body>

<header>🎵 KEYİFCİYİZFM - Yayın Akışı: Kesintisiz Müzik 🎵</header>

<div class="main-container">
    <div id="chat-window"></div>
    
    <div id="user-list">
        <h4 style="color: #888; border-bottom: 1px solid #444;">Dinleyiciler</h4>
        <div class="user-item">● Keyifciyiz_Bot</div>
        <div class="user-item">● Misafir_Konuk</div>
    </div>
</div>

<footer>
    <input type="text" id="usernameInput" placeholder="Adınız..." style="flex: 0.3;">
    <input type="text" id="messageInput" placeholder="Mesajınızı buraya yazın...">
    <button id="sendBtn">Gönder</button>
</footer>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('messageInput');
    const usernameInput = document.getElementById('usernameInput');
    const sendBtn = document.getElementById('sendBtn');

    function sendMessage() {
        const msg = messageInput.value;
        const user = usernameInput.value || "Misafir";
        
        if (msg.trim() !== "") {
            socket.emit('chat message', { user: user, text: msg });
            messageInput.value = '';
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    socket.on('chat message', function(data) {
        const now = new Date();
        const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="timestamp">(${time})</span><span class="username">${data.user}:</span> ${data.text}`;
        
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    });
</script>
</body>
</html>
