<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 8px; width: 320px; }
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .tool-group { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-right: 1px solid #555; height: 25px; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 5px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; }
        .color-trigger { font-size: 11px; color: #fff; cursor: pointer; font-weight: bold; padding: 5px 8px; border: 1px solid #555; border-radius: 3px; background: #333; }
        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; font-size: 13px; color: #fff; background-size: cover; background-position: center; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        
        /* Şeffaf Kutu Efekti */
        .user-item { display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid #222; gap: 10px; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .user-item.selected { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); }
        
        .status-box { width: 18px; height: 18px; border: 1px solid #444; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 2px; }
        .status-0 { background: #222; } .status-1 { background: #3498db; } .status-2 { background: #e74c3c; }
        #ban-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; color: #ff4757; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h3>
        <input type="text" id="nick-input" placeholder="Nickiniz..." onkeyup="document.getElementById('pass-area').style.display=(this.value==='Keyifciyiz_Fm'?'block':'none')">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre..."></div>
        <button class="f-btn" onclick="joinChat()" style="padding:10px 40px;">BAĞLAN</button>
        <p id="error-msg" style="color:#ff4757; font-size:12px; margin-top:10px; display:none;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="action-bar">
        <div class="tool-group"><button class="f-btn" onclick="changeFontSize(2)">A+</button><button class="f-btn" onclick="changeFontSize(-2)">A-</button></div>
        <div class="tool-group">
            <div class="color-trigger" onclick="document.getElementById('colorPicker').click()">Renk</div>
            <input type="color" id="colorPicker" value="#2ecc71" onchange="handleColorChange(this.value)" style="display:none;">
        </div>
        <div class="tool-group" id="admin-tools" style="display:none;">
            <button class="f-btn" onclick="socket.emit('clear chat')">🧹 Temizle</button>
        </div>
        <div style="flex:1;"></div>
        <button class="f-btn" onclick="location.reload()">Çıkış</button>
    </div>

    <div id="main-area">
        <div id="ban-overlay"><h1 style="font-size:50px;">🚫</h1><h3 id="ban-text">Yayın Sona Erdi!</h3></div>
        <div id="messages"></div>
        <div id="user-list">
            <div id="admin-box" style="padding:10px; background:#1a1a1a; border-radius:4px; margin-bottom:10px; text-align:center;">
                <span id="admin-display-nick" style="font-weight:bold; color:#ff4757;">Keyifciyiz_Fm</span>
            </div>
            <div id="users"></div>
        </div>
    </div>
    <form onsubmit="sendMessage(event)" style="display:flex; padding:10px; background:#3b3b3b; gap:5px;">
        <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
        <button type="submit" class="f-btn">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var myNick = "", myRole = "", selectedColor = "#2ecc71", privateTarget = null;

    function joinChat() {
        const n = document.getElementById('nick-input').value.trim();
        const p = document.getElementById('pass-input').value.trim();
        if(n) socket.emit('join', { nick: n, password: p });
    }

    socket.on('login success', d => { 
        myNick = d.nick; myRole = d.role; 
        document.getElementById('login-overlay').style.display = 'none'; 
        if(myRole === 'Yönetici') document.getElementById('admin-tools').style.display = 'flex';
    });

    socket.on('chat message', d => {
        const div = document.createElement('div'); div.style.marginBottom = "8px";
        div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> <span style="color:${d.color}">${d.text}</span>`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    socket.on('user list', data => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        data.list.forEach(u => {
            if(u.nick === "Keyifciyiz_Fm") { document.getElementById('admin-display-nick').style.color = u.color; return; }
            const item = document.createElement('div'); 
            item.className = 'user-item' + (privateTarget === u.nick ? ' selected' : '');
            
            item.onclick = () => { 
                if(myRole === 'Yönetici') { 
                    privateTarget = (privateTarget === u.nick) ? null : u.nick; 
                    document.getElementById('input').placeholder = privateTarget ? u.nick + " özel..." : "Mesaj yaz...";
                    socket.emit('refresh list'); // Listeyi tazele
                } 
            };
            
            const box = document.createElement('div'); box.className = `status-box status-${u.status || 0}`;
            if(u.status === 1) box.innerText = "/"; if(u.status === 2) box.innerText = "-";
            if (myRole === 'Yönetici') { box.onclick = (e) => { e.stopPropagation(); socket.emit('update status', { target: u.nick, state: ((u.status || 0) + 1) % 3 }); }; }

            const name = document.createElement('span'); name.style.color = u.color; name.innerText = u.nick;
            item.appendChild(box); item.appendChild(name); uDiv.appendChild(item);
        });
    });

    socket.on('force logout', () => { 
        document.getElementById('ban-overlay').style.display = 'flex'; 
        document.getElementById('ban-text').innerText = "YAYIN SONA ERDİ!"; 
        setTimeout(() => location.reload(), 2500); 
    });

    socket.on('status update', s => {
        document.getElementById('ban-overlay').style.display = (s === 2 ? 'flex' : 'none');
        if(s === 2) document.getElementById('ban-text').innerText = "ENGELLENDİNİZ!";
    });

    socket.on('auth error', m => { alert(m); });
    socket.on('chat cleared', () => { document.getElementById('messages').innerHTML = ''; });
    socket.on('background changed', url => { document.getElementById('messages').style.backgroundImage = `url('${url}')`; });

    function handleColorChange(c) { selectedColor = c; socket.emit('update color', c); }
    function sendMessage(e) { 
        e.preventDefault(); 
        const i = document.getElementById('input'); 
        if(i.value) { socket.emit('chat message', { text: i.value, color: selectedColor, target: privateTarget }); i.value = ''; } 
    }
</script>
</body>
</html>
