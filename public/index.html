<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sohbet - Flatcast Style Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Verdana', sans-serif; color: #ccc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Giriş Ekranı Düzenlemesi */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login-box { background: #333; padding: 30px; border: 2px solid #555; text-align: center; border-radius: 8px; width: 350px; box-shadow: 0 0 20px #000; }
        
        #chat-container { width: 950px; height: 620px; background: #3b3b3b; border: 2px solid #444; display: flex; flex-direction: column; position: relative; }
        #top-gradient { height: 15px; width: 100%; background: linear-gradient(to right, #2ecc71, #f1c40f, #e74c3c); }
        
        #action-bar { background: #4a4a4a; padding: 10px; display: flex; align-items: center; border-bottom: 2px solid #222; }
        .f-btn { background: linear-gradient(to bottom, #777, #333); border: 1px solid #111; color: #fff; padding: 6px 12px; font-size: 11px; cursor: pointer; border-radius: 3px; display: flex; align-items: center; gap: 5px; user-select: none; }
        .f-btn.active { background: #2ecc71; color: #000; }
        .f-btn:hover { background: #555; }

        #main-area { display: flex; flex: 1; overflow: hidden; background: #222; padding: 8px; gap: 8px; }
        #messages { flex: 3; background: #000; border: 1px solid #444; padding: 12px; overflow-y: auto; border-radius: 2px; font-size: 13px; color: #fff; }
        #user-list { flex: 1; background: #111; border: 1px solid #444; padding: 12px; font-size: 12px; overflow-y: auto; }
        .user-item { padding: 4px 0; border-bottom: 1px solid #222; }

        #emoji-panel { display: none; position: absolute; bottom: 65px; left: 15px; background: #333; border: 2px solid #555; padding: 10px; flex-wrap: wrap; gap: 12px; width: 240px; border-radius: 5px; box-shadow: 0 -5px 15px rgba(0,0,0,0.8); z-index: 1000; }
        .emoji-item { font-size: 24px; cursor: pointer; transition: transform 0.1s; display: inline-block; }
        
        form#form { display: flex; padding: 12px; background: #3b3b3b; gap: 8px; border-top: 1px solid #222; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #555; padding: 10px; outline: none; }
        
        /* Inputlar için ortak stil */
        .auth-input { padding: 10px; margin-bottom: 12px; width: 100%; background: #111; color: #fff; border: 1px solid #555; border-radius: 4px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h3 id="auth-title" style="color:#f1c40f; margin-bottom:20px; font-size: 18px;">Sohbet Girişi</h3>
        <input type="text" id="nick-input" class="auth-input" placeholder="Kullanıcı Adı" maxlength="15">
        <input type="password" id="pass-input" class="auth-input" placeholder="Şifre">
        
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 5px;">
            <button id="main-auth-btn" class="f-btn" style="padding: 8px 15px;" onclick="handleAuth()">GİRİŞ YAP</button>
            <button id="switch-btn" class="f-btn" style="background: #555; padding: 8px 15px;" onclick="toggleAuthMode()">KAYIT OL</button>
        </div>
        <p id="auth-msg" style="font-size:11px; margin-top:15px; color:#e74c3c; height: 15px;"></p>
    </div>
</div>

<div id="chat-container">
    <div id="top-gradient"></div>
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmojiPanel()">😊 Emojiler</button>
        <div style="display: flex; gap: 5px; margin-left: 15px; border-left: 1px solid #555; padding-left: 15px;">
            <button class="f-btn" onclick="changePersonalSize(2)">➕</button>
            <button class="f-btn" onclick="changePersonalSize(-2)">➖</button>
        </div>
        <div style="display: flex; gap: 5px; margin-left: 15px; border-left: 1px solid #555; padding-left: 15px;">
            <button id="btn-bold" class="f-btn" onclick="toggleStyle('bold')"><b>A</b></button>
            <button id="btn-italic" class="f-btn" onclick="toggleStyle('italic')"><i>I</i></button>
            <button id="btn-underline" class="f-btn" onclick="toggleStyle('underline')"><u>U</u></button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-left: 15px; border-left: 1px solid #555; padding-left: 15px;">
            <input type="color" id="colorPicker" value="#2ecc71" onchange="changeColor(this.value)" style="width:35px; height:22px; cursor:pointer; background:none; border:1px solid #222;">
            <span style="font-size:10px; color:#aaa;">RENK</span>
        </div>
        <div style="flex: 1;"></div>
        <button class="f-btn" onclick="location.reload()">👤 Çıkış</button>
    </div>

    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b style="color:#f1c40f">Dinleyiciler</b><hr style="margin:10px 0; border:#333 1px solid;"><div id="users"></div></div>
    </div>

    <div id="emoji-panel">
        <span class="emoji-item" onclick="addEmoji('😊')">😊</span>
        <span class="emoji-item" onclick="addEmoji('😂')">😂</span>
        <span class="emoji-item" onclick="addEmoji('😉')">😉</span>
        <span class="emoji-item" onclick="addEmoji('😍')">😍</span>
        <span class="emoji-item" onclick="addEmoji('😎')">😎</span>
        <span class="emoji-item" onclick="addEmoji('🔥')">🔥</span>
        <span class="emoji-item" onclick="addEmoji('👍')">👍</span>
        <span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
        <span class="emoji-item" onclick="addEmoji('🌹')">🌹</span>
        <span class="emoji-item" onclick="addEmoji('🎵')">🎵</span>
    </div>

    <form id="form" onsubmit="sendMessage(event)">
        <input id="input" autocomplete="off" placeholder="Mesajınız..." />
        <button type="submit" class="f-btn" style="padding: 0 20px;">GÖNDER</button>
    </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    var socket = io();
    var isRegisterMode = false;
    var personalFontSize = 13;
    var selectedColor = "#2ecc71";
    var styles = { bold: false, italic: false, underline: false };

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').innerText = isRegisterMode ? "Yeni Kayıt" : "Sohbet Girişi";
        document.getElementById('auth-title').style.color = isRegisterMode ? "#2ecc71" : "#f1c40f";
        document.getElementById('main-auth-btn').innerText = isRegisterMode ? "KAYDOL" : "GİRİŞ YAP";
        document.getElementById('switch-btn').innerText = isRegisterMode ? "İPTAL" : "KAYIT OL";
        document.getElementById('auth-msg').innerText = "";
    }

    function handleAuth() {
        var nick = document.getElementById('nick-input').value.trim();
        var pass = document.getElementById('pass-input').value.trim();
        if(!nick || !pass) { document.getElementById('auth-msg').innerText = "Alanları doldurun!"; return; }
        
        if(isRegisterMode) { socket.emit('register', { nick: nick, password: pass }); }
        else { socket.emit('login', { nick: nick, password: pass }); }
    }

    socket.on('auth error', (msg) => { document.getElementById('auth-msg').style.color = "#e74c3c"; document.getElementById('auth-msg').innerText = msg; });
    socket.on('auth success', (msg) => { toggleAuthMode(); document.getElementById('auth-msg').style.color = "#2ecc71"; document.getElementById('auth-msg').innerText = msg; });
    socket.on('login success', () => { document.getElementById('login-overlay').style.display = 'none'; });

    function toggleEmojiPanel() { var p = document.getElementById('emoji-panel'); p.style.display = (p.style.display === 'flex') ? 'none' : 'flex'; }
    function addEmoji(e) { document.getElementById('input').value += e; document.getElementById('input').focus(); }
    function changePersonalSize(a) { personalFontSize += a; if(personalFontSize < 10) personalFontSize = 10; document.getElementById('messages').style.fontSize = personalFontSize + "px"; }
    
    function toggleStyle(t) {
        styles[t] = !styles[t];
        document.getElementById('btn-' + t).classList.toggle('active');
        var inp = document.getElementById('input');
        if(t === 'bold') inp.style.fontWeight = styles.bold ? 'bold' : 'normal';
        if(t === 'italic') inp.style.fontStyle = styles.italic ? 'italic' : 'normal';
        if(t === 'underline') inp.style.textDecoration = styles.underline ? 'underline' : 'none';
    }

    function changeColor(c) { selectedColor = c; document.getElementById('input').style.color = c; socket.emit('change color', c); }

    function sendMessage(e) {
        e.preventDefault();
        var input = document.getElementById('input');
        if (input
