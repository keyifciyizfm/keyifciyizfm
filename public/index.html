<div id="emoji-panel" style="display: none; position: absolute; bottom: 60px; left: 10px; background: #333; border: 2px solid #555; padding: 10px; flex-wrap: wrap; gap: 10px; width: 220px; border-radius: 5px; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 1000;">
    <span onclick="addEmoji('😊')" style="font-size: 25px; cursor: pointer;">😊</span>
    <span onclick="addEmoji('😂')" style="font-size: 25px; cursor: pointer;">😂</span>
    <span onclick="addEmoji('😉')" style="font-size: 25px; cursor: pointer;">😉</span>
    <span onclick="addEmoji('😍')" style="font-size: 25px; cursor: pointer;">😍</span>
    <span onclick="addEmoji('😎')" style="font-size: 25px; cursor: pointer;">😎</span>
    <span onclick="addEmoji('🔥')" style="font-size: 25px; cursor: pointer;">🔥</span>
    <span onclick="addEmoji('❤️')" style="font-size: 25px; cursor: pointer;">❤️</span>
    <span onclick="addEmoji('🌹')" style="font-size: 25px; cursor: pointer;">🌹</span>
</div>

<script>
    // Yeni basit fonksiyon
    function addEmoji(emoji) {
        document.getElementById('input').value += emoji; 
        document.getElementById('input').focus();
    }
</script>
