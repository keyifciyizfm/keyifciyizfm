<script>
    // ... (diğer fonksiyonlar aynı kalıyor)

    socket.on('chat message', (d) => {
        var div = document.createElement('div');
        div.style.marginBottom = "8px";
        if(d.system) {
            div.innerHTML = `<small style="color:#888"><i>${d.text}</i></small>`;
        } else {
            var s = d.style || {};
            var styleStr = `color:${d.color}; ${s.bold?'font-weight:bold;':''} ${s.italic?'font-style:italic;':''} ${s.underline?'text-decoration:underline;':''}`;
            
            // Role göre etiketler
            var badge = "";
            if(d.role === 'Yönetici') badge = `<span style="background:#ff4757; color:#fff; font-size:9px; padding:2px 4px; border-radius:2px; margin-right:5px;">SAHİBİ</span>`;
            else if(d.role === 'Admin') badge = `<span style="background:#e67e22; color:#fff; font-size:9px; padding:2px 4px; border-radius:2px; margin-right:5px;">ADM</span>`;
            else if(d.role === 'DJ') badge = `<span style="background:#f1c40f; color:#000; font-size:9px; padding:2px 4px; border-radius:2px; margin-right:5px;">DJ</span>`;

            div.innerHTML = `${badge}<b style="color:${d.color}; cursor:pointer" onclick="admMenu('${d.user}', '${d.role}')">${d.user}:</b> <span style="${styleStr}">${d.text}</span>`;
        }
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    function admMenu(targetNick, targetRole) {
        // Eğer tıklayan kişi yetkili değilse veya kendine tıklıyorsa işlem yapma
        if ((myRole !== 'Yönetici' && myRole !== 'Admin') || targetNick === myNick) return;

        var msg = targetNick + " için işlem seçin:\n\n" +
                  "1: At (Kick)\n" +
                  "2: Yasakla (IP Ban)\n" +
                  "3: DJ Yetkisi Ver\n";
        
        // Sadece ana yönetici Admin atayabilir
        if (myRole === 'Yönetici') {
            msg += "4: Admin Yetkisi Ver";
        }

        var choice = prompt(msg);

        if (choice === "1") socket.emit('admin command', {action: 'kick', targetNick: targetNick});
        if (choice === "2") socket.emit('admin command', {action: 'ban', targetNick: targetNick});
        if (choice === "3") socket.emit('admin command', {action: 'make_dj', targetNick: targetNick});
        if (choice === "4" && myRole === 'Yönetici') socket.emit('admin command', {action: 'make_admin', targetNick: targetNick});
    }
</script>
