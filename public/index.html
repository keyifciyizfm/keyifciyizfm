<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyifciyiz FM - DJ Panel & Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --accent: #e67e22; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: 'Tahoma', sans-serif; margin: 0; display: flex; height: 100vh; flex-direction: column; overflow: hidden; }
        
        /* GİRİŞ */
        #login-box { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #login-box input { padding: 12px; margin: 5px; width: 250px; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; }
        #login-box button { padding: 12px 30px; background: var(--accent); border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }

        /* DJ MIXER PANEL (FLATCAST STİLİ) */
        .dj-mixer { 
            background: #222; border: 2px solid #444; margin: 10px; padding: 10px; 
            display: none; flex-direction: column; gap: 5px; width: 300px; position: absolute; top: 50px; left: 10px; z-index: 50; box-shadow: 0 0 15px #000;
        }
        .mixer-header { background: #444; padding: 5px; font-size: 11px; font-weight: bold; display: flex; justify-content: space-between; }
        .mixer-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .mixer-btn { background: #555; border: 1px solid #666; color: #fff; font-size: 10px; padding: 5px; cursor: pointer; }
        .mixer-btn:hover { background: var(--accent); color: #000; }
        #stream-url { width: 93%; background: #000; border: 1px solid #444; color: #0f0; font-size: 11px; padding: 5px; margin-top: 5px; }

        /* ANA YAPI */
        .header { background: #111; padding: 10px; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        #messages { flex: 1; padding: 15px; overflow-y: auto; background: rgba(0,0,0,0.5); }
        .msg-card { display: flex; gap: 10px; margin-bottom: 12px; background: rgba(20,20,20,0.8); padding: 10px; border-radius: 5px; border-left: 3px solid var(--accent); }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); }
        .nick { color: var(--accent); font-weight: bold; }

        .sidebar { width: 220px; background: #111; border-left: 1px solid #333; }
        .user-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #222; font-size: 13px; }

        .input-area { background: #111; padding: 10px; display: flex; gap: 10px; }
        #m-input { flex: 1; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="login-box">
    <h2 style="color:var(--accent)">KEYİFCİYİZ FM</h2>
    <input type="text" id="u-name" placeholder="Rumuz...">
    <input type="password" id="u-pass" placeholder="Şifre (Opsiyonel)">
    <button onclick="join()">ODAYA GİR</button>
</div>

<div class="header">
    <div id="dj-status" style="color:red; font-weight:bold">● YAYINDA: SİSTEM</div>
    <button onclick="toggleMixer()" id="dj-btn" style="display:none; background:#444; border:none; color:white; font-size:10px;">DJ MIXER AÇ</button>
</div>

<div class="dj-mixer" id="mixer">
    <div class="mixer-header"><span>DJ MIXER v4.15</span> <span onclick="toggleMixer()" style="cursor:pointer">X</span></div>
    <input type="text" id="stream-url" placeholder="MP3 Linki Yapıştır...">
    <div class="mixer-controls">
        <button class="mixer-btn" onclick="playMusic()">OYNAT / YAYIN VER</button>
        <button class="mixer-btn" onclick="stopMusic()">YAYINI KES</button>
    </div>
    <div style="font-size:9px; color:#888; margin-top:5px;">Not: Sadece .mp3 uzantılı linkler çalışır.</div>
</div>

<div class="input-area">
    <input type="text" id="m-input" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:5px; font-weight:bold;">GÖNDER</button>
</div>

<div class="main-container">
    <div id="messages"></div>
    <div class="sidebar">
        <div style="background:var(--accent); color:#000; padding:5px; text-align:center; font-weight:bold; font-size:12px;">ONLINE ÜYELER</div>
        <div id="user-list"></div>
    </div>
</div>

<audio id="radio-player" style="display:none"></audio>

<script>
    const socket = io();
    let myProfile = {};
    const player = document.getElementById('radio-player');

    function join() {
        const name = document.getElementById('u-name').value;
        const pass = document.getElementById('u-pass').value;
        if(name) socket.emit('join', { username: name, password: pass });
    }

    socket.on('loginApproved', (data) => {
        myProfile = data;
        document.getElementById('login-box').style.display = 'none';
        // Eğer DJ veya Süper Adminse Mixer butonunu göster
        if(data.role === "DJ" || data.role === "SÜPER ADMİN") {
            document.getElementById('dj-btn').style.display = 'block';
        }
    });

    // Müzik Yayını Kontrolü
    function toggleMixer() {
        const m = document.getElementById('mixer');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    }

    function playMusic() {
        const url = document.getElementById('stream-url').value;
        if(url) socket.emit('startStream', { url: url, dj: myProfile.username });
    }

    function stopMusic() {
        socket.emit('stopStream');
    }

    // Yayını Herkeste Başlat
    socket.on('streamStarted', (data) => {
        player.src = data.url;
        player.play().catch(e => console.log("Otomatik oynatma engellendi, etkileşim lazım."));
        document.getElementById('dj-status').innerText = `● YAYINDA: ${data.dj}`;
    });

    socket.on('streamStopped', () => {
        player.pause();
        player.src = "";
        document.getElementById('dj-status').innerText = `● YAYIN KAPALI`;
    });

    socket.on('message', (d) => {
        const m = document.getElementById('messages');
        m.innerHTML += `
            <div class="msg-card">
                <img src="https://ui-avatars.com/api/?name=${d.user}&background=random" class="avatar">
                <div>
                    <div class="nick">${d.user} <small style="color:#555">[${d.role}]</small></div>
                    <div class="text">${d.text}</div>
                </div>
            </div>`;
        m.scrollTop = m.scrollHeight;
    });

    socket.on('updateUserList', (users) => {
        const list = document.getElementById('user-list');
        list.innerHTML = '';
        users.forEach(u => {
            list.innerHTML += `<div class="user-row">
                <img src="https://ui-avatars.com/api/?name=${u.username}&background=random" style="width:20px; border-radius:50%">
                ${u.username} <small style="color:var(--accent); font-size:9px">${u.role}</small>
            </div>`;
        });
    });

    function send() {
        const i = document.getElementById('m-input');
        if(i.value) { socket.emit('sendMessage', i.value); i.value = ''; }
    }
</script>
</body>
</html>
