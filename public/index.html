<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Keyifciyiz FM - Live Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Verdana', sans-serif; }
        body { background: #111; color: #eee; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        #login-box { background: #222; padding: 30px; border-radius: 10px; text-align: center; border: 1px solid #444; width: 320px; }
        
        #chat-container { width: 950px; height: 600px; background: #1a1a1a; display: flex; flex-direction: column; border: 1px solid #333; border-radius: 8px; position: relative; }
        #action-bar { background: #252525; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #333; }
        
        #main-area { display: flex; flex: 1; overflow: hidden; padding: 10px; gap: 10px; }
        #messages { flex: 3; background: #000; padding: 15px; overflow-y: auto; border-radius: 5px; font-size: 13px; }
        #user-list { flex: 1; background: #181818; padding: 15px; border-radius: 5px; font-size: 12px; }
        
        form#form { padding: 15px; background: #222; display: flex; gap: 10px; }
        #input { flex: 1; background: #000; color: #fff; border: 1px solid #444; padding: 10px; outline: none; }
        
        .f-btn { background: #444; color: #fff; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 11px; }
        .f-btn:hover { background: #555; }
        
        /* MIXER PANEL */
        #dj-mixer { display: none; position: fixed; top: 20px; right: 20px; width: 240px; background: #222; border: 2px solid #f1c40f; border-radius: 10px; padding: 15px; z-index: 5000; box-shadow: 0 0 20px #000; cursor: move; }
        .mixer-header { color: #f1c40f; font-weight: bold; font-size: 11px; margin-bottom: 10px; text-align: center; }
        
        #emoji-panel { display: none; position: absolute; bottom: 70px; left: 15px; background: #222; border: 1px solid #444; padding: 10px; gap: 10px; width: 250px; flex-wrap: wrap; z-index: 100; }
        #custom-menu { display: none; position: absolute; background: #333; border: 1px solid #f1c40f; width: 140px; z-index: 6000; }
        .menu-item { padding: 8px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div id="login-box">
        <h2 style="color:#2ecc71; margin-bottom:15px;">Keyifciyiz FM</h2>
        <input type="text" id="nick-input" placeholder="Nick" oninput="checkAdmin(this.value)" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff; border:1px solid #444;">
        <div id="pass-area" style="display:none;"><input type="password" id="pass-input" placeholder="Şifre" style="width:100%; padding:10px; margin-bottom:10px; background:#000; color:#fff; border:1px solid #444;"></div>
        <button class="f-btn" style="width:100%; background:#2ecc71; color:#000;" onclick="joinChat()">GİRİŞ</button>
        <p id="error-msg" style="color:red; font-size:11px; margin-top:10px;"></p>
    </div>
</div>

<div id="dj-mixer">
    <div class="mixer-header">🎧 DJ STUDIO CONTROL</div>
    <button id="stream-btn" onclick="toggleStream()" style="width:100%; padding:10px; background:#2ecc71; border:none; color:#fff; font-weight:bold; cursor:pointer; border-radius:5px;">🔴 YAYINI BAŞLAT</button>
    
    <div style="margin-top:10px; background:#111; padding:10px; border-radius:5px;">
        <label style="font-size:10px; color:#f1c40f; display:block; text-align:center; cursor:pointer;">📂 MÜZİK SEÇ <input type="file" id="music-upload" hidden onchange="handleMusic(event)"></label>
        <div id="track-name" style="font-size:9px; color:#aaa; margin-top:5px; text-align:center;">Parça: Bekleniyor</div>
        <audio id="dj-player" controls style="width:100%; height:25px; margin-top:5px;"></audio>
    </div>
    
    <input type="range" min="0" max="100" value="80" style="width:100%; margin-top:10px;" oninput="document.getElementById('dj-player').volume = this.value/100">
    <div id="status" style="font-size:10px; color:#ff4757; text-align:center; margin-top:10px; font-weight:bold;">OFFLINE</div>
</div>

<div id="custom-menu">
    <div class="menu-item" onclick="kickAction()" style="color:red;">Kov</div>
    <div class="menu-item" onclick="banAction()">IP Ban</div>
</div>

<div id="chat-container">
    <div id="action-bar">
        <button class="f-btn" onclick="toggleEmoji()">😊</button>
        <input type="color" id="colorPicker" value="#2ecc71" style="width:30px; border:none; background:none;">
        <div style="flex:1"></div>
        <button class="f-btn" onclick="location.reload()" style="background:#e74c3c;">ÇIK</button>
    </div>
    <div id="main-area">
        <div id="messages"></div>
        <div id="user-list"><b>Dinleyiciler</b><hr style="margin:5px 0; opacity:0.2;"><div id="users"></div></div>
    </div>
    <div id="emoji-panel"></div>
    <form id="form" onsubmit="sendMsg(event)"><input id="input" placeholder="Mesaj..." autocomplete="off"><button class="f-btn">GÖNDER</button></form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myRole = "", selectedTarget = "", isStreaming = false;
    let mediaRecorder, audioCtx, dest;

    // Login & User List
    function checkAdmin(v) { document.getElementById('pass-area').style.display = (v === "Keyifciyiz_Fm") ? "block" : "none"; }
    function joinChat() {
        const n = document.getElementById('nick-input').value, p = document.getElementById('pass-input').value;
        socket.emit('join', { nick: n, password: p });
    }
    socket.on('login success', d => {
        myRole = d.role; document.getElementById('login-overlay').style.display = 'none';
        if(myRole === 'Yönetici') { 
            document.getElementById('dj-mixer').style.display = 'block';
            makeDraggable(document.getElementById('dj-mixer'));
        }
    });
    socket.on('user list', list => {
        const uDiv = document.getElementById('users'); uDiv.innerHTML = '';
        list.forEach(u => {
            const d = document.createElement('div'); d.style.color = u.color; d.style.padding = "3px 0"; d.style.cursor = "pointer";
            d.innerText = (u.role === "Yönetici" ? "🎙 " : "🎧 ") + u.nick;
            d.onclick = (e) => { selectedTarget = u.nick; const m = document.getElementById('custom-menu'); m.style.display = 'block'; m.style.left = e.pageX + "px"; m.style.top = e.pageY + "px"; e.stopPropagation(); };
            uDiv.appendChild(d);
        });
    });

    // Ses İletim Sistemi (Broadcasting)
    async function toggleStream() {
        const btn = document.getElementById('stream-btn');
        const status = document.getElementById('status');
        if(!isStreaming) {
            isStreaming = true; btn.innerText = "⏹ YAYINI DURDUR"; btn.style.background = "#e74c3c"; status.innerText = "LIVE"; status.style.color = "#2ecc71";
            
            // Mikrofon + Müzik Birleştirme
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
            const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx.createMediaStreamSource(mic).connect(dest);
            audioCtx.createMediaElementSource(document.getElementById('dj-player')).connect(dest);
            audioCtx.createMediaElementSource(document.getElementById('dj-player')).connect(audioCtx.destination);

            mediaRecorder = new MediaRecorder(dest.stream);
            mediaRecorder.ondataavailable = e => socket.emit('audio-data', e.data);
            mediaRecorder.start(200);
        } else {
            location.reload(); // En güvenli durdurma yöntemi
        }
    }

    // Dinleyici Ses Alımı
    let nextTime = 0;
    socket.on('audio-stream', async blobData => {
        if (myRole === 'Yönetici') return;
        if (!window.listCtx) window.listCtx = new AudioContext();
        const buffer = await window.listCtx.decodeAudioData(await new Blob([blobData]).arrayBuffer());
        const source = window.listCtx.createBufferSource();
        source.buffer = buffer; source.connect(window.listCtx.destination);
        const now = window.listCtx.currentTime;
        if (nextTime < now) nextTime = now;
        source.start(nextTime); nextTime += buffer.duration;
    });

    // Sohbet Fonksiyonları
    function sendMsg(e) { e.preventDefault(); const i = document.getElementById('input'); if(i.value) { socket.emit('chat message', { text: i.value, color: document.getElementById('colorPicker').value }); i.value = ''; } }
    socket.on('chat message', d => {
        const div = document.createElement('div'); div.innerHTML = `<b style="color:${d.color}">${d.user}:</b> ${d.text}`;
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    });

    function handleMusic(e) { const file = e.target.files[0]; if(file) { document.getElementById('dj-player').src = URL.createObjectURL(file); document.getElementById('track-name').innerText = file.name; } }
    function toggleEmoji() { const p = document.getElementById('emoji-panel'); p.style.display = p.style.display === 'flex' ? 'none' : 'flex'; }
    document.addEventListener('click', () => document.getElementById('custom-menu').style.display = 'none');
    
    function kickAction() { socket.emit('admin command', {action: 'kick', targetNick: selectedTarget}); }
    function banAction() { socket.emit('admin command', {action: 'ban', targetNick: selectedTarget}); }

    function makeDraggable(el) {
        let p1=0, p2=0, p3=0, p4=0;
        el.onmousedown = (e) => { if(e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') { p3=e.clientX; p4=e.clientY; document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; }; document.onmousemove = (e) => { p1=p3-e.clientX; p2=p4-e.clientY; p3=e.clientX; p4=e.clientY; el.style.top = (el.offsetTop-p2)+"px"; el.style.left = (el.offsetLeft-p1)+"px"; }; } };
    }
</script>
</body>
</html>
